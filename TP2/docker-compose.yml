services:
  mysql:
    image: mysql:8.4
    container_name: tp2-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: integrador2

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
