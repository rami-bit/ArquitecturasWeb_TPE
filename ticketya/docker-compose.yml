services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  catalog-service:
    build:
      context: ./services/catalog-service
    environment:
      SERVER_PORT: ${CATALOG_SERVER_PORT}
      DB_URL: ${CATALOG_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      INVENTORY_SERVICE_URL: ${CATALOG_INVENTORY_SERVICE_URL}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS}
      CATALOG_CACHE_MAX_ENTRIES: ${CATALOG_CACHE_MAX_ENTRIES}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${CATALOG_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  inventory-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      SERVER_PORT: ${INVENTORY_SERVER_PORT}
      DB_URL: ${INVENTORY_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_SERVICE_URL: ${INVENTORY_CATALOG_SERVICE_URL}
      INVENTORY_HOLD_TTL_SECONDS: ${INVENTORY_HOLD_TTL_SECONDS}
    depends_on:
      inventory-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${INVENTORY_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  ticket-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${TICKET_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ticket-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  ticket-service:
    build:
      context: ./services/ticket-service
    environment:
      SERVER_PORT: ${TICKET_SERVER_PORT}
      DB_URL: ${TICKET_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TICKET_QR_SIGNING_SECRET: ${TICKET_QR_SIGNING_SECRET}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL}
    depends_on:
      ticket-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${TICKET_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  purchase-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${PURCHASE_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - purchase-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  payment-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${PAYMENT_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  payment-mock:
    build:
      context: .
      dockerfile: services/payment-mock/Dockerfile
    environment:
      SERVER_PORT: ${PAYMENT_SERVER_PORT}
      DB_URL: ${PAYMENT_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      payment-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PAYMENT_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  queue-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${QUEUE_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - queue-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  queue-service:
    build:
      context: .
      dockerfile: services/queue-service/Dockerfile
    environment:
      SERVER_PORT: ${QUEUE_SERVER_PORT}
      DB_URL: ${QUEUE_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_SERVICE_URL: ${QUEUE_CATALOG_SERVICE_URL}
      QUEUE_BATCH_SIZE: ${QUEUE_BATCH_SIZE}
      QUEUE_BATCH_INTERVAL_SECONDS: ${QUEUE_BATCH_INTERVAL_SECONDS}
      QUEUE_ADMISSION_TTL_SECONDS: ${QUEUE_ADMISSION_TTL_SECONDS}
      QUEUE_ADMISSION_SECRET: ${QUEUE_ADMISSION_SECRET}
    depends_on:
      queue-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${QUEUE_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  purchase-service:
    build:
      context: .
      dockerfile: services/purchase-service/Dockerfile
    environment:
      SERVER_PORT: ${PURCHASE_SERVER_PORT}
      DB_URL: ${PURCHASE_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_SERVICE_URL: ${PURCHASE_CATALOG_SERVICE_URL}
      INVENTORY_SERVICE_URL: ${PURCHASE_INVENTORY_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PURCHASE_PAYMENT_SERVICE_URL}
      TICKET_SERVICE_URL: ${PURCHASE_TICKET_SERVICE_URL}
      QUEUE_SERVICE_URL: ${PURCHASE_QUEUE_SERVICE_URL}
      PURCHASE_TICKET_LIMIT: ${PURCHASE_TICKET_LIMIT}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL}
      PURCHASE_CIRCUIT_FAILURE_THRESHOLD: ${PURCHASE_CIRCUIT_FAILURE_THRESHOLD}
      PURCHASE_CIRCUIT_OPEN_SECONDS: ${PURCHASE_CIRCUIT_OPEN_SECONDS}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
    depends_on:
      purchase-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-mock:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      queue-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PURCHASE_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  # E2-02: bitácora centralizada. Los productores envían fire-and-forget, por
  # eso no dependen de que audit-service esté arriba para arrancar.
  audit-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${AUDIT_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - audit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    environment:
      SERVER_PORT: ${AUDIT_SERVER_PORT}
      DB_URL: ${AUDIT_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      audit-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${AUDIT_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  preferences-db:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${PREFERENCES_MONGODB_DATABASE}
    volumes:
      - preferences-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - ticketya

  preferences-service:
    build:
      context: .
      dockerfile: services/preferences-service/Dockerfile
    environment:
      PREFERENCES_SERVER_PORT: ${PREFERENCES_SERVER_PORT}
      PREFERENCES_MONGODB_URI: ${PREFERENCES_MONGODB_URI}
      PREFERENCES_MONGODB_DATABASE: ${PREFERENCES_MONGODB_DATABASE}
      PREFERENCES_CATALOG_SERVICE_URL: ${PREFERENCES_CATALOG_SERVICE_URL}
      PREFERENCES_PURCHASE_SERVICE_URL: ${PREFERENCES_PURCHASE_SERVICE_URL}
      PREFERENCES_CANDIDATE_LIMIT: ${PREFERENCES_CANDIDATE_LIMIT}
      PREFERENCES_HTTP_CONNECT_TIMEOUT_MS: ${PREFERENCES_HTTP_CONNECT_TIMEOUT_MS}
      PREFERENCES_HTTP_READ_TIMEOUT_MS: ${PREFERENCES_HTTP_READ_TIMEOUT_MS}
    depends_on:
      preferences-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PREFERENCES_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  # PDF-F11: notificaciones. Purchase y Catalog envían fire-and-forget y
  # Notification Service resuelve destinatarios con reintentos, por eso no hay
  # dependencias de arranque entre ellos.
  notification-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      SERVER_PORT: ${NOTIFICATION_SERVER_PORT}
      DB_URL: ${NOTIFICATION_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      NOTIFICATION_PURCHASE_SERVICE_URL: ${NOTIFICATION_PURCHASE_SERVICE_URL}
      NOTIFICATION_PREFERENCES_SERVICE_URL: ${NOTIFICATION_PREFERENCES_SERVICE_URL}
      NOTIFICATION_CHANNELS: ${NOTIFICATION_CHANNELS}
      NOTIFICATION_PROVIDER_MODE: ${NOTIFICATION_PROVIDER_MODE}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS}
      NOTIFICATION_RETRY_BASE_DELAY_MS: ${NOTIFICATION_RETRY_BASE_DELAY_MS}
    depends_on:
      notification-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${NOTIFICATION_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      SERVER_PORT: ${GATEWAY_SERVER_PORT}
      CATALOG_SERVICE_URL: ${GATEWAY_CATALOG_SERVICE_URL}
      INVENTORY_SERVICE_URL: ${GATEWAY_INVENTORY_SERVICE_URL}
      PURCHASE_SERVICE_URL: ${GATEWAY_PURCHASE_SERVICE_URL}
      QUEUE_SERVICE_URL: ${GATEWAY_QUEUE_SERVICE_URL}
      TICKET_SERVICE_URL: ${GATEWAY_TICKET_SERVICE_URL}
      AUDIT_SERVICE_URL: ${GATEWAY_AUDIT_SERVICE_URL}
      GATEWAY_PREFERENCES_SERVICE_URL: ${GATEWAY_PREFERENCES_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${GATEWAY_NOTIFICATION_SERVICE_URL}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI}
    depends_on:
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      purchase-service:
        condition: service_healthy
      queue-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      preferences-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    # Permite que el Gateway alcance un IdP de prueba en el host (tools/local-test-idp)
    # también en Docker Engine para Linux; Docker Desktop ya resuelve este nombre.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_SERVER_PORT}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${GATEWAY_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

networks:
  ticketya:

volumes:
  catalog-postgres-data:
  inventory-postgres-data:
  ticket-postgres-data:
  purchase-postgres-data:
  payment-postgres-data:
  queue-postgres-data:
  audit-postgres-data:
  preferences-mongo-data:
  notification-postgres-data:
