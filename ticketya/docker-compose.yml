services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  catalog-service:
    build:
      context: ./services/catalog-service
    environment:
      SERVER_PORT: ${CATALOG_SERVER_PORT}
      DB_URL: ${CATALOG_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      INVENTORY_SERVICE_URL: ${CATALOG_INVENTORY_SERVICE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${CATALOG_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  inventory-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      SERVER_PORT: ${INVENTORY_SERVER_PORT}
      DB_URL: ${INVENTORY_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_SERVICE_URL: ${INVENTORY_CATALOG_SERVICE_URL}
      INVENTORY_HOLD_TTL_SECONDS: ${INVENTORY_HOLD_TTL_SECONDS}
    depends_on:
      inventory-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${INVENTORY_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  ticket-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${TICKET_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ticket-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  ticket-service:
    build:
      context: ./services/ticket-service
    environment:
      SERVER_PORT: ${TICKET_SERVER_PORT}
      DB_URL: ${TICKET_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TICKET_QR_SIGNING_SECRET: ${TICKET_QR_SIGNING_SECRET}
    depends_on:
      ticket-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${TICKET_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  purchase-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${PURCHASE_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - purchase-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  payment-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${PAYMENT_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketya

  payment-mock:
    build:
      context: .
      dockerfile: services/payment-mock/Dockerfile
    environment:
      SERVER_PORT: ${PAYMENT_SERVER_PORT}
      DB_URL: ${PAYMENT_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      payment-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PAYMENT_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  purchase-service:
    build:
      context: .
      dockerfile: services/purchase-service/Dockerfile
    environment:
      SERVER_PORT: ${PURCHASE_SERVER_PORT}
      DB_URL: ${PURCHASE_DB_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_SERVICE_URL: ${PURCHASE_CATALOG_SERVICE_URL}
      INVENTORY_SERVICE_URL: ${PURCHASE_INVENTORY_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PURCHASE_PAYMENT_SERVICE_URL}
      TICKET_SERVICE_URL: ${PURCHASE_TICKET_SERVICE_URL}
      PURCHASE_TICKET_LIMIT: ${PURCHASE_TICKET_LIMIT}
    depends_on:
      purchase-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-mock:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PURCHASE_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      SERVER_PORT: ${GATEWAY_SERVER_PORT}
      CATALOG_SERVICE_URL: ${GATEWAY_CATALOG_SERVICE_URL}
      INVENTORY_SERVICE_URL: ${GATEWAY_INVENTORY_SERVICE_URL}
      PURCHASE_SERVICE_URL: ${GATEWAY_PURCHASE_SERVICE_URL}
    depends_on:
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      purchase-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_SERVER_PORT}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${GATEWAY_SERVER_PORT}/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - ticketya

networks:
  ticketya:

volumes:
  catalog-postgres-data:
  inventory-postgres-data:
  ticket-postgres-data:
  purchase-postgres-data:
  payment-postgres-data:
