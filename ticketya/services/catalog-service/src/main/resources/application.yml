server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketya_catalog}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
# PDF-NF-CACHE: cache en memoria del catálogo publicado (nunca de disponibilidad).
catalog:
  cache:
    ttl-seconds: ${CATALOG_CACHE_TTL_SECONDS:30}
    max-entries: ${CATALOG_CACHE_MAX_ENTRIES:200}

inventory:
  base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  connect-timeout-ms: ${INVENTORY_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${INVENTORY_READ_TIMEOUT_MS:5000}

# E2-02: cada línea de log incluye el servicio y el X-Correlation-Id de la solicitud (MDC).
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

# E2-02: bitácora centralizada. Vacío = sólo log local (p. ej. en pruebas).
ticketya:
  audit:
    url: ${AUDIT_SERVICE_URL:}
  # PDF-F11: cambios de evento hacia Notification Service. Vacío = sólo log local.
  notifications:
    url: ${NOTIFICATION_SERVICE_URL:}
