server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketya_catalog}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
inventory:
  base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  connect-timeout-ms: ${INVENTORY_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${INVENTORY_READ_TIMEOUT_MS:5000}