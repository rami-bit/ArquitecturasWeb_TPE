server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: purchase-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:purchase_db}}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  sql:
    init:
      mode: always

purchase:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  ticket:
    url: ${TICKET_SERVICE_URL:http://localhost:8083}
  ticket-limit: ${PURCHASE_TICKET_LIMIT:6}
  hold-ttl-seconds: ${INVENTORY_HOLD_TTL_SECONDS:600}
