server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: payment-mock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketya_payment}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
