openapi: 3.0.3
info:
  title: TicketYa Payment Mock (internal)
  version: 0.1.0
  description: Simulated idempotent payments and refunds for local purchase flows.
servers:
  - url: http://payment-mock:8085
paths:
  /internal/payments:
    post:
      summary: Create or recover a simulated charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              orderId: 4ef45f2a-87eb-4c40-9840-e08d4db5e345
              amount: 25000.00
              currency: ARS
              method: CARD
              token: tok_approved
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '200':
          description: Same charge already exists for this order
        '400':
          description: Invalid charge
        '409':
          description: Idempotency conflict
  /internal/payments/{paymentId}/refunds:
    post:
      summary: Create or recover a partial refund for an approved charge
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey:
                  type: string
                  example: order-4ef45f2a-refund
                amount:
                  type: number
                  minimum: 0.01
                  description: Amount to refund; omitted only for a full refund.
                  example: 12500.00
      responses:
        '201':
          description: Refund created or recovered with the same idempotency key
          content:
            application/json:
              example:
                refundId: 424a327a-f1bf-4775-b538-f63750b2dfca
                paymentId: 4ef45f2a-87eb-4c40-9840-e08d4db5e345
                amount: 12500.00
                status: REFUNDED
        '404':
          description: Payment not found
        '409':
          description: Payment not refundable, total refunds exceed charge, or idempotency conflict
  /internal/payments/{paymentId}/refund:
    post:
      summary: Refund the full charge once, for purchase compensation
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment with status REFUNDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404': { description: Payment not found }
        '409': { description: Payment cannot be fully refunded }
components:
  schemas:
    PaymentRequest:
      type: object
      required: [orderId, amount, currency, method, token]
      properties:
        orderId: { type: string, format: uuid }
        amount: { type: number, minimum: 0.01 }
        currency: { type: string, enum: [ARS] }
        method: { type: string, enum: [CARD, WALLET, CASH] }
        token: { type: string, enum: [tok_approved, tok_rejected, tok_pending] }
    Payment:
      type: object
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        method: { type: string, enum: [CARD, WALLET, CASH] }
        status: { type: string, enum: [APPROVED, REJECTED, PENDING, REFUNDED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
