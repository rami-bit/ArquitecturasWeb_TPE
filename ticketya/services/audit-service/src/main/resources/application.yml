server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: audit-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketya_audit}
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs

# Cada línea de log incluye el servicio y el X-Correlation-Id de la solicitud (MDC).
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
