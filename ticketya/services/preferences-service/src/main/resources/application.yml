server:
  port: ${PREFERENCES_SERVER_PORT:8087}

spring:
  application:
    name: preferences-service
  data:
    mongodb:
      uri: ${PREFERENCES_MONGODB_URI:mongodb://localhost:27017}

preferences:
  mongodb:
    database: ${PREFERENCES_MONGODB_DATABASE:ticketya_preferences}
  catalog:
    base-url: ${PREFERENCES_CATALOG_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: ${PREFERENCES_HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PREFERENCES_HTTP_READ_TIMEOUT_MS:5000}
  purchase:
    base-url: ${PREFERENCES_PURCHASE_SERVICE_URL:http://localhost:8084}
    connect-timeout-ms: ${PREFERENCES_HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PREFERENCES_HTTP_READ_TIMEOUT_MS:5000}
  candidate-limit: ${PREFERENCES_CANDIDATE_LIMIT:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
