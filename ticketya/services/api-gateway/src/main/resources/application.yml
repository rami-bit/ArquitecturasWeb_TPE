server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Route order matters: the inventory prefix must win over the catalog catch-all.
      # Internal commands (/internal/**) are intentionally not routed.
      routes:
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
        - id: purchase-service
          uri: ${PURCHASE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/purchases/**
        - id: refund-service
          uri: ${PURCHASE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/refunds/**
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
