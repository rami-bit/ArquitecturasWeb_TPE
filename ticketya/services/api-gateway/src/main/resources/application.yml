server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9999}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9999/.well-known/jwks.json}
  cloud:
    gateway:
      # Route order matters: the inventory prefix must win over the catalog catch-all.
      # Internal commands (/internal/**) are intentionally not routed.
      routes:
        - id: queue-service
          uri: ${QUEUE_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/queue/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
        - id: purchase-service
          uri: ${PURCHASE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/orders,/api/orders/**
        - id: refund-service
          uri: ${PURCHASE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/refunds/**
        - id: event-cancellation-service
          uri: ${PURCHASE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/events/*/cancellation
        # E2-03: control de acceso QR (Ticket Service).
        - id: access-control-service
          uri: ${TICKET_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/access/**
        # E2-04: reportes del organizador (Purchase Service).
        - id: organizer-report-service
          uri: ${PURCHASE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/reports/**
        # E2-02: consulta de la bitácora centralizada (Audit Service).
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/audit/**
        # PDF-F10: preferencias y recomendaciones del cliente autenticado. Debe ir
        # antes del comodín de catálogo para no ser absorbida por /api/**.
        - id: preferences-service
          uri: ${GATEWAY_PREFERENCES_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/customers/**
        # PDF-F11: bandeja de notificaciones del cliente (Notification Service).
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/notifications/**
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
