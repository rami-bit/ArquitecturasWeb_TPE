          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── E2-04 REPORTES DEL ORGANIZADOR (PURCHASE) ──────────────────────────────

  /api/reports/events/{eventId}:
    get:
      tags: [Organizer reports]
      operationId: getOrganizerEventReport
      summary: Reporte de ventas, devoluciones, ocupación y recaudación por sector
      description: |
        `ORGANIZER` sólo puede consultar sus eventos (Catalog aplica el ownership
        y responde `403` si el evento es ajeno); `ADMIN` puede consultar
        cualquiera.

        - `soldTickets`: unidades de órdenes pagadas (`CONFIRMED` o
          `PAID_PENDING_TICKETS`), incluidas las luego devueltas.
        - `refundedTickets` / `refundedAmount`: devoluciones con reintegro
          completado (individuales o por cancelación, una vez por entrada).
        - `activeTickets = soldTickets - refundedTickets`.
        - `occupancyPercent = activeTickets / capacity * 100` (2 decimales).
        - `netRevenue = grossRevenue - refundedAmount`.

        La capacidad proviene de Inventory. Si Inventory no responde, el reporte
        se entrega igual con `capacity` y `occupancyPercent` en `null`,
        `capacityAvailable: false` y una advertencia en `warnings`. El reporte se
        calcula en cada consulta y no se cachea.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reporte del evento.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizerEventReport' }
              example:
                eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
                eventName: Recital Rosario
                eventStatus: PUBLISHED
                eventStartsAt: '2027-03-10T21:00:00Z'
                organizerId: 7f9c2f43-8a8f-4c1e-9c43-6f0f1c2b9a10
                currency: ARS
                generatedAt: '2026-11-17T18:00:00Z'
                capacityAvailable: true
                sectors:
                  - sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
                    sourceSectorId: 9c8d7e6f-5a4b-4c3d-8e2f-1a0b9c8d7e6f
                    sectorName: Campo
                    sectorType: GENERAL_ADMISSION
                    unitPrice: 5000.00
                    capacity: 100
                    soldTickets: 4
                    refundedTickets: 1
                    activeTickets: 3
                    occupancyPercent: 3.00
                    grossRevenue: 20000.00
                    refundedAmount: 5000.00
                    netRevenue: 15000.00
                totals:
                  capacity: 100
                  soldTickets: 4
                  refundedTickets: 1
                  activeTickets: 3
                  occupancyPercent: 3.00
                  grossRevenue: 20000.00
                  refundedAmount: 5000.00
                  netRevenue: 15000.00
                warnings: []
        '401':
          description: Token Bearer ausente, inválido o vencido; lo responde el Gateway sin invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Rol distinto de ORGANIZER/ADMIN, o evento de otro organizador.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Evento inexistente.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Catalog no disponible para autorizar el reporte.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── E2-02 BITÁCORA CENTRALIZADA (AUDIT) ────────────────────────────────────

  /api/audit/events:
    get:
      tags: [Audit log]
      operationId: searchAuditEvents
      summary: Buscar eventos de auditoría por filtros
      description: |
        Sólo `ADMIN`. Todos los filtros son opcionales y se combinan con AND.
        Resultados ordenados del más reciente al más antiguo.
      parameters:
        - { name: correlationId, in: query, required: false, schema: { type: string } }
        - { name: service, in: query, required: false, schema: { type: string, example: purchase-service } }
        - { name: operation, in: query, required: false, schema: { type: string, example: PURCHASE_ORDER } }
        - { name: outcome, in: query, required: false, schema: { type: string, example: CONFIRMED } }
        - { name: resourceId, in: query, required: false, schema: { type: string } }
        - { name: actorId, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de eventos de auditoría.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '400':
          description: Filtros o paginación inválidos (p. ej. `from` posterior a `to`).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Token Bearer ausente, inválido o vencido; lo responde el Gateway sin invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: El rol no es ADMIN.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/audit/traces/{correlationId}:
    get:
      tags: [Audit log]
      operationId: getAuditTrace
      summary: Seguir una operación a través de los microservicios
      description: |
        Sólo `ADMIN`. Devuelve en orden cronológico todos los eventos de
        auditoría con el mismo `X-Correlation-Id` (p. ej. Purchase → Ticket en
        una compra, o Purchase → Catalog → Ticket en una cancelación).
      parameters:
        - { name: correlationId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Recorrido de la operación.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditTrace' }
              example:
                correlationId: cancel-e88d7b2d
                eventCount: 3
                services: [catalog-service, ticket-service, purchase-service]
                startedAt: '2026-11-17T18:00:00.120Z'
                endedAt: '2026-11-17T18:00:00.410Z'
                events:
                  - eventId: 4f3c2b1a-0e9d-4c8b-a7f6-e5d4c3b2a190
                    correlationId: cancel-e88d7b2d
                    service: catalog-service
                    operation: EVENT_CATALOG_CANCELLATION
                    outcome: CANCELLED
                    actorId: a1b2c3d4-1111-2222-3333-444455556666
                    actorRole: ADMIN
                    resourceType: EVENT
                    resourceId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
                    occurredAt: '2026-11-17T18:00:00.120Z'
                    receivedAt: '2026-11-17T18:00:00.131Z'
                    details: { eventName: Recital Rosario }
        '401':
          description: Token Bearer ausente, inválido o vencido; lo responde el Gateway sin invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: El rol no es ADMIN.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No hay eventos para ese identificador.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/customers/me/preferences:
    put:
      tags: [Customer preferences]
      operationId: replaceCustomerPreferences
      summary: Registrar o reemplazar las preferencias del cliente autenticado
      description: |
        Escribe el documento de preferencias del cliente identificado por el `sub`
        del JWT validado. La operacion es idempotente: repetirla con el mismo
        contenido no crea un segundo documento y devuelve `version`
        incrementada. La identidad se deriva exclusivamente del `sub`; el cuerpo
        no acepta `customerId`, `version` ni `updatedAt` (responden `400`).

        - `city`: opcional; si se informa, no vacia y de hasta 120 caracteres.
        - `eventTypes`: hasta 10 elementos, cada uno no vacio y de hasta 80
          caracteres, sin duplicados ignorando mayusculas.
        - `favoriteArtists`: hasta 20 elementos, cada uno no vacio y de hasta
          200 caracteres, sin duplicados ignorando mayusculas.
        - `updatedAt` y `version` los gestiona el servidor.

        `PUT` devuelve `200` con la representacion resultante, incluido
        `version`; `GET` devuelve `200` con ciudad nula, listas vacias y
        `version` `0` cuando el cliente todavia no registro preferencias.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPreferencesRequest' }
            example:
              city: Buenos Aires
              eventTypes: [CONCIERTO, TEATRO]
              favoriteArtists: [Artista A, Artista B]
      responses:
        '200':
          description: Preferencias registradas.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPreferencesResponse' }
              example:
                city: Buenos Aires
                eventTypes: [CONCIERTO, TEATRO]
                favoriteArtists: [Artista A, Artista B]
                updatedAt: '2026-11-20T12:00:00Z'
                version: 1
        '400':
          description: Preferencias invalidas (campo vacio, demasiado largo, duplicado o identidad en el cuerpo).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Preferencias invalidas
                status: 400
                detail: favoriteArtists no puede superar los 20 elementos.
                instance: /api/customers/me/preferences
                correlationId: trace-preferences-1
        '401':
          description: Token ausente, invalido o vencido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Rol distinto de CLIENT.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Customer preferences]
      operationId: getCustomerPreferences
      summary: Consultar las preferencias del cliente autenticado
      description: |
        Devuelve las preferencias del cliente identificado por el `sub` del JWT
        validado. Si el cliente todavia no registro preferencias, responde `200`
        con `city` nula, `eventTypes` y `favoriteArtists` vacias y `version`
        `0`, sin crear el documento.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Preferencias del cliente.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPreferencesResponse' }
              example:
                city: null
                eventTypes: []
                favoriteArtists: []
                updatedAt: null
                version: 0
        '401':
          description: Token ausente, invalido o vencido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Rol distinto de CLIENT.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/customers/me/recommendations:
    get:
      tags: [Event recommendations]
      operationId: getCustomerRecommendations
      summary: Recomendar eventos publicados y futuros afines al cliente
      description: |
        Calcula en cada consulta hasta `limit` eventos `PUBLISHED` con `startsAt`
        futuro que el cliente no haya comprado, ordenados por afinidad. No
        informa disponibilidad ni reserva inventario.

        Puntaje explicable: `3` por tipo favorito, `2` por artista del evento en
        favoritos con tope de tres, `2` por coincidir la ciudad,
        `min(5, coCompras)` y `1` si el evento ocurre dentro de los proximos 30
        dias. El puntaje maximo es `17`; un candidato con `score` `0` no se
        devuelve en modo normal.

        Degradacion: si Purchase no responde, se responde `200` con
        `warnings: ["HISTORY_UNAVAILABLE"]`; si Catalog no responde, se
        responde `503`. Sin preferencias ni historial se devuelven los proximos
        eventos con `score` `0` y motivo `UPCOMING_FALLBACK`.
      parameters:
        - name: limit
          in: query
          required: false
          description: Cantidad maxima de recomendaciones (1 a 20).
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
          example: 10
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Recomendaciones del cliente.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventRecommendationPage' }
              example:
                items:
                  - eventId: 3f6f1c2a-8e6b-4a1d-9a2c-5d7e8f9a0b1c
                    name: Recital de Primavera
                    eventType: CONCIERTO
                    startsAt: '2026-12-05T21:00:00Z'
                    city: Buenos Aires
                    participants: [Artista A]
                    minPrice: 5000.0
                    score: 12
                    reasons: [FAVORITE_EVENT_TYPE, FAVORITE_ARTIST, SAME_CITY]
                warnings: [HISTORY_UNAVAILABLE]
                generatedAt: '2026-11-20T12:00:00Z'
        '400':
          description: Limite fuera de rango o no numerico.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Limite invalido
                status: 400
                detail: limit debe ser un numero entre 1 y 20.
                instance: /api/customers/me/recommendations
                correlationId: trace-preferences-2
        '401':
          description: Token ausente, invalido o vencido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Rol distinto de CLIENT.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Catalog no disponible; no hay candidatos que recomendar.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /internal/audit-events:
    post:
      tags: [Audit ingestion (internal)]
      operationId: recordAuditEvent
      security: []
      summary: Registrar un evento de auditoría (interno, idempotente por eventId)
      description: |
        Lo invocan Catalog, Ticket y Purchase en forma asíncrona
        (fire-and-forget) con timeouts cortos y reintentos. Reenviar el mismo
        `eventId` responde `202` con `duplicate: true` sin duplicar el registro.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditEventRequest' }
            example:
              eventId: 4f3c2b1a-0e9d-4c8b-a7f6-e5d4c3b2a190
              correlationId: purchase-7b1f
              service: purchase-service
              operation: PURCHASE_ORDER
              outcome: CONFIRMED
              actorId: 66bd0a43-1baa-4f7b-8316-930593b84d7c
              actorRole: CLIENT
              resourceType: ORDER
              resourceId: 0a9b8c7d-6e5f-4a3b-9c2d-1e0f9a8b7c6d
              occurredAt: '2026-11-17T18:00:00Z'
              details: { httpStatus: 201, ticketCount: 2 }
      responses:
        '202':
          description: Evento registrado, o reintento ya registrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditIngestResponse' }
        '400':
          description: Evento inválido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/customers/{customerId}/recommendation-signals:
    get:
      tags: [Recommendation contracts (internal)]
      operationId: getRecommendationSignals
      summary: Senales de historial de compras de un cliente
      description: |
        Contrato interno de solo lectura sobre `purchase_orders`, consumido por
        Preferences Service. Devuelve los eventos con al menos una orden en
        estado `CONFIRMED` o `PAID_PENDING_TICKETS` del cliente y las
        co-compras: para cada evento que el cliente no compro, la cantidad de
        clientes distintos que compraron ese evento y ademas alguno de los
        eventos del cliente. Las co-compras se ordenan por `count` descendente
        y `eventId` ascendente, con tope de 200. Un cliente sin compras recibe
        `200` con listas vacias. No expone montos, pagos ni tickets.
      security: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Senales del cliente.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationSignals' }
              example:
                customerId: 8f14e45f-ceea-467f-a8a4-0f1b2f0f9c11
                purchasedEventIds: [3f6f1c2a-8e6b-4a1d-9a2c-5d7e8f9a0b1c]
                coPurchases:
                  - eventId: 9c8d7e6f-5a4b-4c3d-8e2f-1a0b9c8d7e6f
                    count: 4
                generatedAt: '2026-11-20T12:00:00Z'
  /internal/events/recommendation-candidates:
    get:
      tags: [Recommendation contracts (internal)]
      operationId: getRecommendationCandidates
      summary: Candidatos publicados y futuros para recomendar
      description: |
        Contrato interno de solo lectura sobre `event_snapshots`, consumido por
        Preferences Service. Devuelve los eventos `PUBLISHED` con `startsAt`
        futuro, ordenados por `startsAt` ascendente y `eventId` ascendente,
        acotados por `limit` (por omision y maximo 200). Informa `eventId`,
        `name`, `eventType`, `startsAt`, `city`, `participants` y `minPrice`;
        no informa disponibilidad, cupos ni stock.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Cantidad maxima de candidatos (1 a 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
          example: 200
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Candidatos disponibles.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCandidatePage' }
              example:
                items:
                  - eventId: 3f6f1c2a-8e6b-4a1d-9a2c-5d7e8f9a0b1c
                    name: Recital de Primavera
                    eventType: CONCIERTO
                    startsAt: '2026-12-05T21:00:00Z'
                    city: Buenos Aires
                    participants: [Artista A, Artista B]
                    minPrice: 5000.0
                generatedAt: '2026-11-20T12:00:00Z'
        '400':
          description: Limite fuera de rango.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  # ─── PDF-F11 NOTIFICACIONES ────────────────────────────────────────────────

  /api/notifications/me:
    get:
      tags: [Customer notifications]
      operationId: listMyNotifications
      summary: Listar las notificaciones del cliente autenticado
      description: |
        Sólo `CLIENT`; la identidad sale del `sub` del JWT. Más recientes
        primero. Cada hecho genera una notificación por canal (`EMAIL` y `PUSH`).
        La entrega es asíncrona: una notificación recién creada puede figurar
        `PENDING` unos segundos antes de pasar a `SENT`.
      parameters:
        - { name: type, in: query, required: false, schema: { type: string, enum: [ORDER_CONFIRMED, ORDER_CANCELLED, EVENT_PUBLISHED, EVENT_SUSPENDED, EVENT_RESUMED, EVENT_CANCELLED] } }
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de notificaciones.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerNotificationPage' }
              example:
                items:
                  - notificationId: 7c1e2d3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
                    type: ORDER_CONFIRMED
                    channel: EMAIL
                    subject: 'Compra confirmada: Recital Rosario'
                    body: Tu orden 0a9b8c7d-6e5f-4a3b-9c2d-1e0f9a8b7c6d fue confirmada (2027-03-10T21:00Z). Tus entradas con QR ya están disponibles en la app.
                    status: SENT
                    eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
                    orderId: 0a9b8c7d-6e5f-4a3b-9c2d-1e0f9a8b7c6d
                    correlationId: purchase-7b1f
                    attempts: 1
                    createdAt: '2026-11-20T18:00:00.120Z'
                    sentAt: '2026-11-20T18:00:01.010Z'
                page: 0
                size: 20
                totalItems: 1
        '400':
          description: 'Paginación o tipo inválidos.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: 'Token Bearer ausente, inválido o vencido; lo responde el Gateway.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: 'El rol no es CLIENT.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/notifications:
    post:
      tags: [Notification ingestion (internal)]
      operationId: recordOrderNotification
      security: []
      summary: Registrar una compra confirmada o cancelada
      description: |
        Lo invoca Purchase sin bloquear la compra (pool acotado, timeouts y
        circuit breaker; ante falla queda el log local). Idempotente por
        `type` + `orderId`: reenviar responde `202` con `duplicate: true`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderNotificationRequest' }
            example:
              type: ORDER_CONFIRMED
              orderId: 0a9b8c7d-6e5f-4a3b-9c2d-1e0f9a8b7c6d
              customerId: 66bd0a43-1baa-4f7b-8316-930593b84d7c
              correlationId: purchase-7b1f
              eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
              eventName: Recital Rosario
              eventStartsAt: '2027-03-10T21:00:00Z'
      responses:
        '202':
          description: Registrado, o reintento ya registrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationIngestResponse' }
        '400':
          description: 'Hecho inválido (tipo no permitido o campos faltantes).'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/notifications/event-changes:
    post:
      tags: [Notification ingestion (internal)]
      operationId: recordEventChangeNotification
      security: []
      summary: Registrar la publicación, suspensión, reanudación o cancelación de un evento
      description: |
        Lo invoca Catalog después del commit de la transición. Publicación y
        cancelación se deduplican por `type` + `eventId`; suspensión y
        reanudación, que pueden repetirse, por `type` + `eventId` + `changeId`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventChangeNotificationRequest' }
            example:
              type: EVENT_PUBLISHED
              eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
              changeId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a8b
              eventName: Recital Rosario
              startsAt: '2027-03-10T21:00:00-03:00'
              city: Rosario
              participants: [Banda Uno]
      responses:
        '202':
          description: Registrado, o reintento ya registrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationIngestResponse' }
        '400':
          description: 'Hecho inválido (tipo no permitido o campos faltantes).'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/events/{eventId}/buyers:
    get:
      tags: [Notification recipients (internal)]
      operationId: listEventBuyers
      security: []
      summary: Clientes con compras pagadas de un evento (Purchase)
      description: |
        Sólo identificadores de cliente distintos con órdenes `CONFIRMED` o
        `PAID_PENDING_TICKETS`; sin órdenes, montos ni tickets.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Compradores del evento (lista vacía si no hay ventas).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventBuyers' }

  /internal/preferences/matches:
    get:
      tags: [Notification recipients (internal)]
      operationId: findPreferenceMatches
      security: []
      summary: Clientes con algún artista favorito en una ciudad (Preferences)
      description: |
        Coincidencia exacta, sin distinguir mayúsculas ni espacios extremos, de
        la ciudad y de al menos un artista favorito. Sin `city` o sin `artist`
        responde una lista vacía. Hasta 50 artistas.
      parameters:
        - { name: city, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: artist, in: query, required: false, schema: { type: array, items: { type: string, maxLength: 200 } }, style: form, explode: true }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Clientes que coinciden.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceMatches' }
        '400':
          description: 'Parámetros fuera de rango.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado por el proveedor de identidad externo. Claims:
        `sub` (UUID) y `roles` (lista con exactamente un valor:
        CLIENT, ORGANIZER, ADMIN o ACCESS_STAFF). El Gateway valida
        firma, expiración y claims; los servicios internos conservan
        autorización de dominio (rol y ownership) sobre la identidad
        derivada.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Identificador de correlación opcional. Si se envía no vacío, el servicio
        lo conserva; si falta, genera un UUID. Siempre se devuelve en el header
        de response del mismo nombre.
      schema:
        type: string
        minLength: 1
        example: trace-inventory-1

    EventId:
      name: eventId
      in: path
      required: true
      description: Identificador del evento.
      schema:
        type: string
        format: uuid
        example: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b

    OrderId:
      name: orderId
      in: path
      required: true
      description: |
        Identificador de la orden de compra que actúa como clave de idempotencia
        de la reserva.
      schema:
        type: string
        format: uuid
        example: 5e3f0a4e-1b2c-4d3e-8f90-a1b2c3d4e5f6

    ReservationId:
      name: reservationId
      in: path
      required: true
      description: Identificador de la reserva temporal.
      schema:
        type: string
        format: uuid
        example: 7a6b5c4d-3e2f-41a0-9b8c-7d6e5f4a3b2c



    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave de idempotencia del comprador para `POST /api/orders`. Es
        obligatoria, de 1 a 120 caracteres. Junto con el `sub` del JWT identifica la
        solicitud: la misma clave con el mismo contenido devuelve la orden
        existente; con otro contenido responde `409`.
      schema:
        type: string
        minLength: 1
        maxLength: 120
        example: order-key-2026-11-07-0001

    AdmissionToken:
      name: X-Admission-Token
      in: header
      required: false
      description: |
        Token de admisión de la fila virtual. Es obligatorio **sólo** cuando el
        evento es de alta demanda (`highDemand: true`); en los demás eventos se
        ignora. Es opaco, está ligado al evento y al comprador, tiene vigencia
        corta y es de un solo uso. Habilitar el intento de compra no reserva ni
        garantiza inventario. El Gateway lo reenvía tal cual: no es un encabezado
        de identidad.
      schema:
        type: string
        minLength: 1
        example: 8wJk2s0aQm1c9XZr3bT4uY6vN0pL5hS7dF1gH2jK3mQ

    PaymentId:
      name: paymentId
      in: path
      required: true
      description: Identificador del pago en Payment Mock.
      schema:
        type: string
        format: uuid
        example: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a

    PageNumber:
      name: page
      in: query
      required: false
      description: Número de página solicitado, base cero.
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0

    PageSize:
      name: size
      in: query
      required: false
      description: Cantidad de órdenes por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
        example: 20

    OrderStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Filtro opcional por estado de la orden. Si falta se devuelven órdenes en
        cualquier estado.
      schema:
        type: string
        enum:
          - CONFIRMED
          - REJECTED
          - PAYMENT_PENDING
          - PAID_PENDING_TICKETS
          - COMPENSATED
        example: CONFIRMED

    CustomerId:
      name: customerId
      in: path
      required: true
      description: UUID del cliente cuyas senales se consultan.
      schema:
        type: string
        format: uuid
      example: 8f14e45f-ceea-467f-a8a4-0f1b2f0f9c11
  headers:
    CorrelationId:
      description: |
        Correlation ID conservado o generado por el servicio. Es obligatorio en
        toda respuesta exitosa y de error.
      required: true
      schema:
        type: string
        minLength: 1
        example: trace-inventory-1

  schemas:
    QueueEntry:
      type: object
      description: |
        Turno del cliente en la fila virtual de un evento de alta demanda. Nunca
        informa la disponibilidad de entradas ni la cantidad de lugares libres.
      additionalProperties: false
      required:
        - entryId
        - eventId
        - position
        - peopleAhead
        - batchSize
        - batchNumber
        - status
        - admissionToken
        - admissionExpiresAt
      properties:
        entryId:
          type: string
          format: uuid
          description: Identificador del turno.
        eventId:
          type: string
          format: uuid
          description: Evento de la fila.
        position:
          type: integer
          format: int64
          minimum: 1
          description: |
            Posición del turno en la fila. Las posiciones no se reutilizan cuando
            un turno se cierra.
        peopleAhead:
          type: integer
          format: int64
          minimum: 0
          description: Cantidad de turnos activos que preceden a este.
        batchSize:
          type: integer
          minimum: 1
          description: Tamaño de la tanda vigente.
        batchNumber:
          type: integer
          minimum: 0
          description: |
            Número de tandas transcurridas desde la apertura de la fila,
            calculado a partir del intervalo configurado.
        status:
          type: string
          enum: [WAITING, ADMITTED, CONSUMED, EXPIRED, LEFT]
          description: |
            Estado del turno: `WAITING` espera su tanda, `ADMITTED` puede comprar
            dentro de la vigencia de su token, y `CONSUMED`, `EXPIRED` y `LEFT`
            son estados cerrados.
        admissionToken:
          type: string
          nullable: true
          description: |
            Token de admisión de un solo uso. Sólo se informa con estado
            `ADMITTED`; en los demás casos es `null`.
        admissionExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Vencimiento del token de admisión. Sólo se informa con estado
            `ADMITTED`; en los demás casos es `null`.

    AdmissionValidationRequest:
      type: object
      additionalProperties: false
      required: [eventId, clientId, token]
      properties:
        eventId: { type: string, format: uuid, description: Evento de la fila. }
        clientId: { type: string, format: uuid, description: Comprador que presenta el token. }
        token: { type: string, minLength: 1, description: Token de admisión a validar y consumir. }
        idempotencyKey:
          type: string
          maxLength: 120
          description: |
            `Idempotency-Key` de la orden que consume el token. Queda registrada
            en el turno para trazabilidad del consumo.
        correlationId: { type: string, description: Correlation ID de la operación de compra. }

    AdmissionValidationResponse:
      type: object
      additionalProperties: false
      required: [admitted, admissionId, expiresAt]
      properties:
        admitted: { type: boolean, description: Siempre `true` en una respuesta `200`. }
        admissionId: { type: string, format: uuid, description: Identificador del turno consumido. }
        expiresAt:
          type: string
          format: date-time
          description: Vencimiento que tenía el token al consumirse.

    CancellationProgress:
      type: object
      required: [eventId, status, totalTickets, completedTickets, pendingTickets]
      properties:
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [PROCESSING, COMPLETED] }
        totalTickets: { type: integer, minimum: 0 }
        completedTickets: { type: integer, minimum: 0 }
        pendingTickets: { type: integer, minimum: 0 }
      example: { eventId: 'e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b', status: COMPLETED, totalTickets: 2, completedTickets: 2, pendingTickets: 0 }
    RefundView:
      type: object
      required: [id, ticketId, orderId, eventId, amount, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        amount: { type: number, format: double, minimum: 0 }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, COMPLETED] }
        decision: { type: string, enum: [APPROVED, REJECTED], nullable: true }
        progress: { type: string, enum: [NOT_STARTED, TICKET_REVOKED, PAYMENT_REFUNDED, COMPLETED] }
        createdAt: { type: string, format: date-time }
      example:
        id: 'b766df75-bfc3-4d64-b502-ea24dca4ef34'
        ticketId: '2a2383ad-0396-4465-820f-5d75710c0206'
        orderId: 'c3d0a75d-ac17-4d33-a240-aa91c492cd89'
        eventId: 'e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b'
        amount: 12000.00
        status: COMPLETED
        decision: APPROVED
        progress: COMPLETED
        createdAt: '2026-11-10T12:00:00Z'
    AvailabilityResponse:
      type: object
      description: |
        Disponibilidad agregada de un evento. Es la superficie pública donde el
        cliente descubre `sectorId` y `seatId` para reutilizarlos al reservar.
        Nunca incluye precios, comprador, `orderId` ni `reservationId`.
      additionalProperties: false
      required:
        - eventId
        - generatedAt
        - sectors
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador del evento consultado.
        generatedAt:
          type: string
          format: date-time
          description: |
            Momento en que Inventory calculó la disponibilidad. Antes de
            responder se liberaron las reservas vencidas del evento.
        sectors:
          type: array
          description: |
            Sectores del evento ordenados de forma estable por `name` ascendente
            y luego por `sectorId`. No incluye datos sensibles.
          items:
            $ref: '#/components/schemas/SectorAvailability'

    SectorAvailability:
      type: object
      additionalProperties: false
      required:
        - sectorId
        - sourceSectorId
        - name
        - type
        - capacity
        - sold
        - reserved
        - available
      properties:
        sectorId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del sector (`inventory_sectors.id`). Es el
            valor que debe reutilizarse en `ReservationItemRequest.sectorId`.
        sourceSectorId:
          type: string
          format: uuid
          description: Identificador del sector de origen en Catalog, usado para cruzar precios.
        name:
          type: string
          maxLength: 120
          description: Nombre del sector en el snapshot del evento.
        type:
          type: string
          enum:
            - NUMBERED
            - GENERAL_ADMISSION
          description: Tipo de sector.
        capacity:
          type: integer
          minimum: 1
          description: Capacidad total del sector; siempre mayor que cero.
        sold:
          type: integer
          minimum: 0
          description: |
            Cantidad de lugares vendidos (`SOLD`). En sectores numerados se
            deriva de los estados de los asientos.
        reserved:
          type: integer
          minimum: 0
          description: |
            Cantidad de lugares retenidos por reservas vigentes (`HELD`). En
            sectores numerados se deriva de los estados de los asientos.
        available:
          type: integer
          minimum: 0
          description: |
            Lugares disponibles: `capacity - sold - reserved`. En sectores
            numerados equivale a la cantidad de asientos `AVAILABLE`.
        seats:
          type: array
          description: |
            Mapa de asientos. Presente sólo para sectores `NUMBERED`; ausente en
            `GENERAL_ADMISSION`. Ordenado por `row` y luego por `number`.
          items:
            $ref: '#/components/schemas/SeatAvailability'

    SeatAvailability:
      type: object
      additionalProperties: false
      required:
        - seatId
        - sourceSeatId
        - row
        - number
        - status
      properties:
        seatId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del asiento (`inventory_items.id`). Es el
            valor que debe reutilizarse en `ReservationItemRequest.seatId`.
        sourceSeatId:
          type: string
          format: uuid
          description: Identificador del asiento de origen en Catalog.
        row:
          type: string
          maxLength: 40
          description: Fila del asiento.
        number:
          type: integer
          minimum: 1
          description: Número del asiento dentro de la fila.
        status:
          type: string
          enum:
            - AVAILABLE
            - HELD
            - SOLD
          description: |
            `AVAILABLE` si puede reservarse; `HELD` si está retenido por una
            reserva vigente; `SOLD` si ya fue vendido.

    ReservationRequest:
      type: object
      additionalProperties: false
      required:
        - orderId
        - eventId
        - items
      properties:
        orderId:
          type: string
          format: uuid
          description: |
            Identificador de la orden de compra. Junto con el fingerprint del
            contenido forma la clave de idempotencia de la reserva.
        eventId:
          type: string
          format: uuid
          description: Evento sobre el que se reserva.
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            Retención solicitada en segundos. Opcional; si falta se usa el
            `holdTtlSeconds` vigente del evento. El valor por defecto del evento
            es 600 s y el rango permitido es 60..3600 s.
        items:
          type: array
          minItems: 1
          description: |
            Lugares a retener. La reserva es atómica: si un ítem no puede
            retenerse, se revierte la solicitud completa.
          items:
            $ref: '#/components/schemas/ReservationItemRequest'

    ReservationItemRequest:
      type: object
      description: |
        Debe informarse exactamente uno de `seatId` o `quantity`. Si viene
        `seatId`, la cantidad implícita es 1 y el sector debe ser `NUMBERED`. Si
        viene `quantity`, se reservan cupos de un sector `GENERAL_ADMISSION`.
      additionalProperties: false
      required:
        - sectorId
      properties:
        sectorId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del sector, descubierto en la
            disponibilidad pública.
        seatId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del asiento, descubierto en la
            disponibilidad pública. Excluyente con `quantity`; la cantidad
            implícita es 1.
        quantity:
          type: integer
          minimum: 1
          description: |
            Cantidad de cupos a retener en un sector de admisión general.
            Excluyente con `seatId`.

    ReservationResponse:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - orderId
        - eventId
        - status
        - createdAt
        - items
      properties:
        reservationId:
          type: string
          format: uuid
          description: Identificador de la reserva temporal.
        orderId:
          type: string
          format: uuid
          description: Orden de compra asociada a la reserva.
        eventId:
          type: string
          format: uuid
          description: Evento de la reserva.
        status:
          type: string
          enum:
            - ACTIVE
            - CONFIRMED
            - RELEASED
            - EXPIRED
          description: Estado actual de la reserva.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Vencimiento de la retención. Es `null` cuando no aplica o cuando la
            reserva ya venció o fue liberada.
        createdAt:
          type: string
          format: date-time
          description: Momento de creación de la reserva.
        items:
          type: array
          description: Ítems retenidos por la reserva.
          items:
            $ref: '#/components/schemas/ReservationItem'

    ReservationItem:
      type: object
      description: |
        Ítem de una reserva. Los ítems de asiento numerado tienen `seatId` y
        cantidad 1; los de admisión general tienen `seatId` nulo y la cantidad
        solicitada.

        Inventory agrega los datos de origen y presentación que Purchase necesita
        para valorizar la orden y emitir tickets sin acceder a `inventory_db`:
        `sourceSectorId`, `sourceSeatId`, `sectorName`, `sectorType`, `rowLabel` y
        `seatNumber`.

        Para sectores `GENERAL_ADMISSION`, `seatId`, `sourceSeatId`, `rowLabel` y
        `seatNumber` son `null` y `quantity` es mayor que cero. Para sectores
        `NUMBERED`, `quantity` es 1 y `rowLabel`/`seatNumber` describen el asiento.
        La respuesta nunca incluye precios, comprador, tokens ni identificadores
        de pago.
      additionalProperties: false
      required:
        - sectorId
        - seatId
        - quantity
        - sourceSectorId
        - sourceSeatId
        - sectorName
        - sectorType
        - rowLabel
        - seatNumber
      properties:
        sectorId:
          type: string
          format: uuid
          description: Identificador de Inventory del sector.
        seatId:
          type: string
          format: uuid
          nullable: true
          description: |
            Identificador de Inventory del asiento, o `null` para admisión
            general.
        quantity:
          type: integer
          minimum: 1
          description: Cantidad retenida. Siempre 1 para ítems con `seatId`.
        sourceSectorId:
          type: string
          format: uuid
          description: |
            Identificador de origen del sector en Catalog
            (`sourceSectorId` del snapshot). Sirve para mapear el sector de
            Inventory al snapshot de compra y para trazabilidad.
        sourceSeatId:
          type: string
          format: uuid
          nullable: true
          description: |
            Identificador de origen del asiento en Catalog, o `null` para
            admisión general.
        sectorName:
          type: string
          maxLength: 120
          description: Nombre del sector en el snapshot del evento.
        sectorType:
          $ref: '#/components/schemas/SectorType'
        rowLabel:
          type: string
          maxLength: 40
          nullable: true
          description: |
            Fila del asiento en el snapshot de Catalog, o `null` para admisión
            general.
        seatNumber:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Número del asiento dentro de la fila, o `null` para admisión general.

    HoldTtlRequest:
      type: object
      additionalProperties: false
      required:
        - ttlSeconds
      properties:
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            TTL en segundos a aplicar a las reservas posteriores que no informen
            uno explícito. El valor por defecto del evento es 600 s y el rango
            permitido es 60..3600 s.
          example: 300

    EventHoldConfiguration:
      type: object
      additionalProperties: false
      required:
        - eventId
        - holdTtlSeconds
      properties:
        eventId:
          type: string
          format: uuid
          description: Evento configurado.
        holdTtlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: TTL vigente para las reservas del evento.
          example: 300

    CatalogEventSnapshot:
      type: object
      description: |
        Snapshot publicado e inmutable de un evento. Contrato interno de Catalog
        consumido por Inventory para inicializar el layout. No incluye precios ni
        ofertas económicas.
      additionalProperties: false
      required:
        - eventId
        - snapshotId
        - name
        - description
        - eventType
        - startsAt
        - highDemand
        - venue
        - sectors
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador del evento publicado.
        snapshotId:
          type: string
          format: uuid
          description: Identificador del snapshot publicado.
        name:
          type: string
          maxLength: 200
          description: Nombre del evento al momento de publicar.
        description:
          type: string
          description: Descripción del evento al momento de publicar.
        eventType:
          type: string
          maxLength: 80
          description: Tipo de evento.
        startsAt:
          type: string
          format: date-time
          description: Fecha y hora de inicio del evento.
        highDemand:
          type: boolean
          description: |
            Marca vigente de alta demanda del evento. Se lee en vivo desde el
            evento publicado y es idéntica en los dos contratos internos de
            snapshot; sólo cambia mientras el evento es un borrador, así que
            nunca diverge de la publicación.
        venue:
          $ref: '#/components/schemas/SnapshotVenue'
        sectors:
          type: array
          description: |
            Sectores del snapshot en orden estable. Cada sector conserva su
            identificador de origen de Catalog.
          items:
            $ref: '#/components/schemas/SnapshotSector'

    SnapshotVenue:
      type: object
      description: Datos de ubicación del lugar al momento de publicar.
      additionalProperties: false
      required:
        - name
        - address
        - city
        - latitude
        - longitude
      properties:
        name:
          type: string
          maxLength: 200
          description: Nombre del lugar.
        address:
          type: string
          maxLength: 300
          description: Dirección del lugar.
        city:
          type: string
          maxLength: 120
          description: Ciudad del lugar.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitud geográfica.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitud geográfica.

    SnapshotSector:
      type: object
      additionalProperties: false
      required:
        - sourceSectorId
        - name
        - type
        - capacity
        - seats
      properties:
        sourceSectorId:
          type: string
          format: uuid
          description: |
            Identificador del sector en Catalog. Sólo sirve para trazabilidad y
            reconciliación; no se usa como clave de los comandos de reserva.
        name:
          type: string
          maxLength: 120
          description: Nombre del sector.
        type:
          type: string
          enum:
            - NUMBERED
            - GENERAL_ADMISSION
          description: Tipo de sector.
        capacity:
          type: integer
          minimum: 1
          description: Capacidad del sector; siempre mayor que cero.
        seats:
          type: array
          description: |
            Asientos del sector para `NUMBERED`; vacío para
            `GENERAL_ADMISSION`. Ordenado por `row` y luego por `number`.
          items:
            $ref: '#/components/schemas/SnapshotSeat'

    SnapshotSeat:
      type: object
      additionalProperties: false
      required:
        - sourceSeatId
        - row
        - number
      properties:
        sourceSeatId:
          type: string
          format: uuid
          description: |
            Identificador del asiento en Catalog. Sólo sirve para trazabilidad y
            reconciliación.
        row:
          type: string
          maxLength: 40
          description: Fila del asiento.
        number:
          type: integer
          minimum: 1
          description: Número del asiento dentro de la fila.

    SectorType:
      type: string
      description: |
        Tipo de sector según la plantilla del lugar. `NUMBERED` exige elegir
        asientos; `GENERAL_ADMISSION` exige informar una cantidad de cupos.
      enum:
        - NUMBERED
        - GENERAL_ADMISSION
      example: NUMBERED

    CatalogPurchaseSnapshot:
      type: object
      description: |
        Snapshot publicado e inmutable de un evento con el precio unitario de cada
        sector. Contrato interno de Catalog consumido por Purchase Service para
        validar los ítems, fijar precios históricos y emitir tickets.

        Es independiente del snapshot de inventario `CatalogEventSnapshot`, que
        sigue sin precios y lo consume Inventory.
      additionalProperties: false
      required:
        - eventId
        - snapshotId
        - name
        - description
        - eventType
        - startsAt
        - highDemand
        - venue
        - sectors
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador del evento publicado.
        snapshotId:
          type: string
          format: uuid
          description: Identificador del snapshot publicado.
        name:
          type: string
          maxLength: 200
          description: Nombre del evento al momento de publicar.
        description:
          type: string
          description: Descripción del evento al momento de publicar.
        eventType:
          type: string
          maxLength: 80
          description: Tipo de evento.
        startsAt:
          type: string
          format: date-time
          description: Fecha y hora de inicio del evento.
        highDemand:
          type: boolean
          description: |
            Marca vigente de alta demanda del evento. Purchase exige el token de
            admisión de la fila virtual cuando es `true`.
        venue:
          $ref: '#/components/schemas/SnapshotVenue'
        sectors:
          type: array
          minItems: 1
          description: |
            Sectores del snapshot en orden estable, cada uno con su precio
            unitario publicado.
          items:
            $ref: '#/components/schemas/PurchaseSnapshotSector'

    PurchaseSnapshotSector:
      type: object
      description: |
        Sector del snapshot de compra. Agrega `price` al sector del snapshot de
        inventario; conserva `sourceSectorId` como identificador de Catalog.
      additionalProperties: false
      required:
        - sourceSectorId
        - name
        - type
        - capacity
        - price
        - seats
      properties:
        sourceSectorId:
          type: string
          format: uuid
          description: |
            Identificador del sector en Catalog. Purchase lo persiste como
            referencia histórica y para mapear los ítems de la reserva.
        name:
          type: string
          maxLength: 120
          description: Nombre del sector.
        type:
          $ref: '#/components/schemas/SectorType'
        capacity:
          type: integer
          minimum: 1
          description: Capacidad del sector; siempre mayor que cero.
        price:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: |
            Precio unitario del sector en la moneda del evento (`ARS`), con dos
            decimales. Purchase lo usa como precio histórico de la orden.
          example: 15000.00
        seats:
          type: array
          description: |
            Asientos del sector para `NUMBERED`; vacío para
            `GENERAL_ADMISSION`. Ordenado por `row` y luego por `number`.
          items:
            $ref: '#/components/schemas/SnapshotSeat'

    OrderStatus:
      type: string
      description: |
        Estado de la orden. `CONFIRMED`, `REJECTED` y `COMPENSATED` son
        terminales; `PAYMENT_PENDING` y `PAID_PENDING_TICKETS` son reconciliables
        con `POST /api/orders/{orderId}/reconcile`.
      enum:
        - CONFIRMED
        - REJECTED
        - PAYMENT_PENDING
        - PAID_PENDING_TICKETS
        - COMPENSATED
      example: CONFIRMED

    PaymentStatus:
      type: string
      description: |
        Estado del pago simulado. `REFUNDED` es terminal y se alcanza por
        reintegro de un pago `APPROVED`.
      enum:
        - APPROVED
        - REJECTED
        - PENDING
        - REFUNDED
      example: APPROVED

    PaymentMethod:
      type: string
      description: Medio de pago aceptado por la pasarela simulada.
      enum:
        - CARD
        - WALLET
        - CASH
      example: CARD

    CreateOrderRequest:
      type: object
      description: |
        Solicitud de compra. El comprador se identifica con el `sub` del JWT y
        la solicitud se idempotencia con `Idempotency-Key`; ningún precio se
        envía en el cuerpo.
      additionalProperties: false
      required:
        - eventId
        - items
        - payment
      properties:
        eventId:
          type: string
          format: uuid
          description: Evento publicado que se desea comprar.
        items:
          type: array
          minItems: 1
          description: |
            Ítems a comprar. Cada ítem informa exactamente uno de `seatIds` o
            `quantity` según el tipo de sector.
          items:
            $ref: '#/components/schemas/CreateOrderItem'
        payment:
          $ref: '#/components/schemas/CreateOrderPayment'

    CreateOrderItem:
      type: object
      description: |
        Ítem de la orden. `sectorId` es el identificador de **Inventory**
        descubierto en la disponibilidad pública. Debe informarse exactamente uno
        de `seatIds` (sector `NUMBERED`) o `quantity` (sector
        `GENERAL_ADMISSION`).
      additionalProperties: false
      required:
        - sectorId
      properties:
        sectorId:
          type: string
          format: uuid
          description: Identificador de Inventory del sector.
        seatIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            Asientos de Inventory a comprar en un sector `NUMBERED`. Excluyente
            con `quantity`; cada asiento cuenta como una unidad.
          items:
            type: string
            format: uuid
          example:
            - f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
            - f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f602
        quantity:
          type: integer
          minimum: 1
          description: |
            Cantidad de cupos a comprar en un sector `GENERAL_ADMISSION`.
            Excluyente con `seatIds`.
          example: 2

    CreateOrderPayment:
      type: object
      description: |
        Medio de pago y token de simulación. El resultado del cobro lo decide el
        token documentado de forma determinista.
      additionalProperties: false
      required:
        - method
        - token
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        token:
          type: string
          description: |
            Token de simulación del pago. Define el resultado del cobro:
            `tok_approved` aprueba, `tok_rejected` rechaza y `tok_pending` deja el
            pago pendiente. Un token distinto responde `400`.
          enum:
            - tok_approved
            - tok_rejected
            - tok_pending
          example: tok_approved

    OrderItemUnit:
      type: object
      description: |
        Unidad concreta de un ítem. En sectores `NUMBERED` identifica un asiento;
        en `GENERAL_ADMISSION` sólo expone el número de unidad.
      additionalProperties: false
      required:
        - unitNumber
      properties:
        unitNumber:
          type: integer
          minimum: 1
          description: Número de unidad dentro del ítem, desde 1.
          example: 1
        seatId:
          type: string
          format: uuid
          nullable: true
          description: Identificador de Inventory del asiento, o `null` en admisión general.
        sourceSeatId:
          type: string
          format: uuid
          nullable: true
          description: Identificador de origen del asiento en Catalog, o `null` en admisión general.
        row:
          type: string
          maxLength: 40
          nullable: true
          description: Fila del asiento, o `null` en admisión general.
          example: A
        number:
          type: integer
          minimum: 1
          nullable: true
          description: Número del asiento dentro de la fila, o `null` en admisión general.
          example: 1

    OrderItem:
      type: object
      description: |
        Ítem valorizado de la orden. Los precios provienen del snapshot de compra
        de Catalog al momento de crear la orden y no cambian después.
      additionalProperties: false
      required:
        - orderItemId
        - sectorId
        - sourceSectorId
        - sectorName
        - sectorType
        - quantity
        - unitPrice
        - subtotal
        - units
        - tickets
      properties:
        orderItemId:
          type: string
          format: uuid
          description: Identificador del ítem dentro de la orden.
        sectorId:
          type: string
          format: uuid
          description: Identificador de Inventory del sector.
        sourceSectorId:
          type: string
          format: uuid
          description: Identificador de origen del sector en Catalog.
        sectorName:
          type: string
          maxLength: 120
          description: Nombre del sector al momento de la compra.
        sectorType:
          $ref: '#/components/schemas/SectorType'
        quantity:
          type: integer
          minimum: 1
          description: Unidades compradas en el sector.
        unitPrice:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Precio unitario histórico del sector en `ARS`.
          example: 15000.00
        subtotal:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: |
            Importe del ítem: `unitPrice * quantity`, con dos decimales.
          example: 30000.00
        units:
          type: array
          minItems: 1
          description: |
            Una unidad por entrada comprada; `quantity` es igual a la cantidad de
            elementos de `units`.
          items:
            $ref: '#/components/schemas/OrderItemUnit'
        tickets:
          type: array
          description: |
            Tickets emitidos para el ítem. Vacío mientras la orden no esté
            `CONFIRMED` o si la emisión quedó pendiente.
          items:
            $ref: '#/components/schemas/OrderTicket'

    OrderTicket:
      type: object
      description: |
        Ticket emitido y firmado por Ticket Service. El QR se expone como payload
        firmado y como PNG en Base64.
      additionalProperties: false
      required:
        - ticketId
        - unitNumber
        - status
        - qrPayload
        - qrPngBase64
      properties:
        ticketId:
          type: string
          format: uuid
          description: Identificador del ticket emitido.
        unitNumber:
          type: integer
          minimum: 1
          description: Número de unidad del ítem a la que corresponde el ticket.
          example: 1
        status:
          type: string
          enum:
            - ISSUED
            - REVOKED
            - USED
          description: Estado del ticket.
          example: ISSUED
        qrPayload:
          type: string
          description: |
            Identificador de ticket firmado con HMAC y versionado, codificado en
            el QR. No contiene datos personales.
          example: ty1.eyJ0aWNrZXRJZCI6IjFhMmIzYzRkIn0.signature
        qrPngBase64:
          type: string
          format: byte
          description: Imagen PNG del QR codificada en Base64.
          example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
        row:
          type: string
          maxLength: 40
          nullable: true
          description: Fila del asiento, o `null` en admisión general.
          example: A
        seatNumber:
          type: integer
          minimum: 1
          nullable: true
          description: Número del asiento dentro de la fila, o `null` en admisión general.
          example: 1

    OrderPayment:
      type: object
      description: |
        Pago asociado a la orden, tal como quedó registrado en Payment Mock. No
        incluye el token de simulación.
      additionalProperties: false
      required:
        - paymentId
        - status
        - amount
        - currency
        - method
        - createdAt
        - updatedAt
      properties:
        paymentId:
          type: string
          format: uuid
          nullable: true
          description: |
            Identificador del pago cuando la respuesta de Payment se recibió.
            Puede ser `null` si se perdió la respuesta y la compra sigue
            `PAYMENT_PENDING` hasta su reconciliación.
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Monto cobrado, igual al total de la orden.
          example: 40000.00
        currency:
          type: string
          enum:
            - ARS
          description: Moneda del pago.
          example: ARS
        method:
          $ref: '#/components/schemas/PaymentMethod'
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Momento de creación del pago.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Momento de la última actualización del pago.

    OrderResponse:
      type: object
      description: |
        Orden de compra con su estado, snapshot histórico del evento, pago e
        ítems con unidades y tickets. Es la representación devuelta por
        `POST /api/orders`, `GET /api/orders/{orderId}` y
        `POST /api/orders/{orderId}/reconcile`.
      additionalProperties: false
      required:
        - orderId
        - status
        - customerId
        - eventId
        - eventName
        - eventStartsAt
        - venueName
        - venueCity
        - currency
        - totalAmount
        - reservationExpiresAt
        - createdAt
        - updatedAt
        - payment
        - items
      properties:
        orderId:
          type: string
          format: uuid
          description: Identificador de la orden.
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerId:
          type: string
          format: uuid
          description: Comprador tomado del `sub` del JWT.
        eventId:
          type: string
          format: uuid
          description: Evento comprado.
        eventName:
          type: string
          maxLength: 200
          description: Nombre del evento al momento de la compra.
        eventStartsAt:
          type: string
          format: date-time
          description: Fecha y hora de inicio del evento al momento de la compra.
        venueName:
          type: string
          maxLength: 200
          description: Nombre del lugar al momento de la compra.
        venueCity:
          type: string
          maxLength: 120
          description: Ciudad del lugar al momento de la compra.
        currency:
          type: string
          enum:
            - ARS
          description: Moneda de la orden.
          example: ARS
        totalAmount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: |
            Importe total de la orden: suma de los `subtotal` de sus ítems, con
            dos decimales.
          example: 40000.00
        reservationExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Vencimiento de la retención de inventario. Es `null` cuando la orden
            ya no depende de una reserva vigente.
        createdAt:
          type: string
          format: date-time
          description: Momento de creación de la orden.
        updatedAt:
          type: string
          format: date-time
          description: Momento de la última transición de la orden.
        payment:
          $ref: '#/components/schemas/OrderPayment'
        items:
          type: array
          minItems: 1
          description: Ítems de la orden con sus unidades y tickets.
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderPage:
      type: object
      description: Página de órdenes del comprador.
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          description: Órdenes de la página actual, ordenadas por `createdAt` descendente.
          items:
            $ref: '#/components/schemas/OrderResponse'
        page:
          type: integer
          minimum: 0
          description: Número de página devuelto, base cero.
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
          description: Tamaño de página solicitado.
          example: 20
        totalElements:
          type: integer
          minimum: 0
          description: Total de órdenes visibles para el comprador y el filtro.
          example: 1
        totalPages:
          type: integer
          minimum: 0
          description: Total de páginas para el tamaño solicitado.
          example: 1

    CreatePaymentRequest:
      type: object
      description: |
        Cobro simulado de una orden. Idempotente por `orderId`: el mismo `orderId`
        con el mismo contenido devuelve el pago existente.
      additionalProperties: false
      required:
        - orderId
        - amount
        - currency
        - method
        - token
      properties:
        orderId:
          type: string
          format: uuid
          description: Orden que se cobra; clave de idempotencia del pago.
        amount:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          description: Monto a cobrar, mayor que cero y con dos decimales.
          example: 40000.00
        currency:
          type: string
          enum:
            - ARS
          description: Moneda del cobro.
          example: ARS
        method:
          $ref: '#/components/schemas/PaymentMethod'
        token:
          type: string
          description: |
            Token de simulación. `tok_approved` aprueba, `tok_rejected` rechaza y
            `tok_pending` deja el pago pendiente; cualquier otro valor responde
            `400`.
          enum:
            - tok_approved
            - tok_rejected
            - tok_pending
          example: tok_approved

    PaymentResponse:
      type: object
      description: |
        Pago registrado por Payment Mock. No incluye el token de simulación ni
        datos del comprador.
      additionalProperties: false
      required:
        - paymentId
        - orderId
        - status
        - amount
        - currency
        - method
        - createdAt
        - updatedAt
      properties:
        paymentId:
          type: string
          format: uuid
          description: Identificador del pago.
        orderId:
          type: string
          format: uuid
          description: Orden cobrada.
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Monto cobrado.
          example: 40000.00
        currency:
          type: string
          enum:
            - ARS
          description: Moneda del pago.
          example: ARS
        method:
          $ref: '#/components/schemas/PaymentMethod'
        createdAt:
          type: string
          format: date-time
          description: Momento de creación del pago.
        updatedAt:
          type: string
          format: date-time
          description: Momento de la última actualización del pago.

    # ─── CATALOG SCHEMAS ──────────────────────────────────────────────────

    VenueRequest:
      type: object
      additionalProperties: false
      required: [name, address, city, latitude, longitude, sectors]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 300 }
        city: { type: string, maxLength: 120 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/SectorRequest'

    SectorRequest:
      type: object
      additionalProperties: false
      required: [name, type, capacity]
      properties:
        name: { type: string, maxLength: 120 }
        type: { $ref: '#/components/schemas/SectorType' }
        capacity: { type: integer, minimum: 1 }
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatRequest'

    SeatRequest:
      type: object
      additionalProperties: false
      required: [rowLabel, seatNumber]
      properties:
        rowLabel: { type: string, maxLength: 40 }
        seatNumber: { type: integer, minimum: 1 }

    VenueResponse:
      type: object
      required: [id, name, address, city, latitude, longitude, sectors]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/SectorResponse'

    SectorResponse:
      type: object
      required: [id, name, type, capacity, seats]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/SectorType' }
        capacity: { type: integer }
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatResponse'

    SeatResponse:
      type: object
      required: [rowLabel, seatNumber]
      properties:
        rowLabel: { type: string }
        seatNumber: { type: integer }

    VenuePageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/VenueResponse'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    EventRequest:
      type: object
      additionalProperties: false
      required: [name, description, eventType, startsAt, venueId]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        eventType: { type: string, maxLength: 80 }
        startsAt: { type: string, format: date-time }
        venueId: { type: string, format: uuid }
        organizerId: { type: string, format: uuid, nullable: true, description: Requerido cuando ADMIN crea. }
        highDemand:
          type: boolean
          default: false
          description: |
            Marca el evento como de alta demanda. Sólo puede cambiarse mientras el
            evento está en `DRAFT`; en `PUBLISHED` se rechaza con `409`. Al crear
            sin informarla vale `false`. Los eventos marcados exigen un token de
            admisión de la fila virtual para comprar.
        participants:
          type: array
          items: { type: string }
        offerings:
          type: array
          description: |
            Ofertas de precio por sector. Se procesan en POST (create) y en
            PUT /offerings. En PUT /{id} (update) se **ignoran**; use el
            endpoint dedicado de offerings para modificarlas.
          items:
            $ref: '#/components/schemas/OfferingRequest'

    OfferingRequest:
      type: object
      additionalProperties: false
      required: [sectorId, price]
      properties:
        sectorId: { type: string, format: uuid }
        price: { type: number, format: double, minimum: 0.01 }

    OfferingsRequest:
      type: object
      additionalProperties: false
      required: [offerings]
      properties:
        offerings:
          type: array
          items:
            $ref: '#/components/schemas/OfferingRequest'

    EventResponse:
      type: object
      required: [id, name, description, eventType, startsAt, organizerId, venueId, status, participants, offerings, highDemand]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        eventType: { type: string }
        startsAt: { type: string, format: date-time }
        organizerId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        highDemand:
          type: boolean
          description: |
            Marca vigente de alta demanda del evento. Gobierna si la compra exige
            token de admisión de la fila virtual.
        status:
          type: string
          description: |
            Estado del evento. `SOLD_OUT` y `FINISHED` están modelados; sus
            transiciones no forman parte de los flujos implementados en E1.
          enum: [DRAFT, PUBLISHED, SUSPENDED, SOLD_OUT, CANCELLED, FINISHED]
        participants:
          type: array
          items: { type: string }
        offerings:
          type: array
          items:
            $ref: '#/components/schemas/OfferingResponse'

    OfferingResponse:
      type: object
      required: [sectorId, price]
      properties:
        sectorId: { type: string, format: uuid }
        price: { type: number, format: double }

    EventSearchPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    SearchItem:
      type: object
      required: [id, name, eventType, startsAt, highDemand, city]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        eventType: { type: string }
        startsAt: { type: string, format: date-time }
        highDemand:
          type: boolean
          description: |
            Indica si el evento está marcado como de alta demanda; en tal caso el
            cliente debe entrar a la fila virtual antes de comprar.
        city: { type: string }
        minimumPrice: { type: number, format: double, nullable: true }

    EventDetail:
      type: object
      required: [id, organizerId, name, description, eventType, startsAt, highDemand, venueName, venueAddress, city, latitude, longitude, participants, sectors]
      properties:
        id: { type: string, format: uuid }
        organizerId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        eventType: { type: string }
        startsAt: { type: string, format: date-time }
        highDemand:
          type: boolean
          description: |
            Indica si el evento está marcado como de alta demanda; en tal caso el
            cliente debe entrar a la fila virtual antes de comprar.
        venueName: { type: string }
        venueAddress: { type: string }
        city: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        participants:
          type: array
          items: { type: string }
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/EventDetailSector'

    EventDetailSector:
      type: object
      required: [id, name, type, capacity, price, seats]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [NUMBERED, GENERAL_ADMISSION] }
        capacity: { type: integer }
        price: { type: number, format: double }
        seats:
          type: array
          items:
            $ref: '#/components/schemas/EventDetailSeat'

    EventDetailSeat:
      type: object
      required: [row, number]
      properties:
        row: { type: string }
        number: { type: integer }

    # ─── INVENTORY CANCELLATION SCHEMAS ───────────────────────────────────

    SoldUnitReleaseRequest:
      type: object
      additionalProperties: false
      required: [sectorId, seatId, unitNumber]
      properties:
        sectorId: { type: string, format: uuid }
        seatId: { type: string, format: uuid }
        unitNumber: { type: integer, minimum: 1 }

    SoldUnitReleaseResponse:
      type: object
      additionalProperties: false
      required: [reservationId, sectorId, seatId, unitNumber, released]
      properties:
        reservationId: { type: string, format: uuid }
        sectorId: { type: string, format: uuid }
        seatId: { type: string, format: uuid }
        unitNumber: { type: integer }
        released: { type: boolean }

    # ─── TICKET SCHEMAS ───────────────────────────────────────────────────

    TicketIssueRequest:
      type: object
      additionalProperties: false
      required: [customerId, eventId, eventName, eventStartsAt, venueName, venueCity, sectorName, tickets]
      properties:
        customerId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventName: { type: string, maxLength: 200 }
        eventStartsAt: { type: string, format: date-time }
        venueName: { type: string, maxLength: 200 }
        venueCity: { type: string, maxLength: 120 }
        sectorName: { type: string, maxLength: 120 }
        tickets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TicketUnitRequest'

    TicketUnitRequest:
      type: object
      additionalProperties: false
      required: [unitNumber]
      properties:
        unitNumber: { type: integer, minimum: 1 }
        rowLabel: { type: string, maxLength: 40, nullable: true }
        seatNumber: { type: integer, minimum: 1, nullable: true }

    TicketIssueResponse:
      type: object
      additionalProperties: false
      required: [orderId, orderItemId, tickets]
      properties:
        orderId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/TicketView'

    TicketView:
      type: object
      additionalProperties: false
      required: [ticketId, unitNumber, eventId, eventName, eventStartsAt, venueName, venueCity, sectorName, status, issuedAt, qrPayload, qrPngBase64]
      properties:
        ticketId: { type: string, format: uuid }
        unitNumber: { type: integer }
        eventId: { type: string, format: uuid }
        eventName: { type: string }
        eventStartsAt: { type: string, format: date-time }
        venueName: { type: string }
        venueCity: { type: string }
        sectorName: { type: string }
        rowLabel: { type: string, nullable: true }
        seatNumber: { type: integer, nullable: true }
        status: { type: string, enum: [ISSUED, REVOKED, USED] }
        issuedAt: { type: string, format: date-time }
        qrPayload: { type: string }
        qrPngBase64: { type: string, format: byte }

    TicketRevocationResponse:
      type: object
      additionalProperties: false
      required: [ticketId, status]
      properties:
        ticketId: { type: string, format: uuid }
        status: { type: string, enum: [REVOKED] }

    # ─── PAYMENT PARTIAL REFUND SCHEMAS ───────────────────────────────────

    PartialRefundRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, amount]
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 120
          description: Clave de idempotencia del reintegro (usualmente el refundId).
        amount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Monto a reintegrar.

    PartialRefundResponse:
      type: object
      additionalProperties: false
      required: [refundId, paymentId, amount, status, createdAt]
      properties:
        refundId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        amount: { type: number, format: double, minimum: 0.01 }
        status: { type: string, enum: [REFUNDED] }
        createdAt: { type: string, format: date-time }

    Problem:
      type: object
      description: |
        Error conforme a `application/problem+json`. Incluye siempre el
        `correlationId` de la solicitud. Puede incluir campos adicionales de
        contexto (por ejemplo el estado de una reserva en un conflicto), pero
        nunca datos de otros compradores ni detalles internos.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - correlationId
      properties:
        type:
          type: string
          description: URI que identifica el tipo de problema. Por defecto `about:blank`.
          example: about:blank
        title:
          type: string
          description: Resumen corto y estable del tipo de problema.
          example: Not found
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Código HTTP del error.
          example: 404
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
          example: Published event not found
        instance:
          type: string
          description: Ruta de la solicitud que originó el error.
          example: /api/inventory/events/e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b/availability
        correlationId:
          type: string
          minLength: 1
          description: Correlation ID de la solicitud, igual al devuelto en el header.
          example: trace-inventory-1
        orderId:
          type: string
          format: uuid
          description: |
            Contexto opcional. Sólo aparece en errores de compra que informan la
            orden afectada (por ejemplo un pago rechazado o un conflicto).
          example: 6f4e1b2a-3c4d-4e5f-9a0b-1c2d3e4f5a6b
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'

    AccessValidationRequest:
      type: object
      required: [qrPayload]
      properties:
        qrPayload:
          type: string
          maxLength: 512
          description: Texto leído del QR (`v1.<ticketId>.<firma>`).
        gate:
          type: string
          maxLength: 80
          nullable: true
          description: Puerta o molinete donde se escanea.

    AccessValidationResponse:
      type: object
      required: [result, ticketId, eventId, status, usedAt, validatedBy]
      properties:
        result: { type: string, enum: [ADMITTED] }
        ticketId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventName: { type: string }
        sectorName: { type: string }
        rowLabel: { type: string, nullable: true }
        seatNumber: { type: integer, nullable: true }
        status: { type: string, enum: [USED] }
        usedAt: { type: string, format: date-time }
        gate: { type: string, nullable: true }
        validatedBy: { type: string, format: uuid }

    AccessProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              enum: [ALREADY_USED, REVOKED, WRONG_EVENT, UNKNOWN_TICKET]
            ticketId: { type: string, format: uuid, nullable: true }
            usedAt: { type: string, format: date-time, nullable: true }
            usedGate: { type: string, nullable: true }

    AccessScanView:
      type: object
      properties:
        scanId: { type: string, format: uuid }
        ticketId: { type: string, format: uuid, nullable: true }
        staffId: { type: string, format: uuid }
        gate: { type: string, nullable: true }
        result:
          type: string
          enum: [ADMITTED, ALREADY_USED, REVOKED, WRONG_EVENT, UNKNOWN_TICKET]
        scannedAt: { type: string, format: date-time }
        correlationId: { type: string, nullable: true }

    AccessScanPage:
      type: object
      required: [eventId, admitted, rejected, countsByResult, page, size, totalItems, items]
      properties:
        eventId: { type: string, format: uuid }
        admitted: { type: integer, format: int64 }
        rejected: { type: integer, format: int64 }
        countsByResult:
          type: object
          additionalProperties: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessScanView' }

    SectorReport:
      type: object
      required: [sourceSectorId, soldTickets, refundedTickets, activeTickets, grossRevenue, refundedAmount, netRevenue]
      properties:
        sectorId: { type: string, format: uuid, nullable: true, description: Identificador de Inventory. }
        sourceSectorId: { type: string, format: uuid, description: Identificador del sector en Catalog. }
        sectorName: { type: string, nullable: true }
        sectorType: { type: string, nullable: true, enum: [NUMBERED, GENERAL_ADMISSION] }
        unitPrice: { type: number, nullable: true }
        capacity: { type: integer, nullable: true }
        soldTickets: { type: integer }
        refundedTickets: { type: integer }
        activeTickets: { type: integer }
        occupancyPercent: { type: number, nullable: true }
        grossRevenue: { type: number }
        refundedAmount: { type: number }
        netRevenue: { type: number }

    ReportTotals:
      type: object
      required: [soldTickets, refundedTickets, activeTickets, grossRevenue, refundedAmount, netRevenue]
      properties:
        capacity: { type: integer, nullable: true }
        soldTickets: { type: integer }
        refundedTickets: { type: integer }
        activeTickets: { type: integer }
        occupancyPercent: { type: number, nullable: true }
        grossRevenue: { type: number }
        refundedAmount: { type: number }
        netRevenue: { type: number }

    OrganizerEventReport:
      type: object
      required: [eventId, currency, generatedAt, capacityAvailable, sectors, totals, warnings]
      properties:
        eventId: { type: string, format: uuid }
        eventName: { type: string }
        eventStatus:
          type: string
          enum: [DRAFT, PUBLISHED, SUSPENDED, SOLD_OUT, CANCELLED, FINISHED]
        eventStartsAt: { type: string, format: date-time }
        organizerId: { type: string, format: uuid }
        currency: { type: string, example: ARS }
        generatedAt: { type: string, format: date-time }
        capacityAvailable: { type: boolean }
        sectors:
          type: array
          items: { $ref: '#/components/schemas/SectorReport' }
        totals: { $ref: '#/components/schemas/ReportTotals' }
        warnings:
          type: array
          items: { type: string }

    AuditEventRequest:
      type: object
      required: [eventId, correlationId, service, operation, outcome, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        correlationId: { type: string, maxLength: 120 }
        service: { type: string, maxLength: 60 }
        operation: { type: string, maxLength: 60, pattern: '^[A-Z][A-Z0-9_]*$' }
        outcome: { type: string, maxLength: 40 }
        actorId: { type: string, maxLength: 64, nullable: true }
        actorRole: { type: string, maxLength: 20, nullable: true }
        resourceType: { type: string, maxLength: 40, nullable: true }
        resourceId: { type: string, maxLength: 120, nullable: true }
        occurredAt: { type: string, format: date-time }
        details: { type: object, additionalProperties: true, nullable: true }

    AuditIngestResponse:
      type: object
      required: [eventId, duplicate]
      properties:
        eventId: { type: string, format: uuid }
        duplicate: { type: boolean }

    AuditEventView:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        correlationId: { type: string }
        service: { type: string }
        operation: { type: string }
        outcome: { type: string }
        actorId: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        resourceType: { type: string, nullable: true }
        resourceId: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        details: { type: object, additionalProperties: true }

    AuditEventPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEventView' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }

    AuditTrace:
      type: object
      required: [correlationId, eventCount, services, events]
      properties:
        correlationId: { type: string }
        eventCount: { type: integer }
        services:
          type: array
          items: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditEventView' }

    CustomerPreferencesRequest:
      type: object
      description: |
        Preferencias que el cliente registra o reemplaza. No acepta
        `customerId`, `version` ni `updatedAt`: la identidad se deriva del `sub`
        del JWT y los otros dos campos los gestiona el servidor.
      required: []
      properties:
        city:
          type: string
          nullable: true
          maxLength: 120
          description: Ciudad de preferencia; se guarda con `trim`.
          example: Buenos Aires
        eventTypes:
          type: array
          maxItems: 10
          description: Tipos de evento favoritos, como texto libre (Catalog no define un enum).
          items:
            type: string
            minLength: 1
            maxLength: 80
          example: [CONCIERTO, TEATRO]
        favoriteArtists:
          type: array
          maxItems: 20
          description: Artistas favoritos; se comparan sin distinguir mayusculas.
          items:
            type: string
            minLength: 1
            maxLength: 200
          example: [Artista A, Artista B]
    CustomerPreferencesResponse:
      type: object
      description: Preferencias del cliente; `version` `0` y `updatedAt` nulo indican que todavia no registro.
      required: [city, eventTypes, favoriteArtists, updatedAt, version]
      properties:
        city: { type: string, nullable: true, example: Buenos Aires }
        eventTypes:
          type: array
          items: { type: string }
          example: [CONCIERTO, TEATRO]
        favoriteArtists:
          type: array
          items: { type: string }
          example: [Artista A, Artista B]
        updatedAt: { type: string, format: date-time, nullable: true, example: '2026-11-20T12:00:00Z' }
        version: { type: integer, minimum: 0, example: 1 }
    RecommendedEvent:
      type: object
      description: Evento recomendado con su puntaje explicable y los motivos que lo produjeron.
      required: [eventId, name, eventType, startsAt, city, participants, minPrice, score, reasons]
      properties:
        eventId: { type: string, format: uuid }
        name: { type: string, example: Recital de Primavera }
        eventType: { type: string, example: CONCIERTO }
        startsAt: { type: string, format: date-time, example: '2026-12-05T21:00:00Z' }
        city: { type: string, example: Buenos Aires }
        participants:
          type: array
          items: { type: string }
          example: [Artista A]
        minPrice: { type: number, format: double, example: 5000.0 }
        score: { type: integer, minimum: 0, example: 12 }
        reasons:
          type: array
          description: Motivos que sumaron puntaje, en orden de contribucion.
          items:
            type: string
            enum: [FAVORITE_EVENT_TYPE, FAVORITE_ARTIST, SAME_CITY, CO_PURCHASE, UPCOMING_FALLBACK]
          example: [FAVORITE_EVENT_TYPE, FAVORITE_ARTIST, SAME_CITY]
    EventRecommendationPage:
      type: object
      description: |
        Pagina de recomendaciones. En modo normal los elementos tienen `score`
        mayor que cero; en modo fallback (`UPCOMING_FALLBACK`) pueden tener
        `score` `0`. `warnings` informa la degradacion de dependencias.
      required: [items, warnings, generatedAt]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RecommendedEvent' }
        warnings:
          type: array
          items: { type: string }
          example: [HISTORY_UNAVAILABLE]
        generatedAt: { type: string, format: date-time, example: '2026-11-20T12:00:00Z' }
    CoPurchaseSignal:
      type: object
      description: Cantidad de clientes distintos que compraron un evento y ademas algun evento del cliente consultado.
      required: [eventId, count]
      properties:
        eventId: { type: string, format: uuid }
        count: { type: integer, minimum: 0, example: 4 }
    RecommendationSignals:
      type: object
      description: Senales de historial de un cliente, ya sea con compras o con listas vacias.
      required: [customerId, purchasedEventIds, coPurchases, generatedAt]
      properties:
        customerId: { type: string, format: uuid }
        purchasedEventIds:
