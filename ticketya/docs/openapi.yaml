              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Solo ADMIN puede decidir
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Solicitud inexistente
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Decision incompatible con la ya guardada
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/orders:
    post:
      tags:
        - Purchase orders
      operationId: createOrder
      summary: Crear una orden de compra y ejecutar la saga
      description: |
        Crea una orden para un evento publicado y ejecuta la saga síncrona:
        snapshot de compra de Catalog, admisión de la fila virtual (sólo en
        eventos de alta demanda), reserva en Inventory, cobro en Payment Mock,
        confirmación de inventario y emisión idempotente de tickets.

        Reglas del request:
        - El `sub` del JWT determina el comprador. El rol (`CLIENT` o `ADMIN`)
          proviene del claim `roles`.
        - `Idempotency-Key` es obligatorio (1..120 caracteres). La misma clave
          del mismo comprador con el mismo contenido devuelve la orden existente
          sin reservar, cobrar ni emitir de nuevo; con otro contenido responde
          `409` y conserva la orden original.
        - Si el snapshot de compra informa `highDemand: true`, `X-Admission-Token`
          es obligatorio y se valida y consume antes de reservar o cobrar. Sin
          el encabezado, o con un token ajeno, vencido o ya utilizado, responde
          `403` sin efectos. En el resto de los eventos el encabezado se ignora.
        - `items[].sectorId` es el identificador de **Inventory** descubierto en
          la disponibilidad pública.
        - Cada ítem informa **exactamente uno** de `seatIds` (sector `NUMBERED`)
          o `quantity` (sector `GENERAL_ADMISSION`). Los precios nunca se toman
          del request: provienen del snapshot de compra de Catalog.
        - `payment.token` es el token de simulación documentado y determina el
          resultado del cobro: `tok_approved`, `tok_rejected` o `tok_pending`.

        El límite configurable de entradas por cliente y evento (seis por defecto)
        se valida de forma atómica antes de reservar.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdmissionToken'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              createOrder:
                $ref: '#/components/examples/CreateOrderRequest'
      responses:
        '201':
          description: |
            Orden `CONFIRMED`: la reserva quedó vendida, el pago está `APPROVED` y
            todos los tickets fueron emitidos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                confirmed:
                  $ref: '#/components/examples/OrderConfirmed'
        '200':
          description: |
            Repetición idempotente: ya existía una orden para la misma
            `Idempotency-Key` del mismo `sub` con el mismo contenido. Se devuelve la
            orden existente en su estado actual, sin nuevas reservas, cobros ni
            tickets. Puede ser una orden `CONFIRMED`, `REJECTED`,
            `PAYMENT_PENDING`, `PAID_PENDING_TICKETS` o `COMPENSATED`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                confirmedReplay:
                  $ref: '#/components/examples/OrderConfirmed'
                rejectedReplay:
                  $ref: '#/components/examples/OrderRejected'
                paymentPendingReplay:
                  $ref: '#/components/examples/OrderPaymentPending'
        '202':
          description: |
            Orden `PAYMENT_PENDING`: Payment devolvió `PENDING` o no respondió
            dentro del tiempo de espera. La reserva se conserva hasta
            `reservationExpiresAt` y la orden puede reconciliarse con
            `POST /api/orders/{orderId}/reconcile`. Un timeout de pago nunca se
            interpreta como rechazo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                paymentPending:
                  $ref: '#/components/examples/OrderPaymentPending'
                paymentResponseLost:
                  $ref: '#/components/examples/OrderPaymentResponseLost'
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway
            rechaza la solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '402':
          description: |
            Pago rechazado por la pasarela simulada. Purchase libera la reserva,
            libera el límite de unidades y la orden queda `REJECTED` sin tickets.
            El cuerpo es un problema con el `orderId` y el estado de la orden como
            contexto.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                paymentRejected:
                  $ref: '#/components/examples/ProblemPaymentRejected'
        '400':
          description: |
            Request inválido: falta `Idempotency-Key`, ítem sin sector, ítem que
            informa `seatIds` y `quantity` a la vez o ninguno, cantidad no
            positiva, asiento ajeno al sector, ítem duplicado, evento ausente o
            medio o token de pago inválido. No se reserva ni se cobra.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badRequest:
                  $ref: '#/components/examples/ProblemOrderBadRequest'
        '403':
          description: |
            Rol insuficiente o admisión rechazada. El token es válido pero el rol
            no basta para esta operación, el ownership no coincide con el `sub`,
            o el evento es de alta demanda y falta `X-Admission-Token` o el token
            es ajeno, está vencido o ya fue utilizado. No se crea la orden ni se
            reserva, cobra o emite.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/ProblemIdentityRequired'
        '404':
          description: |
            Evento no comprable: no existe, está en borrador, suspendido o
            cancelado según el snapshot de compra de Catalog. No se reserva ni se
            cobra.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemOrderNotFound'
        '409':
          description: |
            Conflicto sin cambios parciales: falta de disponibilidad en Inventory,
            límite de entradas del cliente y evento excedido, `Idempotency-Key`
            reutilizada con contenido distinto, o la fila del evento dejó de
            admitir compras (`highDemand` con la cola cerrada). También se usa
            cuando el pago fue
            aprobado pero la reserva ya no puede confirmarse y la orden queda
            `COMPENSATED` tras reintegrar el pago y liberar el inventario.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemOrderConflict'
        '503':
          description: |
            Fallo explícito de una dependencia (Catalog, Queue, Inventory, Payment
            Mock o la consulta de Payment durante una reconciliación). Purchase no
            deja una orden confirmada parcialmente y libera o conserva reservas
            y límites según el estado persistido. Una respuesta de cobro perdida
            o incierta se devuelve como `202 PAYMENT_PENDING`; un fallo transitorio
            de emisión QR se devuelve como `202 PAID_PENDING_TICKETS`.
            La solicitud puede repetirse con la misma `Idempotency-Key` sin
            duplicar efectos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/ProblemDependencyUnavailable'
    get:
      tags:
        - Purchase orders
      operationId: listOrders
      summary: Listar las órdenes del comprador
      description: |
        Devuelve las órdenes del comprador identificado por el `sub` del
        JWT, paginadas y ordenadas por `createdAt` descendente. Un cliente
        sólo ve sus propias órdenes; `ADMIN` puede ver las de todos los
        compradores.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/OrderStatusFilter'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Página de órdenes. `items` contiene órdenes completas con ítems, pago
            y tickets; `totalPages` se calcula a partir de `totalElements` y
            `size`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                page:
                  $ref: '#/components/examples/OrderPage'
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway
            rechaza la solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400':
          description: |
            Parámetros de paginación o filtro inválidos: `page` negativo,
            `size` fuera de 1..50 o `status` fuera del enum `OrderStatus`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badRequest:
                  $ref: '#/components/examples/ProblemOrderBadRequest'
        '403':
          description: |
            Rol insuficiente: el token es válido pero el rol no basta para
            esta operación, o el ownership no coincide con el `sub`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/ProblemIdentityRequired'

  /api/orders/{orderId}:
    get:
      tags:
        - Purchase orders
      operationId: getOrder
      summary: Consultar una orden de compra
      description: |
        Devuelve la orden con sus ítems, unidades, pago y tickets. Un cliente
        sólo puede consultar sus propias órdenes: si la orden pertenece a otro
        comprador se responde `404` sin revelar su existencia. `ADMIN` puede
        consultar cualquier orden.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Orden encontrada y visible para el comprador autenticado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                confirmed:
                  $ref: '#/components/examples/OrderConfirmed'
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway
            rechaza la solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            Rol insuficiente: el token es válido pero el rol no basta para
            esta operación, o el ownership no coincide con el `sub`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/ProblemIdentityRequired'
        '404':
          description: |
            La orden no existe o pertenece a otro comprador. Ambos casos se
            responden igual para no revelar la existencia de órdenes ajenas.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemOrderNotFound'

  /api/orders/{orderId}/reconcile:
    post:
      tags:
        - Purchase orders
      operationId: reconcileOrder
      summary: Reconciliar una orden pendiente
      description: |
        Consulta el pago de la orden y continúa o compensa la saga de forma
        idempotente. Si el pago está `APPROVED` confirma el inventario y emite los
        tickets (o reintenta la emisión pendiente); si está `REJECTED` libera la
        reserva y rechaza la orden. No vuelve a cobrar.

        Es reconciliable una orden `PAYMENT_PENDING` o `PAID_PENDING_TICKETS`.
        Una orden terminal (`CONFIRMED`, `REJECTED`, `COMPENSATED`) responde
        `409` sin cambios.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Orden reconciliada. El estado resultante puede ser `CONFIRMED`,
            `REJECTED`, `COMPENSATED`, `PAYMENT_PENDING` (el pago sigue incierto)
            o `PAID_PENDING_TICKETS` (la emisión sigue fallando).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                confirmed:
                  $ref: '#/components/examples/OrderConfirmed'
                rejected:
                  $ref: '#/components/examples/OrderRejected'
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway
            rechaza la solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            Rol insuficiente: el token es válido pero el rol no basta para
            esta operación, o el ownership no coincide con el `sub`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/ProblemIdentityRequired'
        '404':
          description: |
            La orden no existe o pertenece a otro comprador. Ambos casos se
            responden igual para no revelar la existencia de órdenes ajenas.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemOrderNotFound'
        '409':
          description: |
            La orden no es reconciliable porque está `CONFIRMED`, `REJECTED` o
            `COMPENSATED`. La orden no se modifica.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemOrderConflict'

  /api/queue/events/{eventId}/entries:
    post:
      tags:
        - Virtual queue
      operationId: joinEventQueue
      summary: Entrar a la fila virtual de un evento de alta demanda
      description: |
        Da de alta al cliente autenticado en la fila del evento y devuelve su
        turno. La operación es idempotente: si el cliente ya tiene un turno
        activo (`WAITING` o `ADMITTED`) en ese evento devuelve el mismo turno y
        la misma posición, sin consumir un lugar adicional. La posición se
        asigna con un contador por evento bajo bloqueo en PostgreSQL, de modo que
        varias instancias del servicio nunca entregan la misma posición.

        El servicio consulta el snapshot interno de Catalog para validar que el
        evento esté publicado y marcado como de alta demanda. La fila no informa
        disponibilidad de entradas ni reserva inventario.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: Turno creado con su posición en la fila.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueEntry' }
              examples:
                waiting:
                  $ref: '#/components/examples/QueueEntryWaiting'
        '200':
          description: |
            El cliente ya tenía un turno activo en esa fila. Se devuelve el turno
            existente con su posición y estado actuales.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueEntry' }
              examples:
                waiting:
                  $ref: '#/components/examples/QueueEntryWaiting'
                admitted:
                  $ref: '#/components/examples/QueueEntryAdmitted'
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway rechaza la
            solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            Identidad ausente o rol distinto de `CLIENT` y `ADMIN`. No se crea
            ningún turno.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: |
            Evento inexistente, en borrador, suspendido o cancelado según el
            snapshot de Catalog. No se revelan datos del evento ni se crea turno.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            El evento está publicado pero no está marcado como de alta demanda
            (`event-not-queued`) o su fila dejó de admitir turnos. No se crea
            ningún turno.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            Catalog no responde al validar el evento. No se crea ningún turno y
            la solicitud puede repetirse sin duplicar la posición.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/queue/events/{eventId}/entries/me:
    get:
      tags:
        - Virtual queue
      operationId: getMyQueueEntry
      summary: Consultar la posición y el estado del turno propio
      description: |
        Devuelve el turno del cliente autenticado en la fila del evento. Antes de
        responder, el servicio abre la tanda vigente (admitiendo a los primeros
        clientes en orden de llegada) y cierra los turnos cuya admisión venció.
        Cuando el turno está `ADMITTED` se devuelve el token de admisión con su
        vencimiento; el token se recalcula desde el turno, así que el cliente
        puede recuperarlo en cualquier consulta.

        Es la operación de sondeo (polling) prevista por la versión simplificada
        de la fila: no hay push ni WebSocket.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Turno propio con su posición, estado y, si corresponde, el token de admisión.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueEntry' }
              examples:
                waiting:
                  $ref: '#/components/examples/QueueEntryWaiting'
                admitted:
                  $ref: '#/components/examples/QueueEntryAdmitted'
        '401':
          description: Token Bearer ausente, inválido o vencido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Identidad ausente o rol distinto de `CLIENT` y `ADMIN`.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: El cliente no tiene un turno activo en la fila de ese evento.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: La fila del evento dejó de admitir turnos.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags:
        - Virtual queue
      operationId: leaveEventQueue
      summary: Abandonar el turno propio en la fila
      description: |
        Cierra el turno activo del cliente en estado `LEFT`. La posición de un
        turno cerrado nunca se reutiliza; si el cliente vuelve a entrar recibe
        una posición nueva al final de la fila. Cualquier token de admisión
        emitido para ese turno queda invalidado.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Turno abandonado. Sin cuerpo.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        '401':
          description: Token Bearer ausente, inválido o vencido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Identidad ausente o rol distinto de `CLIENT` y `ADMIN`.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: El cliente no tiene un turno activo en la fila de ese evento.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/admissions/validate:
    post:
      tags:
        - Virtual queue (internal)
      operationId: validateAdmission
      summary: Validar y consumir un token de admisión
      description: |
        Comando interno consumido por Purchase Service antes de reservar y cobrar
        una orden de un evento de alta demanda. Valida que el token corresponda al
        evento y al comprador, que esté vigente y que el turno siga `ADMITTED`, y
        en la misma transacción marca el turno como `CONSUMED` con la
        `Idempotency-Key` de la orden. Es la única forma de consumir un token: el
        uso único no puede garantizarse desde Purchase. No se publica por el
        Gateway.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdmissionValidationRequest' }
            examples:
              validate:
                $ref: '#/components/examples/AdmissionValidationRequest'
      responses:
        '200':
          description: |
            Token válido, vigente y del turno indicado: queda consumido y la
            compra puede continuar.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmissionValidationResponse' }
              examples:
                admitted:
                  $ref: '#/components/examples/AdmissionValidated'
        '403':
          description: |
            Token ajeno, de otro evento, vencido, de un turno que no está
            `ADMITTED` o ya consumido. La compra no debe continuar.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: El cliente no tiene turno en la fila de ese evento.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: La fila no puede responder. Purchase responde `503` y no reserva ni cobra.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/payments:
    post:
      tags:
        - Payment processing (internal)
      operationId: createPayment
      security: []
      summary: Cobrar una orden de forma idempotente
      description: |
        Registra un cobro por `orderId` de forma idempotente y decide el resultado
        con el token de simulación documentado:
        - `tok_approved` → pago `APPROVED`.
        - `tok_rejected` → pago `REJECTED`.
        - `tok_pending` → pago `PENDING`.

        La misma orden con el mismo monto, moneda, medio y token devuelve el pago
        existente con `200`; la misma orden con contenido distinto responde `409`
        sin crear un segundo cobro. Un token desconocido responde `400` y no
        registra el pago.

        Ruta interna de Payment Mock: no se publica por el Gateway.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              createPayment:
                $ref: '#/components/examples/CreatePaymentRequest'
      responses:
        '201':
          description: Pago nuevo registrado; el estado refleja el token simulado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                approved:
                  $ref: '#/components/examples/PaymentApproved'
        '200':
          description: |
            Repetición idempotente: el `orderId` ya tenía un pago con el mismo
            contenido. Se devuelve el pago existente sin registrar otro
            movimiento.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                approved:
                  $ref: '#/components/examples/PaymentApproved'
        '400':
          description: |
            Token de simulación desconocido o campos inválidos: `orderId`
            ausente, monto no positivo, moneda distinta de `ARS` o medio de pago
            fuera del enum. No se registra el pago.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badRequest:
                  $ref: '#/components/examples/ProblemPaymentBadRequest'
        '409':
          description: |
            El `orderId` ya tiene un pago con otro contenido (monto, moneda, medio
            o token). Se conserva el pago original y no se crea un cobro nuevo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemPaymentConflict'

  /internal/payments/by-order/{orderId}:
    get:
      tags:
        - Payment processing (internal)
      operationId: getPaymentByOrderId
      security: []
      summary: Consultar el pago de una orden
      description: |
        Devuelve el pago registrado para el `orderId`, con su estado actual,
        monto, moneda, medio de pago y fechas. Operación de lectura e idempotente.
        Ruta interna de Payment Mock: no se publica por el Gateway.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pago encontrado para el `orderId`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                approved:
                  $ref: '#/components/examples/PaymentApproved'
        '404':
          description: No existe un pago para el `orderId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemPaymentNotFound'

  /internal/payments/{paymentId}:
    get:
      tags:
        - Payment processing (internal)
      operationId: getPaymentById
      security: []
      summary: Consultar un pago por identificador
      description: |
        Devuelve el pago con su estado actual, monto, moneda, medio de pago y
        fechas. Operación de lectura e idempotente. Ruta interna de Payment Mock:
        no se publica por el Gateway.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pago encontrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                approved:
                  $ref: '#/components/examples/PaymentApproved'
        '404':
          description: No existe un pago con el `paymentId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemPaymentNotFound'

  /internal/payments/{paymentId}/refund:
    post:
      tags:
        - Payment processing (internal)
      operationId: refundPayment
      security: []
      summary: Reintegrar un pago aprobado
      description: |
        Marca un pago `APPROVED` como `REFUNDED` de forma idempotente. Repetir el
        reintegro de un pago ya `REFUNDED` devuelve `200` con el mismo pago sin
        duplicar el movimiento. Un pago `REJECTED` o `PENDING` no puede
        reintegrarse y responde `409`.

        Ruta interna de Payment Mock: no se publica por el Gateway.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Pago `REFUNDED`. Es la respuesta del primer reintegro y también la de
            un reintegro repetido.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                refunded:
                  $ref: '#/components/examples/PaymentRefunded'
        '404':
          description: No existe un pago con el `paymentId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemPaymentNotFound'
        '409':
          description: |
            El pago está `REJECTED` o `PENDING`; sólo un pago `APPROVED` o ya
            `REFUNDED` puede reintegrarse. Se conserva el estado del pago.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemPaymentConflict'

  # ─── INVENTORY CANCELLATION (INTERNAL) ─────────────────────────────────────

  /internal/events/{eventId}/cancellation:
    put:
      tags: [Inventory cancellation (internal)]
      operationId: cancelEventInventory
      security: []
      summary: Bloquear nuevas ventas del inventario de un evento cancelado
      description: |
        Llamado por Catalog tras cambiar el estado del evento a `CANCELLED`.
        Marca el inventario como cancelado e impide nuevas reservas. Idempotente;
        repetir la operación devuelve `204` sin cambios adicionales.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Inventario bloqueado (idempotente).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        '404':
          description: Evento no encontrado o sin inventario.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Error inesperado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/reservations/{reservationId}/sold-units/release:
    post:
      tags: [Inventory cancellation (internal)]
      operationId: releaseSoldUnit
      security: []
      summary: Liberar una unidad vendida para una devolución
      description: |
        Marca una unidad individual como no-vendida en el inventario, tras una
        devolución aprobada. Idempotente por (reservationId, sectorId, seatId,
        unitNumber). Usado exclusivamente por Purchase durante el flujo de
        reembolso.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoldUnitReleaseRequest'
            example:
              sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
              seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
              unitNumber: 1
      responses:
        '200':
          description: Unidad liberada o reintento idempotente.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoldUnitReleaseResponse'
              example:
                reservationId: 7a6b5c4d-3e2f-41a0-9b8c-7d6e5f4a3b2c
                sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
                seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
                unitNumber: 1
                released: true
        '400':
          description: Número de unidad inválido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: La unidad no está vendida por esta reserva.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Error inesperado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── TICKET ISSUANCE (INTERNAL) ────────────────────────────────────────────

  /internal/orders/{orderId}/items/{orderItemId}/tickets:
    post:
      tags: [Ticket issuance (internal)]
      operationId: issueTicketsForOrderItem
      security: []
      summary: Emitir o recuperar tickets QR para un ítem confirmado
      description: |
        Purchase llama este comando solo tras confirmar pago e inventario.
        La idempotencia usa orderId + orderItemId. Repetir la solicitud con el
        mismo contenido devuelve los mismos tickets y QR.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: orderItemId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketIssueRequest'
            example:
              customerId: 3f1a2b3c-4d5e-4f60-8a91-b2c3d4e5f601
              eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
              eventName: Concierto de prueba
              eventStartsAt: '2026-12-01T21:00:00Z'
              venueName: Estadio
              venueCity: Buenos Aires
              sectorName: Platea
              tickets:
                - unitNumber: 1
                  rowLabel: A
                  seatNumber: 1
      responses:
        '201':
          description: Tickets emitidos.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketIssueResponse'
        '200':
          description: Reintento idempotente; mismos tickets y QR.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketIssueResponse'
        '400':
          description: Snapshot o unidades inválidas.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Idempotencia con contenido distinto.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── TICKET REVOCATION (INTERNAL) ──────────────────────────────────────────

  /internal/tickets/{ticketId}/revoke:
    post:
      tags: [Ticket revocation (internal)]
      operationId: revokeTicket
      security: []
      summary: Revocar un ticket emitido tras una devolución aprobada
      description: |
        Comando interno idempotente. Repetir para un ticket ya revocado
        devuelve el mismo resultado. Un ticket `USED` no puede revocarse (409).
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Ticket revocado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketRevocationResponse'
              example:
                ticketId: 2a2383ad-0396-4465-820f-5d75710c0206
                status: REVOKED
        '404':
          description: Ticket no encontrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Ticket ya usado; no puede revocarse.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── PAYMENT PARTIAL REFUND (INTERNAL) ─────────────────────────────────────

  /internal/payments/{paymentId}/refunds:
    post:
      tags: [Payment processing (internal)]
      operationId: refundPaymentPartial
      security: []
      summary: Reintegrar un monto parcial de un pago
      description: |
        Registra un reintegro parcial por un monto específico con clave de
        idempotencia. Usado por Purchase durante devoluciones individuales de
        tickets: cada ticket genera un reintegro parcial con su propio
        `idempotencyKey` (el `refundId`).

        Un pago puede tener múltiples reintegros parciales mientras la suma no
        supere el monto original. Si la `idempotencyKey` ya fue usada con el
        mismo monto, devuelve el reintegro existente (200).
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialRefundRequest'
            example:
              idempotencyKey: b766df75-bfc3-4d64-b502-ea24dca4ef34
              amount: 12000.00
      responses:
        '201':
          description: Reintegro parcial registrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialRefundResponse'
              example:
                refundId: r1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
                paymentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                amount: 12000.00
                status: REFUNDED
                createdAt: '2026-11-10T12:01:00Z'
        '200':
          description: Reintento idempotente; mismo reintegro.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialRefundResponse'
        '400':
          description: Monto inválido o idempotencyKey faltante.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Pago no encontrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Pago no APPROVED, monto excede disponible, o idempotencyKey con otro monto.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/access/events/{eventId}/validations:
    post:
      tags: [Access control]
      operationId: validateTicketAccess
      summary: Validar el QR de una entrada y registrar el ingreso
      description: |
        Requiere rol `ACCESS_STAFF`. Verifica la firma HMAC del QR, que la
        entrada exista, que corresponda al evento de la ruta y que no haya sido
        usada ni revocada. El ingreso se marca con un único
        `UPDATE ... WHERE status = 'ISSUED'`: ante escaneos simultáneos del mismo
        QR (aun desde varias instancias) exactamente uno obtiene `200`. Cada
        intento queda registrado en `access_scans` y en la bitácora centralizada.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessValidationRequest' }
            example:
              qrPayload: v1.2a2383ad-0396-4465-820f-5d75710c0206.p7x1yJ4vR0xg0kC6bQbqk1x7m2f3nV0gQ5h6t8e9w0A
              gate: Puerta 3
      responses:
        '200':
          description: Entrada válida; queda marcada como utilizada.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessValidationResponse' }
              example:
                result: ADMITTED
                ticketId: 2a2383ad-0396-4465-820f-5d75710c0206
                eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
                eventName: Recital Rosario
                sectorName: Platea
                rowLabel: F
                seatNumber: 7
                status: USED
                usedAt: '2027-03-10T20:41:12.318Z'
                gate: Puerta 3
                validatedBy: d160e54c-5f88-49a1-9e9a-2c901ac70a01
        '400':
          description: Cuerpo inválido (qrPayload ausente o vacío).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Token Bearer ausente, inválido o vencido; lo responde el Gateway sin invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: El rol no es ACCESS_STAFF.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 'QR con firma inválida o entrada inexistente (`reason: UNKNOWN_TICKET`).'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AccessProblem' }
        '409':
          description: 'Entrada ya utilizada (`reason: ALREADY_USED`, con `usedAt` y `usedGate`) o revocada por devolución/cancelación (`reason: REVOKED`).'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AccessProblem' }
        '422':
          description: 'La entrada corresponde a otro evento (`reason: WRONG_EVENT`); no se consume.'
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AccessProblem' }

  /api/access/events/{eventId}/scans:
