  # ─── CATALOG EVENT DISCOVERY (PUBLIC) ──────────────────────────────────────

  /api/events:
    get:
      tags: [Catalog event discovery (public)]
      operationId: searchPublishedEvents
      security: []
      summary: Buscar eventos publicados
      description: |
        Filtros combinan con AND. Fechas inclusivas. Página base cero, tamaño
        1..50. Sort: `date`, `price`, `relevance`; direction: `asc` o `desc`.
        `sort=relevance` exige `q`. No requiere encabezados de identidad.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: type, in: query, required: false, schema: { type: string }, description: Tipo de evento. }
        - { name: organizerId, in: query, required: false, schema: { type: string, format: uuid }, description: Filtrar por organizador. }
        - { name: participant, in: query, required: false, schema: { type: string }, description: Filtrar por participante (substring). }
        - { name: city, in: query, required: false, schema: { type: string }, description: Filtrar por ciudad (case insensitive). }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: Inicio de rango (inclusivo). }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: Fin de rango (inclusivo). }
        - { name: q, in: query, required: false, schema: { type: string }, description: Texto para sort=relevance. }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [date, price, relevance], default: date } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: Resultado paginado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSearchPage'
              example:
                items:
                  - id: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
                    name: Summer Live
                    eventType: MUSIC
                    startsAt: '2030-01-01T20:00:00-03:00'
                    city: Buenos Aires
                    minimumPrice: 25.50
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400':
          description: Rango de fechas, paginación, sort inválido o falta q.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/events/{id}:
    get:
      tags: [Catalog event discovery (public)]
      operationId: getPublishedEventDetail
      security: []
      summary: Obtener detalle de un evento publicado
      description: |
        Devuelve datos inmutables del snapshot. No incluye disponibilidad.
        No requiere encabezados de identidad.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: Event UUID }
      responses:
        '200':
          description: Snapshot publicado del evento.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
              example:
                id: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
                organizerId: 3f1a2b3c-4d5e-4f60-8a91-b2c3d4e5f601
                name: Summer Live
                description: Concierto de verano
                eventType: MUSIC
                startsAt: '2030-01-01T20:00:00-03:00'
                venueName: River Hall
                venueAddress: Av. Siempreviva 742
                city: Buenos Aires
                latitude: -34.6037
                longitude: -58.3816
                participants: [The Example Band]
                sectors:
                  - id: s1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
                    name: General
                    type: GENERAL_ADMISSION
                    capacity: 500
                    price: 25.50
                    seats: []
        '404':
          description: Evento inexistente o no visible públicamente.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/inventory/events/{eventId}/availability:
    get:
      tags:
        - Inventory availability
      operationId: getEventAvailability
      security: []
      summary: Consultar la disponibilidad pública de un evento
      description: |
        Devuelve la disponibilidad agregada por sector y, para sectores
        numerados, el estado de cada asiento. Antes de responder, Inventory
        garantiza que el inventario exista y expira las reservas vencidas del
        evento.

        La respuesta nunca incluye precios, datos del comprador, `orderId` ni
        `reservationId`. Si el evento recién se inicializa y Catalog no responde,
        se devuelve `503` sin dejar inventario parcial.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Disponibilidad del evento calculada en `generatedAt`. Los sectores
            vienen ordenados por `name` y luego por `sectorId`; los asientos por
            `row` y luego por `number`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
              examples:
                availability:
                  $ref: '#/components/examples/Availability'
        '404':
          description: |
            El evento no existe o no tiene snapshot publicado en Catalog.
            Inventory no crea inventario parcial.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '503':
          description: |
            Catalog no está disponible durante la inicialización del inventario.
            La solicitud puede reintentarse más tarde.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/ProblemServiceUnavailable'
        '504':
          description: |
            El API Gateway no obtuvo respuesta de Inventory dentro del tiempo de
            espera. El cuerpo es un problema y conserva el `X-Correlation-Id`
            resuelto por el Gateway.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                gatewayTimeout:
                  $ref: '#/components/examples/ProblemGatewayTimeout'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
            credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /internal/reservations:
    post:
      tags:
        - Inventory reservations (internal)
      operationId: createReservation
      security: []
      summary: Crear una reserva temporal
      description: |
        Retiene todos los ítems solicitados en una única transacción: o se
        retienen todos, o no se retiene ninguno. La reserva usa el TTL del evento
        salvo que `ttlSeconds` se informe explícitamente.

        Idempotencia por `orderId` más el fingerprint canónico del contenido:
        - Si no existe una reserva para el `orderId`, se crea y se responde
          `201`.
        - Si existe una reserva `ACTIVE` o `CONFIRMED` con el mismo contenido, se
          devuelve la existente con `200` y no se retienen lugares adicionales.
        - Si el `orderId` existe con otro contenido, o la reserva está `EXPIRED`
          o `RELEASED`, se responde `409` sin modificar el inventario.

        Los comandos de reserva son internos y no se publican por el Gateway.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
            examples:
              reservation:
                $ref: '#/components/examples/ReservationRequest'
      responses:
        '201':
          description: |
            Reserva nueva creada. Todos los ítems quedaron retenidos hasta
            `expiresAt`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              examples:
                created:
                  $ref: '#/components/examples/ReservationActive'
        '200':
          description: |
            Reintento idempotente: ya existía una reserva `ACTIVE` o `CONFIRMED`
            para el mismo `orderId` y el mismo contenido. Se devuelve la reserva
            existente sin retener lugares adicionales.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              examples:
                existing:
                  $ref: '#/components/examples/ReservationActive'
        '400':
          description: |
            Payload inválido: sector inexistente, asiento ajeno al sector,
            cantidad no positiva, mezcla inválida de `seatId` y `quantity`,
            ítems duplicados o TTL fuera del rango 60..3600 s. No se modifica el
            inventario.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badRequest:
                  $ref: '#/components/examples/ProblemBadRequest'
        '404':
          description: |
            El evento no existe o no tiene snapshot publicado. No se crea
            inventario parcial ni una reserva activa.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '409':
          description: |
            Conflicto de disponibilidad (algún ítem ya está retenido o vendido),
            de estado final (`EXPIRED` o `RELEASED`) o de idempotencia (mismo
            `orderId` con contenido distinto). La transacción revierte completa:
            no queda ninguna retención parcial.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemConflict'
        '503':
          description: |
            Catalog no está disponible durante la inicialización del inventario.
            La solicitud puede reintentarse.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/ProblemServiceUnavailable'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
            credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

