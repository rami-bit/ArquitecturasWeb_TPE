          items: { type: string, format: uuid }
          example: [3f6f1c2a-8e6b-4a1d-9a2c-5d7e8f9a0b1c]
        coPurchases:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/CoPurchaseSignal' }
        generatedAt: { type: string, format: date-time, example: '2026-11-20T12:00:00Z' }
    EventCandidate:
      type: object
      description: Evento publicado y futuro, sin informacion de disponibilidad.
      required: [eventId, name, eventType, startsAt, city, participants, minPrice]
      properties:
        eventId: { type: string, format: uuid }
        name: { type: string, example: Recital de Primavera }
