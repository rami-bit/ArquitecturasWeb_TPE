openapi: 3.0.3

info:
  title: TicketYa API - Consolidated contracts
  version: '0.2.0'
  description: |
    Contrato versionado consolidado de TicketYa para los incrementos
    `establish-inventory-and-reservations` (E1-02, PDF-F4/F5) y
    `establish-purchase-and-ticketing` (E1-03, PDF-F4/F5/F6).

    Este documento cubre:
    - La **disponibilidad pública** de inventario, publicada por el API Gateway.
    - Los **contratos internos de Inventory** para reservas temporales, consulta,
      confirmación, liberación y configuración de retención, consumidos por
      Purchase Service.
    - El **snapshot interno de Catalog**, contrato de lectura que Inventory usa
      para materializar el layout de un evento sin copiar precios.
    - El **snapshot interno de compra de Catalog**, que agrega el precio por
      sector y sólo consume Purchase Service para valorizar la orden y emitir
      tickets.
    - La **API pública de Purchase Service** para crear, consultar, listar y
      reconciliar órdenes de compra.
    - Los **contratos internos de Payment Mock** para cobrar, consultar y
      reintegrar pagos de forma idempotente.

    Las rutas `/internal/**` existen únicamente en la red interna de servicios y
    **no se publican por el Gateway**. Inventory Service escucha en
    `inventory-service:8082`, Catalog Service en `catalog-service:8081`,
    Payment Mock en `payment-mock:8085` y Purchase Service en
    `purchase-service:8084`. La superficie pública de este contrato es
    `GET /api/inventory/events/{eventId}/availability`, `POST /api/orders`,
    `GET /api/orders`, `GET /api/orders/{orderId}` y
    `POST /api/orders/{orderId}/reconcile`.

    Reglas transversales:
    - La disponibilidad nunca incluye precios, comprador, `orderId` ni
      `reservationId`.
    - `sectorId` y `seatId` son identificadores de Inventory; se descubren en la
      disponibilidad y se reutilizan al reservar.
    - `sourceSectorId` y `sourceSeatId` son identificadores de Catalog y sólo
      aparecen en los snapshots internos y en la respuesta de reserva
      enriquecida.
    - El TTL de retención por defecto es 600 s y el rango permitido es
      60..3600 s.
    - Todos los errores usan `application/problem+json` con `status`, `title`,
      `detail`, `instance` y `correlationId`.
    - Toda solicitud y toda respuesta llevan `X-Correlation-Id`.
    - No hay autenticación JWT en E1. Purchase identifica al comprador con
      `X-User-Id` obligatorio y `X-User-Role` opcional (`CLIENT` o `ADMIN`); los
      comandos internos se protegen por aislamiento de red.
    - `POST /api/orders` exige `Idempotency-Key` (1..120 caracteres). La misma
      clave con el mismo contenido devuelve la orden existente; con otro
      contenido responde `409` sin modificarla.
    - Estados de orden (`OrderStatus`): `CONFIRMED`, `REJECTED`,
      `PAYMENT_PENDING`, `PAID_PENDING_TICKETS` y `COMPENSATED`. `CONFIRMED`,
      `REJECTED` y `COMPENSATED` son terminales; `PAYMENT_PENDING` y
      `PAID_PENDING_TICKETS` son reconciliables.
    - Estados de pago (`PaymentStatus`): `APPROVED`, `REJECTED`, `PENDING` y
      `REFUNDED`. El resultado simulado se elige con el token documentado
      `tok_approved`, `tok_rejected` o `tok_pending`.
    - Los montos son decimales expresados en la moneda de la orden (ARS en E1) y
      los timestamps son `date-time` en UTC.

servers:
  - url: http://localhost:8080
    description: |
      API Gateway público. Expone únicamente `/api/inventory/**`, las rutas
      públicas de Catalog y `/api/orders/**`, con precedencia de las órdenes
      sobre la ruta catch-all de catálogo. No enruta `/internal/**`.
  - url: http://purchase-service:8084
    description: |
      Red interna de Compose. Purchase Service expone la API de órdenes en
      `/api/orders/**`, que el Gateway publica en `http://localhost:8080`. No
      publica puerto al host.
  - url: http://payment-mock:8085
    description: |
      Red interna de Compose. Payment Mock expone sólo los comandos internos
      `/internal/payments/**`. No publica puerto al host y el Gateway no lo
      enruta.
  - url: http://catalog-service:8081
    description: |
      Red interna de Compose. Catalog Service expone el snapshot interno sin
      precios `GET /internal/events/{eventId}/snapshot` y el snapshot de compra
      con precios `GET /internal/events/{eventId}/purchase-snapshot`. No publica
      puerto al host.
  - url: http://inventory-service:8082
    description: |
      Red interna de Compose. Inventory Service expone la disponibilidad y los
      comandos `/internal/**` de reservas y configuración. No publica puerto al
      host.

security: []

tags:
  - name: Inventory availability
    description: |
      Consulta pública de disponibilidad a través del API Gateway. No requiere
      autenticación ni encabezados de identidad.
  - name: Inventory reservations (internal)
    description: |
      Comandos internos de reserva, consulta, confirmación y liberación,
      consumidos por Purchase Service. Sólo accesibles dentro de la red de
      servicios; el Gateway no los publica.
  - name: Inventory configuration (internal)
    description: |
      Configuración interna de la retención (TTL) por evento. Sólo accesible
      dentro de la red de servicios.
  - name: Catalog snapshot (internal)
    description: |
      Contrato interno de lectura del snapshot publicado de Catalog, usado por
      Inventory para inicializar el layout de un evento. No incluye precios y no
      se publica por el Gateway.
  - name: Catalog purchase snapshot (internal)
    description: |
      Contrato interno de lectura del snapshot publicado de Catalog con el precio
      de cada sector, usado exclusivamente por Purchase Service para validar
      ítems, fijar precios históricos y emitir tickets. Es independiente del
      snapshot de inventario, que sigue sin precios. Sólo es accesible en la red
      de servicios: el Gateway no publica esta ruta.
  - name: Purchase orders
    description: |
      API pública de órdenes de compra publicada por el API Gateway en
      `http://localhost:8080`. Requiere `X-User-Id` válido y, para crear una
      orden, `Idempotency-Key`; `X-User-Role` es opcional y `ADMIN` puede
      consultar órdenes de cualquier comprador. `X-Correlation-Id` es opcional en
      todas las solicitudes. Los comandos internos de Purchase no forman parte de
      esta superficie.
  - name: Payment processing (internal)
    description: |
      Comandos internos de Payment Mock para cobrar, consultar y reintegrar pagos
      de forma idempotente. Sólo son accesibles dentro de la red de servicios en
      `payment-mock:8085`; el Gateway no publica ninguna de estas rutas.

paths:
  /api/inventory/events/{eventId}/availability:
    get:
      tags:
        - Inventory availability
      operationId: getEventAvailability
      summary: Consultar la disponibilidad pública de un evento
      description: |
        Devuelve la disponibilidad agregada por sector y, para sectores
        numerados, el estado de cada asiento. Antes de responder, Inventory
        garantiza que el inventario exista y expira las reservas vencidas del
        evento.

        La respuesta nunca incluye precios, datos del comprador, `orderId` ni
        `reservationId`. Si el evento recién se inicializa y Catalog no responde,
        se devuelve `503` sin dejar inventario parcial.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Disponibilidad del evento calculada en `generatedAt`. Los sectores
            vienen ordenados por `name` y luego por `sectorId`; los asientos por
            `row` y luego por `number`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
              examples:
                availability:
                  $ref: '#/components/examples/Availability'
        '404':
          description: |
            El evento no existe o no tiene snapshot publicado en Catalog.
            Inventory no crea inventario parcial.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '503':
          description: |
            Catalog no está disponible durante la inicialización del inventario.
            La solicitud puede reintentarse más tarde.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/ProblemServiceUnavailable'
        '504':
          description: |
            El API Gateway no obtuvo respuesta de Inventory dentro del tiempo de
            espera. El cuerpo es un problema y conserva el `X-Correlation-Id`
            resuelto por el Gateway.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                gatewayTimeout:
                  $ref: '#/components/examples/ProblemGatewayTimeout'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
            credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /internal/reservations:
    post:
      tags:
        - Inventory reservations (internal)
      operationId: createReservation
      summary: Crear una reserva temporal
      description: |
        Retiene todos los ítems solicitados en una única transacción: o se
        retienen todos, o no se retiene ninguno. La reserva usa el TTL del evento
        salvo que `ttlSeconds` se informe explícitamente.

        Idempotencia por `orderId` más el fingerprint canónico del contenido:
        - Si no existe una reserva para el `orderId`, se crea y se responde
          `201`.
        - Si existe una reserva `ACTIVE` o `CONFIRMED` con el mismo contenido, se
          devuelve la existente con `200` y no se retienen lugares adicionales.
        - Si el `orderId` existe con otro contenido, o la reserva está `EXPIRED`
          o `RELEASED`, se responde `409` sin modificar el inventario.

        Los comandos de reserva son internos y no se publican por el Gateway.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
            examples:
              reservation:
                $ref: '#/components/examples/ReservationRequest'
      responses:
        '201':
          description: |
            Reserva nueva creada. Todos los ítems quedaron retenidos hasta
            `expiresAt`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              examples:
                created:
                  $ref: '#/components/examples/ReservationActive'
        '200':
          description: |
            Reintento idempotente: ya existía una reserva `ACTIVE` o `CONFIRMED`
            para el mismo `orderId` y el mismo contenido. Se devuelve la reserva
            existente sin retener lugares adicionales.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              examples:
                existing:
                  $ref: '#/components/examples/ReservationActive'
        '400':
          description: |
            Payload inválido: sector inexistente, asiento ajeno al sector,
            cantidad no positiva, mezcla inválida de `seatId` y `quantity`,
            ítems duplicados o TTL fuera del rango 60..3600 s. No se modifica el
            inventario.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badRequest:
                  $ref: '#/components/examples/ProblemBadRequest'
        '404':
          description: |
            El evento no existe o no tiene snapshot publicado. No se crea
            inventario parcial ni una reserva activa.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '409':
          description: |
            Conflicto de disponibilidad (algún ítem ya está retenido o vendido),
            de estado final (`EXPIRED` o `RELEASED`) o de idempotencia (mismo
            `orderId` con contenido distinto). La transacción revierte completa:
            no queda ninguna retención parcial.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemConflict'
        '503':
          description: |
            Catalog no está disponible durante la inicialización del inventario.
            La solicitud puede reintentarse.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/ProblemServiceUnavailable'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
            credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /internal/reservations/by-order/{orderId}:
    get:
      tags:
        - Inventory reservations (internal)
      operationId: getReservationByOrderId
      summary: Recuperar la reserva de un orderId
      description: |
        Devuelve el estado, el vencimiento y los ítems de la reserva asociada al
        `orderId`. Es una operación de lectura e idempotente.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reserva encontrada para el `orderId`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              examples:
                active:
                  $ref: '#/components/examples/ReservationActive'
        '404':
          description: No existe una reserva para el `orderId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
            credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /internal/reservations/{reservationId}:
    get:
      tags:
        - Inventory reservations (internal)
      operationId: getReservationById
      summary: Recuperar una reserva por identificador
      description: |
        Devuelve el estado, el vencimiento y los ítems de la reserva. Es una
        operación de lectura e idempotente.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reserva encontrada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              examples:
                active:
                  $ref: '#/components/examples/ReservationActive'
        '404':
          description: No existe una reserva con el `reservationId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
            credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /internal/reservations/{reservationId}/confirm:
    post:
      tags:
        - Inventory reservations (internal)
      operationId: confirmReservation
      summary: Confirmar la venta de una reserva
      description: |
        Convierte los lugares retenidos en vendidos de forma atómica. Las
        confirmaciones repetidas devuelven el mismo estado `CONFIRMED` sin
        duplicar ventas.

        Una reserva `EXPIRED` o `RELEASED` no puede confirmarse: se responde
        `409` sin modificar el inventario.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Confirmación exitosa o idempotente. La reserva queda `CONFIRMED` y
            sus lugares quedan `SOLD`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              examples:
                confirmed:
                  $ref: '#/components/examples/ReservationConfirmed'
        '404':
          description: No existe una reserva con el `reservationId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '409':
          description: |
            La reserva está `EXPIRED` o `RELEASED` y no puede confirmarse, o la
            confirmación no pudo aplicarse completa. El inventario no cambia.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemConflict'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
            credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /internal/reservations/{reservationId}/release:
    post:
      tags:
        - Inventory reservations (internal)
      operationId: releaseReservation
      summary: Liberar una reserva
      description: |
        Devuelve los lugares retenidos a disponible de forma atómica. Las
        liberaciones repetidas conservan el estado final sin alterar lugares
        vendidos.

        Una reserva `CONFIRMED` no puede liberarse porque sus lugares son
        `SOLD`: se responde `409`.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Liberación exitosa o idempotente. La reserva queda `RELEASED` (o
            conserva su estado final `EXPIRED`/`RELEASED`) y los lugares `HELD`
            vuelven a `AVAILABLE`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              examples:
                released:
                  $ref: '#/components/examples/ReservationReleased'
        '404':
          description: No existe una reserva con el `reservationId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '409':
          description: |
            La reserva está `CONFIRMED`; sus lugares son `SOLD` y no pueden
            liberarse. El inventario no cambia.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemConflict'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
            credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /internal/events/{eventId}/hold-ttl:
    put:
      tags:
        - Inventory configuration (internal)
      operationId: updateEventHoldTtl
      summary: Configurar la retención de un evento
      description: |
        Fija el TTL que usarán las reservas posteriores del evento cuando no
        informen `ttlSeconds`. El valor por defecto del evento es 600 s y el
        rango permitido es 60..3600 s. La operación es idempotente por `eventId`
        y valor. Requiere que el inventario del evento ya exista; no lo
        inicializa ni consulta Catalog.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldTtlRequest'
            examples:
              holdTtl:
                $ref: '#/components/examples/HoldTtlRequest'
      responses:
        '200':
          description: TTL vigente del evento después de la actualización.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventHoldConfiguration'
              examples:
                configured:
                  $ref: '#/components/examples/EventHoldConfiguration'
        '400':
          description: |
            `ttlSeconds` falta, no es entero o está fuera del rango 60..3600 s.
            Se conserva el valor anterior.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badRequest:
                  $ref: '#/components/examples/ProblemBadRequest'
        '404':
          description: |
            El evento no existe, no tiene snapshot publicado o todavía no tiene
            inventario materializado. No se crea inventario ni configuración
            parcial.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
            credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /internal/events/{eventId}/snapshot:
    get:
      tags:
        - Catalog snapshot (internal)
      operationId: getCatalogEventSnapshot
      summary: Leer el snapshot publicado de un evento
      description: |
        Contrato interno de Catalog que Inventory consume para materializar el
        inventario de un evento. Devuelve el snapshot inmutable con los
        identificadores de origen de sectores y asientos, sus tipos, capacidades
        y datos de ubicación.

        La respuesta no incluye precios. `sourceSectorId` y `sourceSeatId` son
        identificadores de Catalog y no se usan como claves de los comandos de
        reserva de Inventory. El Gateway no publica esta ruta.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Snapshot publicado del evento. Los sectores siguen el orden estable
            del snapshot y los asientos se ordenan por `row` y `number`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEventSnapshot'
              examples:
                snapshot:
                  $ref: '#/components/examples/CatalogEventSnapshot'
        '404':
          description: |
            El evento no existe, está en borrador o no tiene snapshot publicado.
            No se revelan datos del evento.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '500':
          description: |
            Error inesperado en Catalog. El cuerpo es un problema genérico sin
            trazas, credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /internal/events/{eventId}/purchase-snapshot:
    get:
      tags:
        - Catalog purchase snapshot (internal)
      operationId: getCatalogPurchaseSnapshot
      summary: Leer el snapshot de compra de un evento con precios
      description: |
        Contrato interno de Catalog que Purchase Service consume para validar los
        ítems de una orden, fijar el precio histórico de cada sector y emitir los
        tickets. Devuelve el snapshot publicado e inmutable del evento con los
        datos del lugar, los sectores, sus asientos y el precio unitario de cada
        sector.

        Es un contrato **separado** del snapshot de inventario
        `GET /internal/events/{eventId}/snapshot`, que sigue sin precios y lo
        consume Inventory. El Gateway no publica esta ruta; sólo es accesible
        desde la red interna en `catalog-service:8081`.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Snapshot publicado del evento con precios por sector. Los sectores
            siguen el orden estable del snapshot y los asientos se ordenan por
            `row` y `number`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPurchaseSnapshot'
              examples:
                purchaseSnapshot:
                  $ref: '#/components/examples/CatalogPurchaseSnapshot'
        '404':
          description: |
            El evento no existe, no está publicado o está suspendido o cancelado.
            No se revelan datos del evento y Purchase no puede crear la orden.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '500':
          description: |
            Error inesperado en Catalog. El cuerpo es un problema genérico sin
            trazas, credenciales ni detalles de la base de datos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalServerError:
                  $ref: '#/components/examples/ProblemInternalServerError'

  /api/events/{eventId}/cancellation:
    post:
      tags: [Refunds and cancellation]
      summary: Cancelar un evento y procesar un lote de reintegros
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/UserId'
        - in: header
          name: X-User-Role
          required: true
          schema: { type: string, enum: [ADMIN] }
      responses:
        '200':
          description: Todos los tickets procesados, o reintento idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationProgress' }
              example: { eventId: 'e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b', status: COMPLETED, totalTickets: 2, completedTickets: 2, pendingTickets: 0 }
        '202':
          description: Hay tickets pendientes; repetir POST para continuar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationProgress' }
              example: { eventId: 'e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b', status: PROCESSING, totalTickets: 2, completedTickets: 1, pendingTickets: 1 }
        '403': { description: Solo ADMIN puede cancelar }
        '404': { description: Evento inexistente }
        '409': { description: Estado del evento no cancelable }
    get:
      tags: [Refunds and cancellation]
      summary: Consultar avance de reintegros de un evento cancelado
      parameters:
        - $ref: '#/components/parameters/EventId'
        - in: header
          name: X-User-Role
          required: true
          schema: { type: string, enum: [ADMIN] }
      responses:
        '200':
          description: Progreso actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationProgress' }
        '403': { description: Solo ADMIN puede consultar }
        '404': { description: Cancelacion no iniciada }

  /api/refunds/tickets/{ticketId}:
    post:
      tags: [Refunds and cancellation]
      summary: Solicitar devolucion de un ticket propio antes de las 72 horas previas al evento
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/UserId'
      responses:
        '201':
          description: Solicitud pendiente creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundView' }
        '200':
          description: Reintento devuelve la misma solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundView' }
        '404': { description: Ticket no pertenece al comprador o no existe }
        '409': { description: Ventana cerrada o ticket no reembolsable }

  /api/refunds/{refundId}:
    get:
      tags: [Refunds and cancellation]
      summary: Consultar devolucion propia
      parameters:
        - in: path
          name: refundId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Estado, importe, decision y progreso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundView' }
        '404': { description: Solicitud inexistente o de otro comprador }

  /api/refunds/{refundId}/decision:
    post:
      tags: [Refunds and cancellation]
      summary: Aprobar o rechazar devolucion como ADMIN
      parameters:
        - in: path
          name: refundId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-User-Role
          required: true
          schema: { type: string, enum: [ADMIN] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
            examples:
              approve: { value: { decision: APPROVED } }
              reject: { value: { decision: REJECTED } }
      responses:
        '200':
          description: Rechazada o reintegro completado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundView' }
        '202':
          description: Decision guardada; falta completar un paso interno reintentable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundView' }
        '403': { description: Solo ADMIN puede decidir }
        '404': { description: Solicitud inexistente }
        '409': { description: Decision incompatible con la ya guardada }

  /api/orders:
    post:
      tags:
        - Purchase orders
      operationId: createOrder
      summary: Crear una orden de compra y ejecutar la saga
      description: |
        Crea una orden para un evento publicado y ejecuta la saga síncrona:
        snapshot de compra de Catalog, reserva en Inventory, cobro en Payment
        Mock, confirmación de inventario y emisión idempotente de tickets.

        Reglas del request:
        - `X-User-Id` es obligatorio y determina el comprador; `X-User-Role` es
          opcional (`CLIENT` o `ADMIN`).
        - `Idempotency-Key` es obligatorio (1..120 caracteres). La misma clave
          del mismo comprador con el mismo contenido devuelve la orden existente
          sin reservar, cobrar ni emitir de nuevo; con otro contenido responde
          `409` y conserva la orden original.
        - `items[].sectorId` es el identificador de **Inventory** descubierto en
          la disponibilidad pública.
        - Cada ítem informa **exactamente uno** de `seatIds` (sector `NUMBERED`)
          o `quantity` (sector `GENERAL_ADMISSION`). Los precios nunca se toman
          del request: provienen del snapshot de compra de Catalog.
        - `payment.token` es el token de simulación documentado y determina el
          resultado del cobro: `tok_approved`, `tok_rejected` o `tok_pending`.

        El límite configurable de entradas por cliente y evento (seis por defecto)
        se valida de forma atómica antes de reservar.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              createOrder:
                $ref: '#/components/examples/CreateOrderRequest'
      responses:
        '201':
          description: |
            Orden `CONFIRMED`: la reserva quedó vendida, el pago está `APPROVED` y
            todos los tickets fueron emitidos.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                confirmed:
                  $ref: '#/components/examples/OrderConfirmed'
        '200':
          description: |
            Repetición idempotente: ya existía una orden para la misma
            `X-User-Id` e `Idempotency-Key` con el mismo contenido. Se devuelve la
            orden existente en su estado actual, sin nuevas reservas, cobros ni
            tickets. Puede ser una orden `CONFIRMED`, `REJECTED`,
            `PAYMENT_PENDING`, `PAID_PENDING_TICKETS` o `COMPENSATED`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                confirmedReplay:
                  $ref: '#/components/examples/OrderConfirmed'
                rejectedReplay:
                  $ref: '#/components/examples/OrderRejected'
                paymentPendingReplay:
                  $ref: '#/components/examples/OrderPaymentPending'
        '202':
          description: |
            Orden `PAYMENT_PENDING`: Payment devolvió `PENDING` o no respondió
            dentro del tiempo de espera. La reserva se conserva hasta
            `reservationExpiresAt` y la orden puede reconciliarse con
            `POST /api/orders/{orderId}/reconcile`. Un timeout de pago nunca se
            interpreta como rechazo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                paymentPending:
                  $ref: '#/components/examples/OrderPaymentPending'
        '402':
          description: |
            Pago rechazado por la pasarela simulada. Purchase libera la reserva,
            libera el límite de unidades y la orden queda `REJECTED` sin tickets.
            El cuerpo es un problema con el `orderId` y el estado de la orden como
            contexto.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                paymentRejected:
                  $ref: '#/components/examples/ProblemPaymentRejected'
        '400':
          description: |
            Request inválido: falta `Idempotency-Key`, ítem sin sector, ítem que
            informa `seatIds` y `quantity` a la vez o ninguno, cantidad no
            positiva, asiento ajeno al sector, ítem duplicado, evento ausente o
            medio o token de pago inválido. No se reserva ni se cobra.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badRequest:
                  $ref: '#/components/examples/ProblemOrderBadRequest'
        '403':
          description: |
            Identidad inválida o ausente: `X-User-Id` falta, no es un UUID o el
            rol informado no es válido. No se crea la orden.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/ProblemIdentityRequired'
        '404':
          description: |
            Evento no comprable: no existe, está en borrador, suspendido o
            cancelado según el snapshot de compra de Catalog. No se reserva ni se
            cobra.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemOrderNotFound'
        '409':
          description: |
            Conflicto sin cambios parciales: falta de disponibilidad en Inventory,
            límite de entradas del cliente y evento excedido, o `Idempotency-Key`
            reutilizada con contenido distinto. También se usa cuando el pago fue
            aprobado pero la reserva ya no puede confirmarse y la orden queda
            `COMPENSATED` tras reintegrar el pago y liberar el inventario.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemOrderConflict'
        '503':
          description: |
            Dependencia no disponible: Catalog, Inventory, Payment o Ticket no
            responden o exceden el tiempo de espera sin dejar una orden confirmada
            parcialmente. La solicitud puede reintentarse con la misma
            `Idempotency-Key`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                serviceUnavailable:
                  $ref: '#/components/examples/ProblemDependencyUnavailable'
    get:
      tags:
        - Purchase orders
      operationId: listOrders
      summary: Listar las órdenes del comprador
      description: |
        Devuelve las órdenes del comprador identificado por `X-User-Id`,
        paginadas y ordenadas por `createdAt` descendente. Un cliente sólo ve sus
        propias órdenes; `X-User-Role: ADMIN` puede ver las de todos los
        compradores.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/OrderStatusFilter'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Página de órdenes. `items` contiene órdenes completas con ítems, pago
            y tickets; `totalPages` se calcula a partir de `totalElements` y
            `size`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                page:
                  $ref: '#/components/examples/OrderPage'
        '400':
          description: |
            Parámetros de paginación o filtro inválidos: `page` negativo,
            `size` fuera de 1..50 o `status` fuera del enum `OrderStatus`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badRequest:
                  $ref: '#/components/examples/ProblemOrderBadRequest'
        '403':
          description: |
            Identidad inválida o ausente: `X-User-Id` falta, no es un UUID o el
            rol informado no es válido.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/ProblemIdentityRequired'

  /api/orders/{orderId}:
    get:
      tags:
        - Purchase orders
      operationId: getOrder
      summary: Consultar una orden de compra
      description: |
        Devuelve la orden con sus ítems, unidades, pago y tickets. Un cliente
        sólo puede consultar sus propias órdenes: si la orden pertenece a otro
        comprador se responde `404` sin revelar su existencia. `ADMIN` puede
        consultar cualquier orden.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Orden encontrada y visible para el comprador autenticado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                confirmed:
                  $ref: '#/components/examples/OrderConfirmed'
        '403':
          description: |
            Identidad inválida o ausente: `X-User-Id` falta, no es un UUID o el
            rol informado no es válido.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/ProblemIdentityRequired'
        '404':
          description: |
            La orden no existe o pertenece a otro comprador. Ambos casos se
            responden igual para no revelar la existencia de órdenes ajenas.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemOrderNotFound'

  /api/orders/{orderId}/reconcile:
    post:
      tags:
        - Purchase orders
      operationId: reconcileOrder
      summary: Reconciliar una orden pendiente
      description: |
        Consulta el pago de la orden y continúa o compensa la saga de forma
        idempotente. Si el pago está `APPROVED` confirma el inventario y emite los
        tickets (o reintenta la emisión pendiente); si está `REJECTED` libera la
        reserva y rechaza la orden. No vuelve a cobrar.

        Es reconciliable una orden `PAYMENT_PENDING` o `PAID_PENDING_TICKETS`.
        Una orden terminal (`CONFIRMED`, `REJECTED`, `COMPENSATED`) responde
        `409` sin cambios.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Orden reconciliada. El estado resultante puede ser `CONFIRMED`,
            `REJECTED`, `COMPENSATED`, `PAYMENT_PENDING` (el pago sigue incierto)
            o `PAID_PENDING_TICKETS` (la emisión sigue fallando).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                confirmed:
                  $ref: '#/components/examples/OrderConfirmed'
                rejected:
                  $ref: '#/components/examples/OrderRejected'
        '403':
          description: |
            Identidad inválida o ausente: `X-User-Id` falta, no es un UUID o el
            rol informado no es válido.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/ProblemIdentityRequired'
        '404':
          description: |
            La orden no existe o pertenece a otro comprador. Ambos casos se
            responden igual para no revelar la existencia de órdenes ajenas.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemOrderNotFound'
        '409':
          description: |
            La orden no es reconciliable porque está `CONFIRMED`, `REJECTED` o
            `COMPENSATED`. La orden no se modifica.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemOrderConflict'

  /internal/payments:
    post:
      tags:
        - Payment processing (internal)
      operationId: createPayment
      summary: Cobrar una orden de forma idempotente
      description: |
        Registra un cobro por `orderId` de forma idempotente y decide el resultado
        con el token de simulación documentado:
        - `tok_approved` → pago `APPROVED`.
        - `tok_rejected` → pago `REJECTED`.
        - `tok_pending` → pago `PENDING`.

        La misma orden con el mismo monto, moneda, medio y token devuelve el pago
        existente con `200`; la misma orden con contenido distinto responde `409`
        sin crear un segundo cobro. Un token desconocido responde `400` y no
        registra el pago.

        Ruta interna de Payment Mock: no se publica por el Gateway.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              createPayment:
                $ref: '#/components/examples/CreatePaymentRequest'
      responses:
        '201':
          description: Pago nuevo registrado; el estado refleja el token simulado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                approved:
                  $ref: '#/components/examples/PaymentApproved'
        '200':
          description: |
            Repetición idempotente: el `orderId` ya tenía un pago con el mismo
            contenido. Se devuelve el pago existente sin registrar otro
            movimiento.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                approved:
                  $ref: '#/components/examples/PaymentApproved'
        '400':
          description: |
            Token de simulación desconocido o campos inválidos: `orderId`
            ausente, monto no positivo, moneda distinta de `ARS` o medio de pago
            fuera del enum. No se registra el pago.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badRequest:
                  $ref: '#/components/examples/ProblemPaymentBadRequest'
        '409':
          description: |
            El `orderId` ya tiene un pago con otro contenido (monto, moneda, medio
            o token). Se conserva el pago original y no se crea un cobro nuevo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemPaymentConflict'

  /internal/payments/by-order/{orderId}:
    get:
      tags:
        - Payment processing (internal)
      operationId: getPaymentByOrderId
      summary: Consultar el pago de una orden
      description: |
        Devuelve el pago registrado para el `orderId`, con su estado actual,
        monto, moneda, medio de pago y fechas. Operación de lectura e idempotente.
        Ruta interna de Payment Mock: no se publica por el Gateway.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pago encontrado para el `orderId`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                approved:
                  $ref: '#/components/examples/PaymentApproved'
        '404':
          description: No existe un pago para el `orderId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemPaymentNotFound'

  /internal/payments/{paymentId}:
    get:
      tags:
        - Payment processing (internal)
      operationId: getPaymentById
      summary: Consultar un pago por identificador
      description: |
        Devuelve el pago con su estado actual, monto, moneda, medio de pago y
        fechas. Operación de lectura e idempotente. Ruta interna de Payment Mock:
        no se publica por el Gateway.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pago encontrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                approved:
                  $ref: '#/components/examples/PaymentApproved'
        '404':
          description: No existe un pago con el `paymentId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemPaymentNotFound'

  /internal/payments/{paymentId}/refund:
    post:
      tags:
        - Payment processing (internal)
      operationId: refundPayment
      summary: Reintegrar un pago aprobado
      description: |
        Marca un pago `APPROVED` como `REFUNDED` de forma idempotente. Repetir el
        reintegro de un pago ya `REFUNDED` devuelve `200` con el mismo pago sin
        duplicar el movimiento. Un pago `REJECTED` o `PENDING` no puede
        reintegrarse y responde `409`.

        Ruta interna de Payment Mock: no se publica por el Gateway.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Pago `REFUNDED`. Es la respuesta del primer reintegro y también la de
            un reintegro repetido.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                refunded:
                  $ref: '#/components/examples/PaymentRefunded'
        '404':
          description: No existe un pago con el `paymentId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemPaymentNotFound'
        '409':
          description: |
            El pago está `REJECTED` o `PENDING`; sólo un pago `APPROVED` o ya
            `REFUNDED` puede reintegrarse. Se conserva el estado del pago.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemPaymentConflict'

components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Identificador de correlación opcional. Si se envía no vacío, el servicio
        lo conserva; si falta, genera un UUID. Siempre se devuelve en el header
        de response del mismo nombre.
      schema:
        type: string
        minLength: 1
        example: trace-inventory-1

    EventId:
      name: eventId
      in: path
      required: true
      description: Identificador del evento.
      schema:
        type: string
        format: uuid
        example: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b

    OrderId:
      name: orderId
      in: path
      required: true
      description: |
        Identificador de la orden de compra que actúa como clave de idempotencia
        de la reserva.
      schema:
        type: string
        format: uuid
        example: 5e3f0a4e-1b2c-4d3e-8f90-a1b2c3d4e5f6

    ReservationId:
      name: reservationId
      in: path
      required: true
      description: Identificador de la reserva temporal.
      schema:
        type: string
        format: uuid
        example: 7a6b5c4d-3e2f-41a0-9b8c-7d6e5f4a3b2c

    UserId:
      name: X-User-Id
      in: header
      required: true
      description: |
        Identificador del comprador. Es obligatorio en toda la API pública de
        Purchase; si falta o no es un UUID se responde `403`. Un cliente sólo
        opera sobre sus propias órdenes.
      schema:
        type: string
        format: uuid
        example: 3f1a2b3c-4d5e-4f60-8a91-b2c3d4e5f601

    UserRole:
      name: X-User-Role
      in: header
      required: false
      description: |
        Rol del usuario. Es opcional; si falta se asume `CLIENT`. `ADMIN` puede
        consultar órdenes de cualquier comprador. Cualquier otro valor se rechaza
        con `403`.
      schema:
        type: string
        enum:
          - CLIENT
          - ADMIN
        example: CLIENT

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave de idempotencia del comprador para `POST /api/orders`. Es
        obligatoria, de 1 a 120 caracteres. Junto con `X-User-Id` identifica la
        solicitud: la misma clave con el mismo contenido devuelve la orden
        existente; con otro contenido responde `409`.
      schema:
        type: string
        minLength: 1
        maxLength: 120
        example: order-key-2026-11-07-0001

    PaymentId:
      name: paymentId
      in: path
      required: true
      description: Identificador del pago en Payment Mock.
      schema:
        type: string
        format: uuid
        example: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a

    PageNumber:
      name: page
      in: query
      required: false
      description: Número de página solicitado, base cero.
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0

    PageSize:
      name: size
      in: query
      required: false
      description: Cantidad de órdenes por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
        example: 20

    OrderStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Filtro opcional por estado de la orden. Si falta se devuelven órdenes en
        cualquier estado.
      schema:
        type: string
        enum:
          - CONFIRMED
          - REJECTED
          - PAYMENT_PENDING
          - PAID_PENDING_TICKETS
          - COMPENSATED
        example: CONFIRMED

  headers:
    CorrelationId:
      description: |
        Correlation ID conservado o generado por el servicio. Es obligatorio en
        toda respuesta exitosa y de error.
      required: true
      schema:
        type: string
        minLength: 1
        example: trace-inventory-1

  schemas:
    CancellationProgress:
      type: object
      required: [eventId, status, totalTickets, completedTickets, pendingTickets]
      properties:
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [PROCESSING, COMPLETED] }
        totalTickets: { type: integer, minimum: 0 }
        completedTickets: { type: integer, minimum: 0 }
        pendingTickets: { type: integer, minimum: 0 }
      example: { eventId: 'e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b', status: COMPLETED, totalTickets: 2, completedTickets: 2, pendingTickets: 0 }
    RefundView:
      type: object
      required: [id, ticketId, orderId, eventId, amount, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        amount: { type: number, format: double, minimum: 0 }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, COMPLETED] }
        decision: { type: string, enum: [APPROVED, REJECTED], nullable: true }
        progress: { type: string, enum: [NOT_STARTED, TICKET_REVOKED, PAYMENT_REFUNDED, COMPLETED] }
        createdAt: { type: string, format: date-time }
      example:
        id: 'b766df75-bfc3-4d64-b502-ea24dca4ef34'
        ticketId: '2a2383ad-0396-4465-820f-5d75710c0206'
        orderId: 'c3d0a75d-ac17-4d33-a240-aa91c492cd89'
        eventId: 'e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b'
        amount: 12000.00
        status: COMPLETED
        decision: APPROVED
        progress: COMPLETED
        createdAt: '2026-11-10T12:00:00Z'
    AvailabilityResponse:
      type: object
      description: |
        Disponibilidad agregada de un evento. Es la superficie pública donde el
        cliente descubre `sectorId` y `seatId` para reutilizarlos al reservar.
        Nunca incluye precios, comprador, `orderId` ni `reservationId`.
      additionalProperties: false
      required:
        - eventId
        - generatedAt
        - sectors
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador del evento consultado.
        generatedAt:
          type: string
          format: date-time
          description: |
            Momento en que Inventory calculó la disponibilidad. Antes de
            responder se liberaron las reservas vencidas del evento.
        sectors:
          type: array
          description: |
            Sectores del evento ordenados de forma estable por `name` ascendente
            y luego por `sectorId`. No incluye datos sensibles.
          items:
            $ref: '#/components/schemas/SectorAvailability'

    SectorAvailability:
      type: object
      additionalProperties: false
      required:
        - sectorId
        - sourceSectorId
        - name
        - type
        - capacity
        - sold
        - reserved
        - available
      properties:
        sectorId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del sector (`inventory_sectors.id`). Es el
            valor que debe reutilizarse en `ReservationItemRequest.sectorId`.
        sourceSectorId:
          type: string
          format: uuid
          description: Identificador del sector de origen en Catalog, usado para cruzar precios.
        name:
          type: string
          maxLength: 120
          description: Nombre del sector en el snapshot del evento.
        type:
          type: string
          enum:
            - NUMBERED
            - GENERAL_ADMISSION
          description: Tipo de sector.
        capacity:
          type: integer
          minimum: 1
          description: Capacidad total del sector; siempre mayor que cero.
        sold:
          type: integer
          minimum: 0
          description: |
            Cantidad de lugares vendidos (`SOLD`). En sectores numerados se
            deriva de los estados de los asientos.
        reserved:
          type: integer
          minimum: 0
          description: |
            Cantidad de lugares retenidos por reservas vigentes (`HELD`). En
            sectores numerados se deriva de los estados de los asientos.
        available:
          type: integer
          minimum: 0
          description: |
            Lugares disponibles: `capacity - sold - reserved`. En sectores
            numerados equivale a la cantidad de asientos `AVAILABLE`.
        seats:
          type: array
          description: |
            Mapa de asientos. Presente sólo para sectores `NUMBERED`; ausente en
            `GENERAL_ADMISSION`. Ordenado por `row` y luego por `number`.
          items:
            $ref: '#/components/schemas/SeatAvailability'

    SeatAvailability:
      type: object
      additionalProperties: false
      required:
        - seatId
        - sourceSeatId
        - row
        - number
        - status
      properties:
        seatId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del asiento (`inventory_items.id`). Es el
            valor que debe reutilizarse en `ReservationItemRequest.seatId`.
        sourceSeatId:
          type: string
          format: uuid
          description: Identificador del asiento de origen en Catalog.
        row:
          type: string
          maxLength: 40
          description: Fila del asiento.
        number:
          type: integer
          minimum: 1
          description: Número del asiento dentro de la fila.
        status:
          type: string
          enum:
            - AVAILABLE
            - HELD
            - SOLD
          description: |
            `AVAILABLE` si puede reservarse; `HELD` si está retenido por una
            reserva vigente; `SOLD` si ya fue vendido.

    ReservationRequest:
      type: object
      additionalProperties: false
      required:
        - orderId
        - eventId
        - items
      properties:
        orderId:
          type: string
          format: uuid
          description: |
            Identificador de la orden de compra. Junto con el fingerprint del
            contenido forma la clave de idempotencia de la reserva.
        eventId:
          type: string
          format: uuid
          description: Evento sobre el que se reserva.
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            Retención solicitada en segundos. Opcional; si falta se usa el
            `holdTtlSeconds` vigente del evento. El valor por defecto del evento
            es 600 s y el rango permitido es 60..3600 s.
        items:
          type: array
          minItems: 1
          description: |
            Lugares a retener. La reserva es atómica: si un ítem no puede
            retenerse, se revierte la solicitud completa.
          items:
            $ref: '#/components/schemas/ReservationItemRequest'

    ReservationItemRequest:
      type: object
      description: |
        Debe informarse exactamente uno de `seatId` o `quantity`. Si viene
        `seatId`, la cantidad implícita es 1 y el sector debe ser `NUMBERED`. Si
        viene `quantity`, se reservan cupos de un sector `GENERAL_ADMISSION`.
      additionalProperties: false
      required:
        - sectorId
      properties:
        sectorId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del sector, descubierto en la
            disponibilidad pública.
        seatId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del asiento, descubierto en la
            disponibilidad pública. Excluyente con `quantity`; la cantidad
            implícita es 1.
        quantity:
          type: integer
          minimum: 1
          description: |
            Cantidad de cupos a retener en un sector de admisión general.
            Excluyente con `seatId`.

    ReservationResponse:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - orderId
        - eventId
        - status
        - createdAt
        - items
      properties:
        reservationId:
          type: string
          format: uuid
          description: Identificador de la reserva temporal.
        orderId:
          type: string
          format: uuid
          description: Orden de compra asociada a la reserva.
        eventId:
          type: string
          format: uuid
          description: Evento de la reserva.
        status:
          type: string
          enum:
            - ACTIVE
            - CONFIRMED
            - RELEASED
            - EXPIRED
          description: Estado actual de la reserva.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Vencimiento de la retención. Es `null` cuando no aplica o cuando la
            reserva ya venció o fue liberada.
        createdAt:
          type: string
          format: date-time
          description: Momento de creación de la reserva.
        items:
          type: array
          description: Ítems retenidos por la reserva.
          items:
            $ref: '#/components/schemas/ReservationItem'

    ReservationItem:
      type: object
      description: |
        Ítem de una reserva. Los ítems de asiento numerado tienen `seatId` y
        cantidad 1; los de admisión general tienen `seatId` nulo y la cantidad
        solicitada.

        Inventory agrega los datos de origen y presentación que Purchase necesita
        para valorizar la orden y emitir tickets sin acceder a `inventory_db`:
        `sourceSectorId`, `sourceSeatId`, `sectorName`, `sectorType`, `rowLabel` y
        `seatNumber`.

        Para sectores `GENERAL_ADMISSION`, `seatId`, `sourceSeatId`, `rowLabel` y
        `seatNumber` son `null` y `quantity` es mayor que cero. Para sectores
        `NUMBERED`, `quantity` es 1 y `rowLabel`/`seatNumber` describen el asiento.
        La respuesta nunca incluye precios, comprador, tokens ni identificadores
        de pago.
      additionalProperties: false
      required:
        - sectorId
        - seatId
        - quantity
        - sourceSectorId
        - sourceSeatId
        - sectorName
        - sectorType
        - rowLabel
        - seatNumber
      properties:
        sectorId:
          type: string
          format: uuid
          description: Identificador de Inventory del sector.
        seatId:
          type: string
          format: uuid
          nullable: true
          description: |
            Identificador de Inventory del asiento, o `null` para admisión
            general.
        quantity:
          type: integer
          minimum: 1
          description: Cantidad retenida. Siempre 1 para ítems con `seatId`.
        sourceSectorId:
          type: string
          format: uuid
          description: |
            Identificador de origen del sector en Catalog
            (`sourceSectorId` del snapshot). Sirve para mapear el sector de
            Inventory al snapshot de compra y para trazabilidad.
        sourceSeatId:
          type: string
          format: uuid
          nullable: true
          description: |
            Identificador de origen del asiento en Catalog, o `null` para
            admisión general.
        sectorName:
          type: string
          maxLength: 120
          description: Nombre del sector en el snapshot del evento.
        sectorType:
          $ref: '#/components/schemas/SectorType'
        rowLabel:
          type: string
          maxLength: 40
          nullable: true
          description: |
            Fila del asiento en el snapshot de Catalog, o `null` para admisión
            general.
        seatNumber:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Número del asiento dentro de la fila, o `null` para admisión general.

    HoldTtlRequest:
      type: object
      additionalProperties: false
      required:
        - ttlSeconds
      properties:
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            TTL en segundos a aplicar a las reservas posteriores que no informen
            uno explícito. El valor por defecto del evento es 600 s y el rango
            permitido es 60..3600 s.
          example: 300

    EventHoldConfiguration:
      type: object
      additionalProperties: false
      required:
        - eventId
        - holdTtlSeconds
      properties:
        eventId:
          type: string
          format: uuid
          description: Evento configurado.
        holdTtlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: TTL vigente para las reservas del evento.
          example: 300

    CatalogEventSnapshot:
      type: object
      description: |
        Snapshot publicado e inmutable de un evento. Contrato interno de Catalog
        consumido por Inventory para inicializar el layout. No incluye precios ni
        ofertas económicas.
      additionalProperties: false
      required:
        - eventId
        - snapshotId
        - name
        - description
        - eventType
        - startsAt
        - venue
        - sectors
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador del evento publicado.
        snapshotId:
          type: string
          format: uuid
          description: Identificador del snapshot publicado.
        name:
          type: string
          maxLength: 200
          description: Nombre del evento al momento de publicar.
        description:
          type: string
          description: Descripción del evento al momento de publicar.
        eventType:
          type: string
          maxLength: 80
          description: Tipo de evento.
        startsAt:
          type: string
          format: date-time
          description: Fecha y hora de inicio del evento.
        venue:
          $ref: '#/components/schemas/SnapshotVenue'
        sectors:
          type: array
          description: |
            Sectores del snapshot en orden estable. Cada sector conserva su
            identificador de origen de Catalog.
          items:
            $ref: '#/components/schemas/SnapshotSector'

    SnapshotVenue:
      type: object
      description: Datos de ubicación del lugar al momento de publicar.
      additionalProperties: false
      required:
        - name
        - address
        - city
        - latitude
        - longitude
      properties:
        name:
          type: string
          maxLength: 200
          description: Nombre del lugar.
        address:
          type: string
          maxLength: 300
          description: Dirección del lugar.
        city:
          type: string
          maxLength: 120
          description: Ciudad del lugar.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitud geográfica.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitud geográfica.

    SnapshotSector:
      type: object
      additionalProperties: false
      required:
        - sourceSectorId
        - name
        - type
        - capacity
        - seats
      properties:
        sourceSectorId:
          type: string
          format: uuid
          description: |
            Identificador del sector en Catalog. Sólo sirve para trazabilidad y
            reconciliación; no se usa como clave de los comandos de reserva.
        name:
          type: string
          maxLength: 120
          description: Nombre del sector.
        type:
          type: string
          enum:
            - NUMBERED
            - GENERAL_ADMISSION
          description: Tipo de sector.
        capacity:
          type: integer
          minimum: 1
          description: Capacidad del sector; siempre mayor que cero.
        seats:
          type: array
          description: |
            Asientos del sector para `NUMBERED`; vacío para
            `GENERAL_ADMISSION`. Ordenado por `row` y luego por `number`.
          items:
            $ref: '#/components/schemas/SnapshotSeat'

    SnapshotSeat:
      type: object
      additionalProperties: false
      required:
        - sourceSeatId
        - row
        - number
      properties:
        sourceSeatId:
          type: string
          format: uuid
          description: |
            Identificador del asiento en Catalog. Sólo sirve para trazabilidad y
            reconciliación.
        row:
          type: string
          maxLength: 40
          description: Fila del asiento.
        number:
          type: integer
          minimum: 1
          description: Número del asiento dentro de la fila.

    SectorType:
      type: string
      description: |
        Tipo de sector según la plantilla del lugar. `NUMBERED` exige elegir
        asientos; `GENERAL_ADMISSION` exige informar una cantidad de cupos.
      enum:
        - NUMBERED
        - GENERAL_ADMISSION
      example: NUMBERED

    CatalogPurchaseSnapshot:
      type: object
      description: |
        Snapshot publicado e inmutable de un evento con el precio unitario de cada
        sector. Contrato interno de Catalog consumido por Purchase Service para
        validar los ítems, fijar precios históricos y emitir tickets.

        Es independiente del snapshot de inventario `CatalogEventSnapshot`, que
        sigue sin precios y lo consume Inventory.
      additionalProperties: false
      required:
        - eventId
        - snapshotId
        - name
        - description
        - eventType
        - startsAt
        - venue
        - sectors
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador del evento publicado.
        snapshotId:
          type: string
          format: uuid
          description: Identificador del snapshot publicado.
        name:
          type: string
          maxLength: 200
          description: Nombre del evento al momento de publicar.
        description:
          type: string
          description: Descripción del evento al momento de publicar.
        eventType:
          type: string
          maxLength: 80
          description: Tipo de evento.
        startsAt:
          type: string
          format: date-time
          description: Fecha y hora de inicio del evento.
        venue:
          $ref: '#/components/schemas/SnapshotVenue'
        sectors:
          type: array
          minItems: 1
          description: |
            Sectores del snapshot en orden estable, cada uno con su precio
            unitario publicado.
          items:
            $ref: '#/components/schemas/PurchaseSnapshotSector'

    PurchaseSnapshotSector:
      type: object
      description: |
        Sector del snapshot de compra. Agrega `price` al sector del snapshot de
        inventario; conserva `sourceSectorId` como identificador de Catalog.
      additionalProperties: false
      required:
        - sourceSectorId
        - name
        - type
        - capacity
        - price
        - seats
      properties:
        sourceSectorId:
          type: string
          format: uuid
          description: |
            Identificador del sector en Catalog. Purchase lo persiste como
            referencia histórica y para mapear los ítems de la reserva.
        name:
          type: string
          maxLength: 120
          description: Nombre del sector.
        type:
          $ref: '#/components/schemas/SectorType'
        capacity:
          type: integer
          minimum: 1
          description: Capacidad del sector; siempre mayor que cero.
        price:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: |
            Precio unitario del sector en la moneda del evento (`ARS`), con dos
            decimales. Purchase lo usa como precio histórico de la orden.
          example: 15000.00
        seats:
          type: array
          description: |
            Asientos del sector para `NUMBERED`; vacío para
            `GENERAL_ADMISSION`. Ordenado por `row` y luego por `number`.
          items:
            $ref: '#/components/schemas/SnapshotSeat'

    OrderStatus:
      type: string
      description: |
        Estado de la orden. `CONFIRMED`, `REJECTED` y `COMPENSATED` son
        terminales; `PAYMENT_PENDING` y `PAID_PENDING_TICKETS` son reconciliables
        con `POST /api/orders/{orderId}/reconcile`.
      enum:
        - CONFIRMED
        - REJECTED
        - PAYMENT_PENDING
        - PAID_PENDING_TICKETS
        - COMPENSATED
      example: CONFIRMED

    PaymentStatus:
      type: string
      description: |
        Estado del pago simulado. `REFUNDED` es terminal y se alcanza por
        reintegro de un pago `APPROVED`.
      enum:
        - APPROVED
        - REJECTED
        - PENDING
        - REFUNDED
      example: APPROVED

    PaymentMethod:
      type: string
      description: Medio de pago aceptado por la pasarela simulada.
      enum:
        - CARD
        - WALLET
        - CASH
      example: CARD

    CreateOrderRequest:
      type: object
      description: |
        Solicitud de compra. El comprador se identifica con `X-User-Id` y la
        solicitud se idempotencia con `Idempotency-Key`; ningún precio se envía
        en el cuerpo.
      additionalProperties: false
      required:
        - eventId
        - items
        - payment
      properties:
        eventId:
          type: string
          format: uuid
          description: Evento publicado que se desea comprar.
        items:
          type: array
          minItems: 1
          description: |
            Ítems a comprar. Cada ítem informa exactamente uno de `seatIds` o
            `quantity` según el tipo de sector.
          items:
            $ref: '#/components/schemas/CreateOrderItem'
        payment:
          $ref: '#/components/schemas/CreateOrderPayment'

    CreateOrderItem:
      type: object
      description: |
        Ítem de la orden. `sectorId` es el identificador de **Inventory**
        descubierto en la disponibilidad pública. Debe informarse exactamente uno
        de `seatIds` (sector `NUMBERED`) o `quantity` (sector
        `GENERAL_ADMISSION`).
      additionalProperties: false
      required:
        - sectorId
      properties:
        sectorId:
          type: string
          format: uuid
          description: Identificador de Inventory del sector.
        seatIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            Asientos de Inventory a comprar en un sector `NUMBERED`. Excluyente
            con `quantity`; cada asiento cuenta como una unidad.
          items:
            type: string
            format: uuid
          example:
            - f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
            - f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f602
        quantity:
          type: integer
          minimum: 1
          description: |
            Cantidad de cupos a comprar en un sector `GENERAL_ADMISSION`.
            Excluyente con `seatIds`.
          example: 2

    CreateOrderPayment:
      type: object
      description: |
        Medio de pago y token de simulación. El resultado del cobro lo decide el
        token documentado de forma determinista.
      additionalProperties: false
      required:
        - method
        - token
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        token:
          type: string
          description: |
            Token de simulación del pago. Define el resultado del cobro:
            `tok_approved` aprueba, `tok_rejected` rechaza y `tok_pending` deja el
            pago pendiente. Un token distinto responde `400`.
          enum:
            - tok_approved
            - tok_rejected
            - tok_pending
          example: tok_approved

    OrderItemUnit:
      type: object
      description: |
        Unidad concreta de un ítem. En sectores `NUMBERED` identifica un asiento;
        en `GENERAL_ADMISSION` sólo expone el número de unidad.
      additionalProperties: false
      required:
        - unitNumber
      properties:
        unitNumber:
          type: integer
          minimum: 1
          description: Número de unidad dentro del ítem, desde 1.
          example: 1
        seatId:
          type: string
          format: uuid
          nullable: true
          description: Identificador de Inventory del asiento, o `null` en admisión general.
        sourceSeatId:
          type: string
          format: uuid
          nullable: true
          description: Identificador de origen del asiento en Catalog, o `null` en admisión general.
        row:
          type: string
          maxLength: 40
          nullable: true
          description: Fila del asiento, o `null` en admisión general.
          example: A
        number:
          type: integer
          minimum: 1
          nullable: true
          description: Número del asiento dentro de la fila, o `null` en admisión general.
          example: 1

    OrderItem:
      type: object
      description: |
        Ítem valorizado de la orden. Los precios provienen del snapshot de compra
        de Catalog al momento de crear la orden y no cambian después.
      additionalProperties: false
      required:
        - orderItemId
        - sectorId
        - sourceSectorId
        - sectorName
        - sectorType
        - quantity
        - unitPrice
        - subtotal
        - units
        - tickets
      properties:
        orderItemId:
          type: string
          format: uuid
          description: Identificador del ítem dentro de la orden.
        sectorId:
          type: string
          format: uuid
          description: Identificador de Inventory del sector.
        sourceSectorId:
          type: string
          format: uuid
          description: Identificador de origen del sector en Catalog.
        sectorName:
          type: string
          maxLength: 120
          description: Nombre del sector al momento de la compra.
        sectorType:
          $ref: '#/components/schemas/SectorType'
        quantity:
          type: integer
          minimum: 1
          description: Unidades compradas en el sector.
        unitPrice:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Precio unitario histórico del sector en `ARS`.
          example: 15000.00
        subtotal:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: |
            Importe del ítem: `unitPrice * quantity`, con dos decimales.
          example: 30000.00
        units:
          type: array
          minItems: 1
          description: |
            Una unidad por entrada comprada; `quantity` es igual a la cantidad de
            elementos de `units`.
          items:
            $ref: '#/components/schemas/OrderItemUnit'
        tickets:
          type: array
          description: |
            Tickets emitidos para el ítem. Vacío mientras la orden no esté
            `CONFIRMED` o si la emisión quedó pendiente.
          items:
            $ref: '#/components/schemas/OrderTicket'

    OrderTicket:
      type: object
      description: |
        Ticket emitido y firmado por Ticket Service. El QR se expone como payload
        firmado y como PNG en Base64.
      additionalProperties: false
      required:
        - ticketId
        - unitNumber
        - status
        - qrPayload
        - qrPngBase64
      properties:
        ticketId:
          type: string
          format: uuid
          description: Identificador del ticket emitido.
        unitNumber:
          type: integer
          minimum: 1
          description: Número de unidad del ítem a la que corresponde el ticket.
          example: 1
        status:
          type: string
          enum:
            - ISSUED
            - REVOKED
            - USED
          description: Estado del ticket.
          example: ISSUED
        qrPayload:
          type: string
          description: |
            Identificador de ticket firmado con HMAC y versionado, codificado en
            el QR. No contiene datos personales.
          example: ty1.eyJ0aWNrZXRJZCI6IjFhMmIzYzRkIn0.signature
        qrPngBase64:
          type: string
          format: byte
          description: Imagen PNG del QR codificada en Base64.
          example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
        row:
          type: string
          maxLength: 40
          nullable: true
          description: Fila del asiento, o `null` en admisión general.
          example: A
        seatNumber:
          type: integer
          minimum: 1
          nullable: true
          description: Número del asiento dentro de la fila, o `null` en admisión general.
          example: 1

    OrderPayment:
      type: object
      description: |
        Pago asociado a la orden, tal como quedó registrado en Payment Mock. No
        incluye el token de simulación.
      additionalProperties: false
      required:
        - paymentId
        - status
        - amount
        - currency
        - method
        - createdAt
        - updatedAt
      properties:
        paymentId:
          type: string
          format: uuid
          description: Identificador del pago.
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Monto cobrado, igual al total de la orden.
          example: 40000.00
        currency:
          type: string
          enum:
            - ARS
          description: Moneda del pago.
          example: ARS
        method:
          $ref: '#/components/schemas/PaymentMethod'
        createdAt:
          type: string
          format: date-time
          description: Momento de creación del pago.
        updatedAt:
          type: string
          format: date-time
          description: Momento de la última actualización del pago.

    OrderResponse:
      type: object
      description: |
        Orden de compra con su estado, snapshot histórico del evento, pago e
        ítems con unidades y tickets. Es la representación devuelta por
        `POST /api/orders`, `GET /api/orders/{orderId}` y
        `POST /api/orders/{orderId}/reconcile`.
      additionalProperties: false
      required:
        - orderId
        - status
        - customerId
        - eventId
        - eventName
        - eventStartsAt
        - venueName
        - venueCity
        - currency
        - totalAmount
        - reservationExpiresAt
        - createdAt
        - updatedAt
        - payment
        - items
      properties:
        orderId:
          type: string
          format: uuid
          description: Identificador de la orden.
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerId:
          type: string
          format: uuid
          description: Comprador tomado de `X-User-Id`.
        eventId:
          type: string
          format: uuid
          description: Evento comprado.
        eventName:
          type: string
          maxLength: 200
          description: Nombre del evento al momento de la compra.
        eventStartsAt:
          type: string
          format: date-time
          description: Fecha y hora de inicio del evento al momento de la compra.
        venueName:
          type: string
          maxLength: 200
          description: Nombre del lugar al momento de la compra.
        venueCity:
          type: string
          maxLength: 120
          description: Ciudad del lugar al momento de la compra.
        currency:
          type: string
          enum:
            - ARS
          description: Moneda de la orden.
          example: ARS
        totalAmount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: |
            Importe total de la orden: suma de los `subtotal` de sus ítems, con
            dos decimales.
          example: 40000.00
        reservationExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Vencimiento de la retención de inventario. Es `null` cuando la orden
            ya no depende de una reserva vigente.
        createdAt:
          type: string
          format: date-time
          description: Momento de creación de la orden.
        updatedAt:
          type: string
          format: date-time
          description: Momento de la última transición de la orden.
        payment:
          $ref: '#/components/schemas/OrderPayment'
        items:
          type: array
          minItems: 1
          description: Ítems de la orden con sus unidades y tickets.
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderPage:
      type: object
      description: Página de órdenes del comprador.
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          description: Órdenes de la página actual, ordenadas por `createdAt` descendente.
          items:
            $ref: '#/components/schemas/OrderResponse'
        page:
          type: integer
          minimum: 0
          description: Número de página devuelto, base cero.
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
          description: Tamaño de página solicitado.
          example: 20
        totalElements:
          type: integer
          minimum: 0
          description: Total de órdenes visibles para el comprador y el filtro.
          example: 1
        totalPages:
          type: integer
          minimum: 0
          description: Total de páginas para el tamaño solicitado.
          example: 1

    CreatePaymentRequest:
      type: object
      description: |
        Cobro simulado de una orden. Idempotente por `orderId`: el mismo `orderId`
        con el mismo contenido devuelve el pago existente.
      additionalProperties: false
      required:
        - orderId
        - amount
        - currency
        - method
        - token
      properties:
        orderId:
          type: string
          format: uuid
          description: Orden que se cobra; clave de idempotencia del pago.
        amount:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          description: Monto a cobrar, mayor que cero y con dos decimales.
          example: 40000.00
        currency:
          type: string
          enum:
            - ARS
          description: Moneda del cobro.
          example: ARS
        method:
          $ref: '#/components/schemas/PaymentMethod'
        token:
          type: string
          description: |
            Token de simulación. `tok_approved` aprueba, `tok_rejected` rechaza y
            `tok_pending` deja el pago pendiente; cualquier otro valor responde
            `400`.
          enum:
            - tok_approved
            - tok_rejected
            - tok_pending
          example: tok_approved

    PaymentResponse:
      type: object
      description: |
        Pago registrado por Payment Mock. No incluye el token de simulación ni
        datos del comprador.
      additionalProperties: false
      required:
        - paymentId
        - orderId
        - status
        - amount
        - currency
        - method
        - createdAt
        - updatedAt
      properties:
        paymentId:
          type: string
          format: uuid
          description: Identificador del pago.
        orderId:
          type: string
          format: uuid
          description: Orden cobrada.
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Monto cobrado.
          example: 40000.00
        currency:
          type: string
          enum:
            - ARS
          description: Moneda del pago.
          example: ARS
        method:
          $ref: '#/components/schemas/PaymentMethod'
        createdAt:
          type: string
          format: date-time
          description: Momento de creación del pago.
        updatedAt:
          type: string
          format: date-time
          description: Momento de la última actualización del pago.

    Problem:
      type: object
      description: |
        Error conforme a `application/problem+json`. Incluye siempre el
        `correlationId` de la solicitud. Puede incluir campos adicionales de
        contexto (por ejemplo el estado de una reserva en un conflicto), pero
        nunca datos de otros compradores ni detalles internos.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - correlationId
      properties:
        type:
          type: string
          description: URI que identifica el tipo de problema. Por defecto `about:blank`.
          example: about:blank
        title:
          type: string
          description: Resumen corto y estable del tipo de problema.
          example: Not found
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Código HTTP del error.
          example: 404
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
          example: Published event not found
        instance:
          type: string
          description: Ruta de la solicitud que originó el error.
          example: /api/inventory/events/e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b/availability
        correlationId:
          type: string
          minLength: 1
          description: Correlation ID de la solicitud, igual al devuelto en el header.
          example: trace-inventory-1
        orderId:
          type: string
          format: uuid
          description: |
            Contexto opcional. Sólo aparece en errores de compra que informan la
            orden afectada (por ejemplo un pago rechazado o un conflicto).
          example: 6f4e1b2a-3c4d-4e5f-9a0b-1c2d3e4f5a6b
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'

  examples:
    Availability:
      summary: Evento con un sector numerado y uno de admisión general
      value:
        eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
        generatedAt: '2026-11-07T18:00:00Z'
        sectors:
          - sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
            name: Platea
            type: NUMBERED
            capacity: 120
            sold: 10
            reserved: 2
            available: 108
            seats:
              - seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
                row: A
                number: 1
                status: AVAILABLE
              - seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f602
                row: A
                number: 2
                status: HELD
          - sectorId: 9c8d7e6f-5a4b-4c3d-8e2f-1a0b9c8d7e6f
            name: Campo
            type: GENERAL_ADMISSION
            capacity: 500
            sold: 100
            reserved: 10
            available: 390

    ReservationRequest:
      summary: |
        Solicitud de dos asientos numerados y dos cupos generales; el request no
        cambia y usa sólo identificadores de Inventory
      value:
        orderId: 5e3f0a4e-1b2c-4d3e-8f90-a1b2c3d4e5f6
        eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
        ttlSeconds: 300
        items:
          - sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
            seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
          - sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
            seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f602
          - sectorId: 9c8d7e6f-5a4b-4c3d-8e2f-1a0b9c8d7e6f
            quantity: 2

    ReservationActive:
      summary: Reserva activa con vencimiento y datos de origen
      value:
        reservationId: 7a6b5c4d-3e2f-41a0-9b8c-7d6e5f4a3b2c
        orderId: 5e3f0a4e-1b2c-4d3e-8f90-a1b2c3d4e5f6
        eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
        status: ACTIVE
        expiresAt: '2026-11-07T18:05:00Z'
        createdAt: '2026-11-07T18:00:00Z'
        items:
          - sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
            seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
            quantity: 1
            sourceSectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
            sourceSeatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
            sectorName: Platea
            sectorType: NUMBERED
            rowLabel: A
            seatNumber: 1
          - sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
            seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f602
            quantity: 1
            sourceSectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
            sourceSeatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f602
            sectorName: Platea
            sectorType: NUMBERED
            rowLabel: A
            seatNumber: 2
          - sectorId: 9c8d7e6f-5a4b-4c3d-8e2f-1a0b9c8d7e6f
            seatId: null
            quantity: 2
            sourceSectorId: 9c8d7e6f-5a4b-4c3d-8e2f-1a0b9c8d7e6f
            sourceSeatId: null
            sectorName: Campo
            sectorType: GENERAL_ADMISSION
            rowLabel: null
            seatNumber: null

    ReservationConfirmed:
      summary: Reserva confirmada con datos de origen
      value:
        reservationId: 7a6b5c4d-3e2f-41a0-9b8c-7d6e5f4a3b2c
        orderId: 5e3f0a4e-1b2c-4d3e-8f90-a1b2c3d4e5f6
        eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
        status: CONFIRMED
        expiresAt: null
        createdAt: '2026-11-07T18:00:00Z'
        items:
          - sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
