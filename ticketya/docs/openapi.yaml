        '204':
          description: Inventario bloqueado (idempotente).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        '404':
          description: Evento no encontrado o sin inventario.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Error inesperado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/reservations/{reservationId}/sold-units/release:
    post:
      tags: [Inventory cancellation (internal)]
      operationId: releaseSoldUnit
      security: []
      summary: Liberar una unidad vendida para una devolución
      description: |
        Marca una unidad individual como no-vendida en el inventario, tras una
        devolución aprobada. Idempotente por (reservationId, sectorId, seatId,
        unitNumber). Usado exclusivamente por Purchase durante el flujo de
        reembolso.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoldUnitReleaseRequest'
            example:
              sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
              seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
              unitNumber: 1
      responses:
        '200':
          description: Unidad liberada o reintento idempotente.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoldUnitReleaseResponse'
              example:
                reservationId: 7a6b5c4d-3e2f-41a0-9b8c-7d6e5f4a3b2c
                sectorId: 0b5e9b5e-7b0e-4c0a-9f5e-2f7b8c1d2e3f
                seatId: f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
                unitNumber: 1
                released: true
        '400':
          description: Número de unidad inválido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: La unidad no está vendida por esta reserva.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Error inesperado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── TICKET ISSUANCE (INTERNAL) ────────────────────────────────────────────

  /internal/orders/{orderId}/items/{orderItemId}/tickets:
    post:
      tags: [Ticket issuance (internal)]
      operationId: issueTicketsForOrderItem
      security: []
      summary: Emitir o recuperar tickets QR para un ítem confirmado
      description: |
        Purchase llama este comando solo tras confirmar pago e inventario.
        La idempotencia usa orderId + orderItemId. Repetir la solicitud con el
        mismo contenido devuelve los mismos tickets y QR.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: orderItemId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketIssueRequest'
            example:
              customerId: 3f1a2b3c-4d5e-4f60-8a91-b2c3d4e5f601
              eventId: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
              eventName: Concierto de prueba
              eventStartsAt: '2026-12-01T21:00:00Z'
              venueName: Estadio
              venueCity: Buenos Aires
              sectorName: Platea
              tickets:
                - unitNumber: 1
                  rowLabel: A
                  seatNumber: 1
      responses:
        '201':
          description: Tickets emitidos.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketIssueResponse'
        '200':
          description: Reintento idempotente; mismos tickets y QR.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketIssueResponse'
        '400':
          description: Snapshot o unidades inválidas.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Idempotencia con contenido distinto.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── TICKET REVOCATION (INTERNAL) ──────────────────────────────────────────

  /internal/tickets/{ticketId}/revoke:
    post:
      tags: [Ticket revocation (internal)]
      operationId: revokeTicket
      security: []
      summary: Revocar un ticket emitido tras una devolución aprobada
      description: |
        Comando interno idempotente. Repetir para un ticket ya revocado
        devuelve el mismo resultado. Un ticket `USED` no puede revocarse (409).
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Ticket revocado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketRevocationResponse'
              example:
                ticketId: 2a2383ad-0396-4465-820f-5d75710c0206
                status: REVOKED
        '404':
          description: Ticket no encontrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Ticket ya usado; no puede revocarse.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── PAYMENT PARTIAL REFUND (INTERNAL) ─────────────────────────────────────

  /internal/payments/{paymentId}/refunds:
    post:
      tags: [Payment processing (internal)]
      operationId: refundPaymentPartial
      security: []
      summary: Reintegrar un monto parcial de un pago
      description: |
        Registra un reintegro parcial por un monto específico con clave de
        idempotencia. Usado por Purchase durante devoluciones individuales de
        tickets: cada ticket genera un reintegro parcial con su propio
        `idempotencyKey` (el `refundId`).

        Un pago puede tener múltiples reintegros parciales mientras la suma no
        supere el monto original. Si la `idempotencyKey` ya fue usada con el
        mismo monto, devuelve el reintegro existente (200).
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialRefundRequest'
            example:
              idempotencyKey: b766df75-bfc3-4d64-b502-ea24dca4ef34
              amount: 12000.00
      responses:
        '201':
          description: Reintegro parcial registrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialRefundResponse'
              example:
                refundId: r1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
                paymentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                amount: 12000.00
                status: REFUNDED
                createdAt: '2026-11-10T12:01:00Z'
        '200':
          description: Reintento idempotente; mismo reintegro.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialRefundResponse'
        '400':
          description: Monto inválido o idempotencyKey faltante.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Pago no encontrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Pago no APPROVED, monto excede disponible, o idempotencyKey con otro monto.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado por el proveedor de identidad externo. Claims:
        `sub` (UUID) y `roles` (lista con exactamente un valor:
        CLIENT, ORGANIZER, ADMIN o ACCESS_STAFF). El Gateway valida
        firma, expiración y claims; los servicios internos conservan
        autorización de dominio (rol y ownership) sobre la identidad
        derivada.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Identificador de correlación opcional. Si se envía no vacío, el servicio
        lo conserva; si falta, genera un UUID. Siempre se devuelve en el header
        de response del mismo nombre.
      schema:
        type: string
        minLength: 1
        example: trace-inventory-1

    EventId:
      name: eventId
      in: path
      required: true
      description: Identificador del evento.
      schema:
        type: string
        format: uuid
        example: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b

    OrderId:
      name: orderId
      in: path
      required: true
      description: |
        Identificador de la orden de compra que actúa como clave de idempotencia
        de la reserva.
      schema:
        type: string
        format: uuid
        example: 5e3f0a4e-1b2c-4d3e-8f90-a1b2c3d4e5f6

    ReservationId:
      name: reservationId
      in: path
      required: true
      description: Identificador de la reserva temporal.
      schema:
        type: string
        format: uuid
        example: 7a6b5c4d-3e2f-41a0-9b8c-7d6e5f4a3b2c



    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave de idempotencia del comprador para `POST /api/orders`. Es
        obligatoria, de 1 a 120 caracteres. Junto con el `sub` del JWT identifica la
        solicitud: la misma clave con el mismo contenido devuelve la orden
        existente; con otro contenido responde `409`.
      schema:
        type: string
        minLength: 1
        maxLength: 120
        example: order-key-2026-11-07-0001

    PaymentId:
      name: paymentId
      in: path
      required: true
      description: Identificador del pago en Payment Mock.
      schema:
        type: string
        format: uuid
        example: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a

    PageNumber:
      name: page
      in: query
      required: false
      description: Número de página solicitado, base cero.
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0

    PageSize:
      name: size
      in: query
      required: false
      description: Cantidad de órdenes por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
        example: 20

    OrderStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Filtro opcional por estado de la orden. Si falta se devuelven órdenes en
        cualquier estado.
      schema:
        type: string
        enum:
          - CONFIRMED
          - REJECTED
          - PAYMENT_PENDING
          - PAID_PENDING_TICKETS
          - COMPENSATED
        example: CONFIRMED

  headers:
    CorrelationId:
      description: |
        Correlation ID conservado o generado por el servicio. Es obligatorio en
        toda respuesta exitosa y de error.
      required: true
      schema:
        type: string
        minLength: 1
        example: trace-inventory-1

  schemas:
    CancellationProgress:
      type: object
      required: [eventId, status, totalTickets, completedTickets, pendingTickets]
      properties:
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [PROCESSING, COMPLETED] }
        totalTickets: { type: integer, minimum: 0 }
        completedTickets: { type: integer, minimum: 0 }
        pendingTickets: { type: integer, minimum: 0 }
      example: { eventId: 'e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b', status: COMPLETED, totalTickets: 2, completedTickets: 2, pendingTickets: 0 }
    RefundView:
      type: object
      required: [id, ticketId, orderId, eventId, amount, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        amount: { type: number, format: double, minimum: 0 }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, COMPLETED] }
        decision: { type: string, enum: [APPROVED, REJECTED], nullable: true }
        progress: { type: string, enum: [NOT_STARTED, TICKET_REVOKED, PAYMENT_REFUNDED, COMPLETED] }
        createdAt: { type: string, format: date-time }
      example:
        id: 'b766df75-bfc3-4d64-b502-ea24dca4ef34'
        ticketId: '2a2383ad-0396-4465-820f-5d75710c0206'
        orderId: 'c3d0a75d-ac17-4d33-a240-aa91c492cd89'
        eventId: 'e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b'
        amount: 12000.00
        status: COMPLETED
        decision: APPROVED
        progress: COMPLETED
        createdAt: '2026-11-10T12:00:00Z'
    AvailabilityResponse:
      type: object
      description: |
        Disponibilidad agregada de un evento. Es la superficie pública donde el
        cliente descubre `sectorId` y `seatId` para reutilizarlos al reservar.
        Nunca incluye precios, comprador, `orderId` ni `reservationId`.
      additionalProperties: false
      required:
        - eventId
        - generatedAt
        - sectors
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador del evento consultado.
        generatedAt:
          type: string
          format: date-time
          description: |
            Momento en que Inventory calculó la disponibilidad. Antes de
            responder se liberaron las reservas vencidas del evento.
        sectors:
          type: array
          description: |
            Sectores del evento ordenados de forma estable por `name` ascendente
            y luego por `sectorId`. No incluye datos sensibles.
          items:
            $ref: '#/components/schemas/SectorAvailability'

    SectorAvailability:
      type: object
      additionalProperties: false
      required:
        - sectorId
        - sourceSectorId
        - name
        - type
        - capacity
        - sold
        - reserved
        - available
      properties:
        sectorId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del sector (`inventory_sectors.id`). Es el
            valor que debe reutilizarse en `ReservationItemRequest.sectorId`.
        sourceSectorId:
          type: string
          format: uuid
          description: Identificador del sector de origen en Catalog, usado para cruzar precios.
        name:
          type: string
          maxLength: 120
          description: Nombre del sector en el snapshot del evento.
        type:
          type: string
          enum:
            - NUMBERED
            - GENERAL_ADMISSION
          description: Tipo de sector.
        capacity:
          type: integer
          minimum: 1
          description: Capacidad total del sector; siempre mayor que cero.
        sold:
          type: integer
          minimum: 0
          description: |
            Cantidad de lugares vendidos (`SOLD`). En sectores numerados se
            deriva de los estados de los asientos.
        reserved:
          type: integer
          minimum: 0
          description: |
            Cantidad de lugares retenidos por reservas vigentes (`HELD`). En
            sectores numerados se deriva de los estados de los asientos.
        available:
          type: integer
          minimum: 0
          description: |
            Lugares disponibles: `capacity - sold - reserved`. En sectores
            numerados equivale a la cantidad de asientos `AVAILABLE`.
        seats:
          type: array
          description: |
            Mapa de asientos. Presente sólo para sectores `NUMBERED`; ausente en
            `GENERAL_ADMISSION`. Ordenado por `row` y luego por `number`.
          items:
            $ref: '#/components/schemas/SeatAvailability'

    SeatAvailability:
      type: object
      additionalProperties: false
      required:
        - seatId
        - sourceSeatId
        - row
        - number
        - status
      properties:
        seatId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del asiento (`inventory_items.id`). Es el
            valor que debe reutilizarse en `ReservationItemRequest.seatId`.
        sourceSeatId:
          type: string
          format: uuid
          description: Identificador del asiento de origen en Catalog.
        row:
          type: string
          maxLength: 40
          description: Fila del asiento.
        number:
          type: integer
          minimum: 1
          description: Número del asiento dentro de la fila.
        status:
          type: string
          enum:
            - AVAILABLE
            - HELD
            - SOLD
          description: |
            `AVAILABLE` si puede reservarse; `HELD` si está retenido por una
            reserva vigente; `SOLD` si ya fue vendido.

    ReservationRequest:
      type: object
      additionalProperties: false
      required:
        - orderId
        - eventId
        - items
      properties:
        orderId:
          type: string
          format: uuid
          description: |
            Identificador de la orden de compra. Junto con el fingerprint del
            contenido forma la clave de idempotencia de la reserva.
        eventId:
          type: string
          format: uuid
          description: Evento sobre el que se reserva.
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            Retención solicitada en segundos. Opcional; si falta se usa el
            `holdTtlSeconds` vigente del evento. El valor por defecto del evento
            es 600 s y el rango permitido es 60..3600 s.
        items:
          type: array
          minItems: 1
          description: |
            Lugares a retener. La reserva es atómica: si un ítem no puede
            retenerse, se revierte la solicitud completa.
          items:
            $ref: '#/components/schemas/ReservationItemRequest'

    ReservationItemRequest:
      type: object
      description: |
        Debe informarse exactamente uno de `seatId` o `quantity`. Si viene
        `seatId`, la cantidad implícita es 1 y el sector debe ser `NUMBERED`. Si
        viene `quantity`, se reservan cupos de un sector `GENERAL_ADMISSION`.
      additionalProperties: false
      required:
        - sectorId
      properties:
        sectorId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del sector, descubierto en la
            disponibilidad pública.
        seatId:
          type: string
          format: uuid
          description: |
            Identificador de Inventory del asiento, descubierto en la
            disponibilidad pública. Excluyente con `quantity`; la cantidad
            implícita es 1.
        quantity:
          type: integer
          minimum: 1
          description: |
            Cantidad de cupos a retener en un sector de admisión general.
            Excluyente con `seatId`.

    ReservationResponse:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - orderId
        - eventId
        - status
        - createdAt
        - items
      properties:
        reservationId:
          type: string
          format: uuid
          description: Identificador de la reserva temporal.
        orderId:
          type: string
          format: uuid
          description: Orden de compra asociada a la reserva.
        eventId:
          type: string
          format: uuid
          description: Evento de la reserva.
        status:
          type: string
          enum:
            - ACTIVE
            - CONFIRMED
            - RELEASED
            - EXPIRED
          description: Estado actual de la reserva.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Vencimiento de la retención. Es `null` cuando no aplica o cuando la
            reserva ya venció o fue liberada.
        createdAt:
          type: string
          format: date-time
          description: Momento de creación de la reserva.
        items:
          type: array
          description: Ítems retenidos por la reserva.
          items:
            $ref: '#/components/schemas/ReservationItem'

    ReservationItem:
      type: object
      description: |
        Ítem de una reserva. Los ítems de asiento numerado tienen `seatId` y
        cantidad 1; los de admisión general tienen `seatId` nulo y la cantidad
        solicitada.

        Inventory agrega los datos de origen y presentación que Purchase necesita
        para valorizar la orden y emitir tickets sin acceder a `inventory_db`:
        `sourceSectorId`, `sourceSeatId`, `sectorName`, `sectorType`, `rowLabel` y
        `seatNumber`.

        Para sectores `GENERAL_ADMISSION`, `seatId`, `sourceSeatId`, `rowLabel` y
        `seatNumber` son `null` y `quantity` es mayor que cero. Para sectores
        `NUMBERED`, `quantity` es 1 y `rowLabel`/`seatNumber` describen el asiento.
        La respuesta nunca incluye precios, comprador, tokens ni identificadores
        de pago.
      additionalProperties: false
      required:
        - sectorId
        - seatId
        - quantity
        - sourceSectorId
        - sourceSeatId
        - sectorName
        - sectorType
        - rowLabel
        - seatNumber
      properties:
        sectorId:
          type: string
          format: uuid
          description: Identificador de Inventory del sector.
        seatId:
          type: string
          format: uuid
          nullable: true
          description: |
            Identificador de Inventory del asiento, o `null` para admisión
            general.
        quantity:
          type: integer
          minimum: 1
          description: Cantidad retenida. Siempre 1 para ítems con `seatId`.
        sourceSectorId:
          type: string
          format: uuid
          description: |
            Identificador de origen del sector en Catalog
            (`sourceSectorId` del snapshot). Sirve para mapear el sector de
            Inventory al snapshot de compra y para trazabilidad.
        sourceSeatId:
          type: string
          format: uuid
          nullable: true
          description: |
            Identificador de origen del asiento en Catalog, o `null` para
            admisión general.
        sectorName:
          type: string
          maxLength: 120
          description: Nombre del sector en el snapshot del evento.
        sectorType:
          $ref: '#/components/schemas/SectorType'
        rowLabel:
          type: string
          maxLength: 40
          nullable: true
          description: |
            Fila del asiento en el snapshot de Catalog, o `null` para admisión
            general.
        seatNumber:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Número del asiento dentro de la fila, o `null` para admisión general.

    HoldTtlRequest:
      type: object
      additionalProperties: false
      required:
        - ttlSeconds
      properties:
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            TTL en segundos a aplicar a las reservas posteriores que no informen
            uno explícito. El valor por defecto del evento es 600 s y el rango
            permitido es 60..3600 s.
          example: 300

    EventHoldConfiguration:
      type: object
      additionalProperties: false
      required:
        - eventId
        - holdTtlSeconds
      properties:
        eventId:
          type: string
          format: uuid
          description: Evento configurado.
        holdTtlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: TTL vigente para las reservas del evento.
          example: 300

    CatalogEventSnapshot:
      type: object
      description: |
        Snapshot publicado e inmutable de un evento. Contrato interno de Catalog
        consumido por Inventory para inicializar el layout. No incluye precios ni
        ofertas económicas.
      additionalProperties: false
      required:
        - eventId
        - snapshotId
        - name
        - description
        - eventType
        - startsAt
        - venue
        - sectors
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador del evento publicado.
        snapshotId:
          type: string
          format: uuid
          description: Identificador del snapshot publicado.
        name:
          type: string
          maxLength: 200
          description: Nombre del evento al momento de publicar.
        description:
          type: string
          description: Descripción del evento al momento de publicar.
        eventType:
          type: string
          maxLength: 80
          description: Tipo de evento.
        startsAt:
          type: string
          format: date-time
          description: Fecha y hora de inicio del evento.
        venue:
          $ref: '#/components/schemas/SnapshotVenue'
        sectors:
          type: array
          description: |
            Sectores del snapshot en orden estable. Cada sector conserva su
            identificador de origen de Catalog.
          items:
            $ref: '#/components/schemas/SnapshotSector'

    SnapshotVenue:
      type: object
      description: Datos de ubicación del lugar al momento de publicar.
      additionalProperties: false
      required:
        - name
        - address
        - city
        - latitude
        - longitude
      properties:
        name:
          type: string
          maxLength: 200
          description: Nombre del lugar.
        address:
          type: string
          maxLength: 300
          description: Dirección del lugar.
        city:
          type: string
          maxLength: 120
          description: Ciudad del lugar.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitud geográfica.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitud geográfica.

    SnapshotSector:
      type: object
      additionalProperties: false
      required:
        - sourceSectorId
        - name
        - type
        - capacity
        - seats
      properties:
        sourceSectorId:
          type: string
          format: uuid
          description: |
            Identificador del sector en Catalog. Sólo sirve para trazabilidad y
            reconciliación; no se usa como clave de los comandos de reserva.
        name:
          type: string
          maxLength: 120
          description: Nombre del sector.
        type:
          type: string
          enum:
            - NUMBERED
            - GENERAL_ADMISSION
          description: Tipo de sector.
        capacity:
          type: integer
          minimum: 1
          description: Capacidad del sector; siempre mayor que cero.
        seats:
          type: array
          description: |
            Asientos del sector para `NUMBERED`; vacío para
            `GENERAL_ADMISSION`. Ordenado por `row` y luego por `number`.
          items:
            $ref: '#/components/schemas/SnapshotSeat'

    SnapshotSeat:
      type: object
      additionalProperties: false
      required:
        - sourceSeatId
        - row
        - number
      properties:
        sourceSeatId:
          type: string
          format: uuid
          description: |
            Identificador del asiento en Catalog. Sólo sirve para trazabilidad y
            reconciliación.
        row:
          type: string
          maxLength: 40
          description: Fila del asiento.
        number:
          type: integer
          minimum: 1
          description: Número del asiento dentro de la fila.

    SectorType:
      type: string
      description: |
        Tipo de sector según la plantilla del lugar. `NUMBERED` exige elegir
        asientos; `GENERAL_ADMISSION` exige informar una cantidad de cupos.
      enum:
        - NUMBERED
        - GENERAL_ADMISSION
      example: NUMBERED

    CatalogPurchaseSnapshot:
      type: object
      description: |
        Snapshot publicado e inmutable de un evento con el precio unitario de cada
        sector. Contrato interno de Catalog consumido por Purchase Service para
        validar los ítems, fijar precios históricos y emitir tickets.

        Es independiente del snapshot de inventario `CatalogEventSnapshot`, que
        sigue sin precios y lo consume Inventory.
      additionalProperties: false
      required:
        - eventId
        - snapshotId
        - name
        - description
        - eventType
        - startsAt
        - venue
        - sectors
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador del evento publicado.
        snapshotId:
          type: string
          format: uuid
          description: Identificador del snapshot publicado.
        name:
          type: string
          maxLength: 200
          description: Nombre del evento al momento de publicar.
        description:
          type: string
          description: Descripción del evento al momento de publicar.
        eventType:
          type: string
          maxLength: 80
          description: Tipo de evento.
        startsAt:
          type: string
          format: date-time
          description: Fecha y hora de inicio del evento.
        venue:
          $ref: '#/components/schemas/SnapshotVenue'
        sectors:
          type: array
          minItems: 1
          description: |
            Sectores del snapshot en orden estable, cada uno con su precio
            unitario publicado.
          items:
            $ref: '#/components/schemas/PurchaseSnapshotSector'

    PurchaseSnapshotSector:
      type: object
      description: |
        Sector del snapshot de compra. Agrega `price` al sector del snapshot de
        inventario; conserva `sourceSectorId` como identificador de Catalog.
      additionalProperties: false
      required:
        - sourceSectorId
        - name
        - type
        - capacity
        - price
        - seats
      properties:
        sourceSectorId:
          type: string
          format: uuid
          description: |
            Identificador del sector en Catalog. Purchase lo persiste como
            referencia histórica y para mapear los ítems de la reserva.
        name:
          type: string
          maxLength: 120
          description: Nombre del sector.
        type:
          $ref: '#/components/schemas/SectorType'
        capacity:
          type: integer
          minimum: 1
          description: Capacidad del sector; siempre mayor que cero.
        price:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: |
            Precio unitario del sector en la moneda del evento (`ARS`), con dos
            decimales. Purchase lo usa como precio histórico de la orden.
          example: 15000.00
        seats:
          type: array
          description: |
            Asientos del sector para `NUMBERED`; vacío para
            `GENERAL_ADMISSION`. Ordenado por `row` y luego por `number`.
          items:
            $ref: '#/components/schemas/SnapshotSeat'

    OrderStatus:
      type: string
      description: |
        Estado de la orden. `CONFIRMED`, `REJECTED` y `COMPENSATED` son
        terminales; `PAYMENT_PENDING` y `PAID_PENDING_TICKETS` son reconciliables
        con `POST /api/orders/{orderId}/reconcile`.
      enum:
        - CONFIRMED
        - REJECTED
        - PAYMENT_PENDING
        - PAID_PENDING_TICKETS
        - COMPENSATED
      example: CONFIRMED

    PaymentStatus:
      type: string
      description: |
        Estado del pago simulado. `REFUNDED` es terminal y se alcanza por
        reintegro de un pago `APPROVED`.
      enum:
        - APPROVED
        - REJECTED
        - PENDING
        - REFUNDED
      example: APPROVED

    PaymentMethod:
      type: string
      description: Medio de pago aceptado por la pasarela simulada.
      enum:
        - CARD
        - WALLET
        - CASH
      example: CARD

    CreateOrderRequest:
      type: object
      description: |
        Solicitud de compra. El comprador se identifica con el `sub` del JWT y
        la solicitud se idempotencia con `Idempotency-Key`; ningún precio se
        envía en el cuerpo.
      additionalProperties: false
      required:
        - eventId
        - items
        - payment
      properties:
        eventId:
          type: string
          format: uuid
          description: Evento publicado que se desea comprar.
        items:
          type: array
          minItems: 1
          description: |
            Ítems a comprar. Cada ítem informa exactamente uno de `seatIds` o
            `quantity` según el tipo de sector.
          items:
            $ref: '#/components/schemas/CreateOrderItem'
        payment:
          $ref: '#/components/schemas/CreateOrderPayment'

    CreateOrderItem:
      type: object
      description: |
        Ítem de la orden. `sectorId` es el identificador de **Inventory**
        descubierto en la disponibilidad pública. Debe informarse exactamente uno
        de `seatIds` (sector `NUMBERED`) o `quantity` (sector
        `GENERAL_ADMISSION`).
      additionalProperties: false
      required:
        - sectorId
      properties:
        sectorId:
          type: string
          format: uuid
          description: Identificador de Inventory del sector.
        seatIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            Asientos de Inventory a comprar en un sector `NUMBERED`. Excluyente
            con `quantity`; cada asiento cuenta como una unidad.
          items:
            type: string
            format: uuid
          example:
            - f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f601
            - f1d2c3b4-a5e6-4f70-8a91-b2c3d4e5f602
        quantity:
          type: integer
          minimum: 1
          description: |
            Cantidad de cupos a comprar en un sector `GENERAL_ADMISSION`.
            Excluyente con `seatIds`.
          example: 2

    CreateOrderPayment:
      type: object
      description: |
        Medio de pago y token de simulación. El resultado del cobro lo decide el
        token documentado de forma determinista.
      additionalProperties: false
      required:
        - method
        - token
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        token:
          type: string
          description: |
            Token de simulación del pago. Define el resultado del cobro:
            `tok_approved` aprueba, `tok_rejected` rechaza y `tok_pending` deja el
            pago pendiente. Un token distinto responde `400`.
          enum:
            - tok_approved
            - tok_rejected
            - tok_pending
          example: tok_approved

    OrderItemUnit:
      type: object
      description: |
        Unidad concreta de un ítem. En sectores `NUMBERED` identifica un asiento;
        en `GENERAL_ADMISSION` sólo expone el número de unidad.
      additionalProperties: false
      required:
        - unitNumber
      properties:
        unitNumber:
          type: integer
          minimum: 1
          description: Número de unidad dentro del ítem, desde 1.
          example: 1
        seatId:
          type: string
          format: uuid
          nullable: true
          description: Identificador de Inventory del asiento, o `null` en admisión general.
        sourceSeatId:
          type: string
          format: uuid
          nullable: true
          description: Identificador de origen del asiento en Catalog, o `null` en admisión general.
        row:
          type: string
          maxLength: 40
          nullable: true
          description: Fila del asiento, o `null` en admisión general.
          example: A
        number:
          type: integer
          minimum: 1
          nullable: true
          description: Número del asiento dentro de la fila, o `null` en admisión general.
          example: 1

    OrderItem:
      type: object
      description: |
        Ítem valorizado de la orden. Los precios provienen del snapshot de compra
        de Catalog al momento de crear la orden y no cambian después.
      additionalProperties: false
      required:
        - orderItemId
        - sectorId
        - sourceSectorId
        - sectorName
        - sectorType
        - quantity
        - unitPrice
        - subtotal
        - units
        - tickets
      properties:
        orderItemId:
          type: string
          format: uuid
          description: Identificador del ítem dentro de la orden.
        sectorId:
          type: string
          format: uuid
          description: Identificador de Inventory del sector.
        sourceSectorId:
          type: string
          format: uuid
          description: Identificador de origen del sector en Catalog.
        sectorName:
          type: string
          maxLength: 120
          description: Nombre del sector al momento de la compra.
        sectorType:
          $ref: '#/components/schemas/SectorType'
        quantity:
          type: integer
          minimum: 1
          description: Unidades compradas en el sector.
        unitPrice:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Precio unitario histórico del sector en `ARS`.
          example: 15000.00
        subtotal:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: |
            Importe del ítem: `unitPrice * quantity`, con dos decimales.
          example: 30000.00
        units:
          type: array
          minItems: 1
          description: |
            Una unidad por entrada comprada; `quantity` es igual a la cantidad de
            elementos de `units`.
          items:
            $ref: '#/components/schemas/OrderItemUnit'
        tickets:
          type: array
          description: |
            Tickets emitidos para el ítem. Vacío mientras la orden no esté
            `CONFIRMED` o si la emisión quedó pendiente.
          items:
            $ref: '#/components/schemas/OrderTicket'

    OrderTicket:
      type: object
      description: |
        Ticket emitido y firmado por Ticket Service. El QR se expone como payload
        firmado y como PNG en Base64.
      additionalProperties: false
      required:
        - ticketId
        - unitNumber
        - status
        - qrPayload
        - qrPngBase64
      properties:
        ticketId:
          type: string
          format: uuid
          description: Identificador del ticket emitido.
        unitNumber:
          type: integer
          minimum: 1
          description: Número de unidad del ítem a la que corresponde el ticket.
          example: 1
        status:
          type: string
          enum:
            - ISSUED
            - REVOKED
            - USED
          description: Estado del ticket.
          example: ISSUED
        qrPayload:
          type: string
          description: |
            Identificador de ticket firmado con HMAC y versionado, codificado en
            el QR. No contiene datos personales.
          example: ty1.eyJ0aWNrZXRJZCI6IjFhMmIzYzRkIn0.signature
        qrPngBase64:
          type: string
          format: byte
          description: Imagen PNG del QR codificada en Base64.
          example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
        row:
          type: string
          maxLength: 40
          nullable: true
          description: Fila del asiento, o `null` en admisión general.
          example: A
        seatNumber:
          type: integer
          minimum: 1
          nullable: true
          description: Número del asiento dentro de la fila, o `null` en admisión general.
          example: 1

    OrderPayment:
      type: object
      description: |
        Pago asociado a la orden, tal como quedó registrado en Payment Mock. No
        incluye el token de simulación.
      additionalProperties: false
      required:
        - paymentId
        - status
        - amount
        - currency
        - method
        - createdAt
        - updatedAt
      properties:
        paymentId:
          type: string
          format: uuid
          nullable: true
          description: |
            Identificador del pago cuando la respuesta de Payment se recibió.
            Puede ser `null` si se perdió la respuesta y la compra sigue
            `PAYMENT_PENDING` hasta su reconciliación.
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Monto cobrado, igual al total de la orden.
          example: 40000.00
        currency:
          type: string
          enum:
            - ARS
          description: Moneda del pago.
          example: ARS
        method:
          $ref: '#/components/schemas/PaymentMethod'
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Momento de creación del pago.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Momento de la última actualización del pago.

    OrderResponse:
      type: object
      description: |
        Orden de compra con su estado, snapshot histórico del evento, pago e
        ítems con unidades y tickets. Es la representación devuelta por
        `POST /api/orders`, `GET /api/orders/{orderId}` y
        `POST /api/orders/{orderId}/reconcile`.
      additionalProperties: false
      required:
        - orderId
        - status
        - customerId
        - eventId
        - eventName
        - eventStartsAt
        - venueName
        - venueCity
        - currency
        - totalAmount
        - reservationExpiresAt
        - createdAt
        - updatedAt
        - payment
        - items
      properties:
        orderId:
          type: string
          format: uuid
          description: Identificador de la orden.
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerId:
          type: string
          format: uuid
          description: Comprador tomado del `sub` del JWT.
        eventId:
          type: string
          format: uuid
          description: Evento comprado.
        eventName:
          type: string
          maxLength: 200
          description: Nombre del evento al momento de la compra.
        eventStartsAt:
          type: string
          format: date-time
          description: Fecha y hora de inicio del evento al momento de la compra.
        venueName:
          type: string
          maxLength: 200
          description: Nombre del lugar al momento de la compra.
        venueCity:
          type: string
          maxLength: 120
          description: Ciudad del lugar al momento de la compra.
        currency:
          type: string
          enum:
            - ARS
          description: Moneda de la orden.
          example: ARS
        totalAmount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: |
            Importe total de la orden: suma de los `subtotal` de sus ítems, con
            dos decimales.
          example: 40000.00
        reservationExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Vencimiento de la retención de inventario. Es `null` cuando la orden
            ya no depende de una reserva vigente.
        createdAt:
          type: string
          format: date-time
          description: Momento de creación de la orden.
        updatedAt:
          type: string
          format: date-time
          description: Momento de la última transición de la orden.
        payment:
          $ref: '#/components/schemas/OrderPayment'
        items:
          type: array
          minItems: 1
          description: Ítems de la orden con sus unidades y tickets.
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderPage:
      type: object
      description: Página de órdenes del comprador.
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          description: Órdenes de la página actual, ordenadas por `createdAt` descendente.
          items:
            $ref: '#/components/schemas/OrderResponse'
        page:
          type: integer
          minimum: 0
          description: Número de página devuelto, base cero.
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
          description: Tamaño de página solicitado.
          example: 20
        totalElements:
          type: integer
          minimum: 0
          description: Total de órdenes visibles para el comprador y el filtro.
          example: 1
        totalPages:
          type: integer
          minimum: 0
          description: Total de páginas para el tamaño solicitado.
          example: 1

    CreatePaymentRequest:
      type: object
      description: |
        Cobro simulado de una orden. Idempotente por `orderId`: el mismo `orderId`
        con el mismo contenido devuelve el pago existente.
      additionalProperties: false
      required:
        - orderId
        - amount
        - currency
        - method
        - token
      properties:
        orderId:
          type: string
          format: uuid
          description: Orden que se cobra; clave de idempotencia del pago.
        amount:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          description: Monto a cobrar, mayor que cero y con dos decimales.
          example: 40000.00
        currency:
          type: string
          enum:
            - ARS
          description: Moneda del cobro.
          example: ARS
        method:
          $ref: '#/components/schemas/PaymentMethod'
        token:
          type: string
          description: |
            Token de simulación. `tok_approved` aprueba, `tok_rejected` rechaza y
            `tok_pending` deja el pago pendiente; cualquier otro valor responde
            `400`.
          enum:
            - tok_approved
            - tok_rejected
            - tok_pending
          example: tok_approved

    PaymentResponse:
      type: object
      description: |
        Pago registrado por Payment Mock. No incluye el token de simulación ni
        datos del comprador.
      additionalProperties: false
      required:
        - paymentId
        - orderId
        - status
        - amount
        - currency
        - method
        - createdAt
        - updatedAt
      properties:
        paymentId:
          type: string
          format: uuid
          description: Identificador del pago.
        orderId:
          type: string
          format: uuid
          description: Orden cobrada.
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: number
          format: double
          minimum: 0.01
          multipleOf: 0.01
          description: Monto cobrado.
          example: 40000.00
        currency:
          type: string
          enum:
            - ARS
          description: Moneda del pago.
          example: ARS
        method:
          $ref: '#/components/schemas/PaymentMethod'
        createdAt:
          type: string
          format: date-time
          description: Momento de creación del pago.
        updatedAt:
          type: string
          format: date-time
          description: Momento de la última actualización del pago.

    # ─── CATALOG SCHEMAS ──────────────────────────────────────────────────

    VenueRequest:
      type: object
      additionalProperties: false
      required: [name, address, city, latitude, longitude, sectors]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 300 }
        city: { type: string, maxLength: 120 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/SectorRequest'

    SectorRequest:
      type: object
      additionalProperties: false
      required: [name, type, capacity]
      properties:
        name: { type: string, maxLength: 120 }
        type: { $ref: '#/components/schemas/SectorType' }
        capacity: { type: integer, minimum: 1 }
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatRequest'

    SeatRequest:
      type: object
      additionalProperties: false
      required: [rowLabel, seatNumber]
      properties:
        rowLabel: { type: string, maxLength: 40 }
        seatNumber: { type: integer, minimum: 1 }

    VenueResponse:
      type: object
      required: [id, name, address, city, latitude, longitude, sectors]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/SectorResponse'

    SectorResponse:
      type: object
      required: [id, name, type, capacity, seats]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/SectorType' }
        capacity: { type: integer }
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatResponse'

    SeatResponse:
      type: object
      required: [rowLabel, seatNumber]
      properties:
        rowLabel: { type: string }
        seatNumber: { type: integer }

    VenuePageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/VenueResponse'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

