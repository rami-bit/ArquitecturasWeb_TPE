        Ruta interna de Payment Mock: no se publica por el Gateway.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Pago `REFUNDED`. Es la respuesta del primer reintegro y también la de
            un reintegro repetido.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                refunded:
                  $ref: '#/components/examples/PaymentRefunded'
        '404':
          description: No existe un pago con el `paymentId` informado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemPaymentNotFound'
        '409':
          description: |
            El pago está `REJECTED` o `PENDING`; sólo un pago `APPROVED` o ya
            `REFUNDED` puede reintegrarse. Se conserva el estado del pago.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemPaymentConflict'

  # ─── INVENTORY CANCELLATION (INTERNAL) ─────────────────────────────────────

  /internal/events/{eventId}/cancellation:
    put:
      tags: [Inventory cancellation (internal)]
      operationId: cancelEventInventory
      security: []
      summary: Bloquear nuevas ventas del inventario de un evento cancelado
      description: |
        Llamado por Catalog tras cambiar el estado del evento a `CANCELLED`.
        Marca el inventario como cancelado e impide nuevas reservas. Idempotente;
        repetir la operación devuelve `204` sin cambios adicionales.
      parameters:
