openapi: 3.0.3

info:
  title: TicketYa API - Consolidated contracts
  version: '0.6.0'
  description: |
    Contrato versionado consolidado de TicketYa. Incluye el core de la Entrega 1
    (Catalog, Inventory, Purchase, Ticket y Payment Mock), la seguridad JWT de
    la épica E2-01 (`add-jwt-and-role-security`) y las épicas de Entrega 2:
    - **E2-02 (`add-request-tracing-and-audit-log`):** registro de acceso HTTP
      por solicitud y bitácora centralizada de operaciones críticas
      (Audit Service), consultable por `ADMIN` en `/api/audit/**`.
    - **E2-03 (`validate-ticket-access`):** control de acceso con QR por
      `ACCESS_STAFF` en `/api/access/**` (Ticket Service).
    - **E2-04 (`add-organizer-event-reports`):** reportes de ventas, devoluciones,
      ocupación y recaudación por sector en `/api/reports/**` (Purchase Service).

    Seguridad: autenticación Bearer con JWT firmado por un proveedor externo,
    claims `sub` (UUID) y `roles` (un único valor entre `CLIENT`, `ORGANIZER`,
    `ADMIN` y `ACCESS_STAFF`), validación en el Gateway y propagación de
    identidad derivada a los servicios.

    - **PDF-F11 (`add-customer-notifications`):** notificaciones por email y
      push simulados al confirmar o cancelar una compra, ante la suspensión,
      reanudación o cancelación de un evento y cuando un artista favorito publica
      un evento en la ciudad del cliente. Bandeja del cliente en
      `/api/notifications/me` (Notification Service).

    Superficie pública a través del API Gateway (`http://localhost:8080`):
    - **Catalog público:** `GET /api/events`, `GET /api/events/{id}`.
    - **Catalog gestión (con Bearer JWT):** `POST/PUT/GET /api/venues`,
      `POST/GET /api/management/events`, `GET/PUT /api/management/events/{id}`,
      `PUT /api/management/events/{id}/offerings`, y los comandos
      `publish`, `suspend`, `cancel` y `resume`.
    - **Inventory público:** `GET /api/inventory/events/{eventId}/availability`.
    - **Purchase:** `POST /api/orders`, `GET /api/orders`,
      `GET /api/orders/{orderId}`, `POST /api/orders/{orderId}/reconcile`.
    - **Devoluciones individuales:** `POST /api/refunds/tickets/{ticketId}`,
      `GET /api/refunds/{refundId}`, `POST /api/refunds/{refundId}/decision`.
    - **Cancelación masiva de evento:** `POST /api/events/{eventId}/cancellation`,
      `GET /api/events/{eventId}/cancellation`.
    - **Fila virtual:** `POST /api/queue/events/{eventId}/entries`,
      `GET /api/queue/events/{eventId}/entries/me` y
      `DELETE /api/queue/events/{eventId}/entries/me`.

    Rutas internas (`/internal/**`), sólo en la red de servicios:
    - Inventory: reservas, configuración TTL, cancelación de inventario y
      liberación de unidades vendidas para devoluciones.
    - Catalog: snapshot sin precios y snapshot de compra con precios.
    - Queue: validación y consumo del token de admisión.
    - Ticket: emisión y revocación de entradas QR.
    - Payment Mock: cobro, consulta, reintegro total y reintegro parcial.

    Reglas transversales:
    - La disponibilidad nunca incluye precios, comprador, `orderId` ni
      `reservationId`.
    - `sectorId` y `seatId` son identificadores de Inventory; se descubren en la
      disponibilidad y se reutilizan al reservar.
    - `sourceSectorId` y `sourceSeatId` son identificadores de Catalog y sólo
      aparecen en los snapshots internos y en la respuesta de reserva
      enriquecida.
    - El TTL de retención por defecto es 600 s y el rango permitido es
      60..3600 s.
    - Todos los errores usan `application/problem+json` con `status`, `title`,
      `detail`, `instance` y `correlationId`.
    - Toda solicitud y toda respuesta llevan `X-Correlation-Id`.
    - **Autenticación y roles (Bearer JWT):**
      - Todas las operaciones protegidas requieren
        `Authorization: Bearer <JWT>` con `sub` (UUID) y `roles` (un único
        valor: `CLIENT`, `ORGANIZER`, `ADMIN` o `ACCESS_STAFF`).
      - El Gateway valida firma, expiración y claims; descarta
        `X-User-Id`/`X-User-Role` del cliente y propaga identidad derivada.
      - Operaciones anónimas (sin JWT): `GET /api/events`,
        `GET /api/events/{id}` y
        `GET /api/inventory/events/{eventId}/availability`.
      - Venues: creación/edición `ADMIN`; listado `ORGANIZER`/`ADMIN`.
      - Gestión de eventos: `ORGANIZER`/`ADMIN` con ownership del `sub`
        para ORGANIZER; `suspend`/`cancel`/`resume` exigen `ADMIN`.
      - Purchase: `CLIENT` opera sobre sus recursos (ownership del `sub`);
        `ADMIN` puede consultar órdenes ajenas.
      - `/internal/**` se protege por aislamiento de red; llevan
        `X-Correlation-Id` pero no identidad de usuario.
    - **Nota sobre cancelación:** existen dos endpoints con semántica distinta:
      - `POST /api/management/events/{id}/cancel` (Catalog): cambia el estado
        del evento a `CANCELLED` y notifica a Inventory para bloquear nuevas
        ventas. Es la cancelación lógica del evento.
      - `POST /api/events/{eventId}/cancellation` (Purchase): procesa por lotes
        los reintegros de las compras ya confirmadas del evento cancelado.
        No los confundir; el segundo llama al primero internamente.
    - `POST /api/orders` exige `Idempotency-Key` (1..120 caracteres). La misma
      clave con el mismo contenido devuelve la orden existente; con otro
      contenido responde `409` sin modificarla.
    - **Alta demanda y admisión:** un evento publicado puede estar marcado como
      de alta demanda (`highDemand: true`). En ese caso `POST /api/orders` exige
      el encabezado `X-Admission-Token` con un token de admisión vigente, del
      evento y del comprador, emitido por la fila virtual. El token habilita el
      intento de compra pero **no reserva ni garantiza inventario**: Inventory
      sigue siendo la única autoridad de stock. El token es de un solo uso y se
      consume al intentar la compra; un reintento con la misma
      `Idempotency-Key` no consume un segundo token y reutilizarlo con otra
      clave responde `403`. En los eventos sin la marca la compra no cambia y no
      se exige el encabezado.
    - Estados de orden (`OrderStatus`): `CONFIRMED`, `REJECTED`,
      `PAYMENT_PENDING`, `PAID_PENDING_TICKETS` y `COMPENSATED`. `CONFIRMED`,
      `REJECTED` y `COMPENSATED` son terminales; `PAYMENT_PENDING` y
      `PAID_PENDING_TICKETS` son reconciliables.
    - Estados de pago (`PaymentStatus`): `APPROVED`, `REJECTED`, `PENDING` y
      `REFUNDED`. El resultado simulado se elige con el token documentado
      `tok_approved`, `tok_rejected` o `tok_pending`.
    - Los montos son decimales expresados en la moneda de la orden (ARS en E1) y
      los timestamps son `date-time` en UTC.

servers:
  - url: http://localhost:8080
    description: |
      API Gateway público y único punto de entrada de clientes. Expone las rutas
      públicas y de gestión de Catalog (`/api/venues/**`,
      `/api/management/events/**`, `/api/events/**`), la disponibilidad de
      Inventory (`/api/inventory/**`), órdenes de Purchase (`/api/orders/**`),
      devoluciones (`/api/refunds/**`), cancelación masiva
      (`/api/events/{eventId}/cancellation`) y la fila virtual
      (`/api/queue/**`). Las rutas `/internal/**` no se
      enrutan por el Gateway.
  - url: http://purchase-service:8084
    description: |
      Red interna de Compose. Purchase Service expone órdenes, devoluciones y
      cancelación masiva de eventos, publicadas externamente sólo a través del
      Gateway. No publica puerto al host.
  - url: http://payment-mock:8085
    description: |
      Red interna de Compose. Payment Mock expone cobros, consultas, reintegros
      totales y parciales bajo `/internal/payments/**`. No publica puerto al host
      y el Gateway no lo enruta.
  - url: http://catalog-service:8081
    description: |
      Red interna de Compose. Catalog Service sirve venues, gestión de eventos,
      búsqueda y detalle; los clientes externos deben acceder por el Gateway.
      También expone `GET /internal/events/{eventId}/snapshot` sin precios y
      `GET /internal/events/{eventId}/purchase-snapshot` con precios. No publica
      puerto al host.
  - url: http://inventory-service:8082
    description: |
      Red interna de Compose. Inventory Service expone disponibilidad pública
      (a través del Gateway) y comandos internos de reserva, configuración TTL,
      cancelación de inventario y liberación de unidades vendidas. No publica
      puerto al host.
  - url: http://ticket-service:8083
    description: |
      Red interna de Compose. Ticket Service expone emisión y revocación de
      entradas QR. No publica puerto al host.

security:
  - BearerJWT: []

tags:
  - name: Inventory availability
    description: |
      Consulta pública de disponibilidad a través del API Gateway. No requiere
      autenticación ni encabezados de identidad.
  - name: Inventory reservations (internal)
    description: |
      Comandos internos de reserva, consulta, confirmación y liberación,
      consumidos por Purchase Service. Sólo accesibles dentro de la red de
      servicios; el Gateway no los publica.
  - name: Inventory configuration (internal)
    description: |
      Configuración interna de la retención (TTL) por evento. Sólo accesible
      dentro de la red de servicios.
  - name: Catalog snapshot (internal)
    description: |
      Contrato interno de lectura del snapshot publicado de Catalog, usado por
      Inventory para inicializar el layout de un evento. No incluye precios y no
      se publica por el Gateway.
  - name: Catalog purchase snapshot (internal)
    description: |
      Contrato interno de lectura del snapshot publicado de Catalog con el precio
      de cada sector, usado exclusivamente por Purchase Service para validar
      ítems, fijar precios históricos y emitir tickets. Es independiente del
      snapshot de inventario, que sigue sin precios. Sólo es accesible en la red
      de servicios: el Gateway no publica esta ruta.
  - name: Purchase orders
    description: |
      API pública de órdenes de compra publicada por el API Gateway en
      `http://localhost:8080`. Requiere Bearer JWT válido; el `sub` identifica
      al comprador y para crear una orden se exige `Idempotency-Key`.
      `ADMIN` puede consultar órdenes de cualquier comprador.
      `X-Correlation-Id` es opcional en todas las solicitudes. Los comandos
      internos de Purchase no forman parte de esta superficie.
  - name: Payment processing (internal)
    description: |
      Comandos internos de Payment Mock para cobrar, consultar y reintegrar pagos
      de forma idempotente. Sólo son accesibles dentro de la red de servicios en
      `payment-mock:8085`; el Gateway no publica ninguna de estas rutas.
  - name: Catalog venues (public)
    description: |
      Creación, edición y listado de lugares (venues). Requieren Bearer JWT.
      Creación y edición exigen `ADMIN`; el listado exige `ORGANIZER` o `ADMIN`.
  - name: Catalog event management
    description: |
      Creación, edición y control de estado de eventos. Requieren Bearer JWT con
      `ORGANIZER` o `ADMIN`; los comandos `suspend`, `cancel` y `resume`
      exigen `ADMIN`. `ORGANIZER` sujeto a ownership del `sub`.
  - name: Catalog event discovery (public)
    description: |
      Búsqueda y detalle de eventos publicados sin encabezados de identidad.
  - name: Inventory cancellation (internal)
    description: |
      Bloqueo interno del inventario de un evento cancelado y liberación de
      unidades vendidas durante devoluciones.
  - name: Ticket issuance (internal)
    description: |
      Emisión interna de tickets QR. Consumido por Purchase tras confirmar pago
      e inventario.
  - name: Ticket revocation (internal)
    description: |
      Revocación interna de un ticket tras una devolución aprobada.
  - name: Refunds and cancellation
    description: |
      Devoluciones individuales de tickets y cancelación masiva de eventos con
      reintegros por lotes. Requieren Bearer JWT; la decisión y la
      cancelación masiva exigen `ADMIN`.
  - name: Virtual queue
    description: |
      Fila virtual de los eventos de alta demanda, publicada por el API Gateway
      en `http://localhost:8080`. Requiere Bearer JWT con rol `CLIENT` o `ADMIN`;
      cada cliente sólo ve su propio turno. La entrada es idempotente: repetir el
      alta devuelve el mismo turno y la misma posición. La fila nunca informa la
      disponibilidad de entradas ni reserva inventario.
  - name: Virtual queue (internal)
    description: |
      Contrato interno de validación y consumo del token de admisión, consumido
      por Purchase Service antes de reservar y cobrar. Sólo accesible dentro de
      la red de servicios; el Gateway no publica esta ruta.

  - name: Customer preferences
    description: |
      Preferencias del cliente autenticado (ciudad, tipos de evento y artistas
      favoritos), publicadas por el API Gateway en `http://localhost:8080`.
      Requieren Bearer JWT con rol `CLIENT` y se resuelven exclusivamente por
      el `sub`: ninguna ruta recibe un `customerId`.
  - name: Event recommendations
    description: |
      Recomendaciones explicables de eventos publicados y futuros, derivadas de
      las preferencias del cliente y de su historial de compras. Requieren
      Bearer JWT con rol `CLIENT`, no garantizan disponibilidad ni reservan
      inventario, y degradan con `HISTORY_UNAVAILABLE` si Purchase no responde.
  - name: Recommendation contracts (internal)
    description: |
      Contratos internos de senales de historial (Purchase) y de candidatos
      (Catalog), consumidos solo por Preferences Service dentro de la red de
      servicios. El Gateway no publica ninguna de estas rutas.  - name: Customer notifications
    description: |
      PDF-F11. Bandeja del cliente autenticado (`CLIENT`): notificaciones de
      compra, de cambios del evento y de artistas favoritos, con su canal
      (`EMAIL` o `PUSH`) y estado de entrega (`PENDING`, `SENT`, `FAILED`).
  - name: Notification ingestion (internal)
    description: |
      PDF-F11. Hechos de negocio que Purchase y Catalog envían de forma
      asíncrona (fire-and-forget) a Notification Service. Idempotentes.
  - name: Notification recipients (internal)
    description: |
      PDF-F11. Contratos de sólo lectura que Notification Service usa para
      resolver destinatarios sin acceder a bases ajenas.

paths:

  # ─── CATALOG VENUES ────────────────────────────────────────────────────────

  /api/venues:
    post:
      tags: [Catalog venues (public)]
      operationId: createVenue
      summary: Crear un lugar (venue)
      description: |
        `ADMIN` crea un venue con sectores numerados y/o de admisión general.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueRequest'
            example:
              name: Estadio River
              address: Av. Figueroa Alcorta 7597
              city: Buenos Aires
              latitude: -34.5453
              longitude: -58.4498
              sectors:
                - name: Platea
                  type: NUMBERED
                  capacity: 120
                  seats:
                    - { rowLabel: A, seatNumber: 1 }
                    - { rowLabel: A, seatNumber: 2 }
                - name: Campo
                  type: GENERAL_ADMISSION
                  capacity: 500
      responses:
        '201':
          description: Venue creado exitosamente.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueResponse'
              example:
                id: v1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
                name: Estadio River
                address: Av. Figueroa Alcorta 7597
                city: Buenos Aires
                latitude: -34.5453
                longitude: -58.4498
                sectors:
                  - id: s1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
                    name: Platea
                    type: NUMBERED
                    capacity: 120
                    seats:
                      - { rowLabel: A, seatNumber: 1 }
                      - { rowLabel: A, seatNumber: 2 }
                  - id: s2a2b3c4-d5e6-4f70-8a91-b2c3d4e5f602
                    name: Campo
                    type: GENERAL_ADMISSION
                    capacity: 500
                    seats: []
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway
            rechaza la solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400':
          description: Payload inválido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Rol ADMIN requerido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Catalog venues (public)]
      operationId: listVenues
      summary: Listar venues paginados
      description: |
        Devuelve una página estable de venues. Requiere Bearer JWT con rol
        `ORGANIZER` o `ADMIN`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 }, description: Página base cero. }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 }, description: Ítems por página. }
      responses:
        '200':
          description: Página de venues.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenuePageResponse'
              example:
                content:
                  - id: v1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
                    name: Estadio River
                    address: Av. Figueroa Alcorta 7597
                    city: Buenos Aires
                    latitude: -34.5453
                    longitude: -58.4498
                    sectors: []
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway
            rechaza la solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400':
          description: Paginación inválida.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Rol requerido (ORGANIZER o ADMIN).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/venues/{id}:
    put:
      tags: [Catalog venues (public)]
      operationId: updateVenue
      summary: Actualizar un venue existente
      description: "`ADMIN` actualiza un venue existente."
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueRequest'
      responses:
        '200':
          description: Venue actualizado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueResponse'
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway
            rechaza la solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400':
          description: Payload inválido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Rol ADMIN requerido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Venue no encontrado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─── CATALOG EVENT MANAGEMENT ──────────────────────────────────────────────

  /api/management/events:
    post:
      tags: [Catalog event management]
      operationId: createEvent
      summary: Crear un evento en borrador
      description: |
        ORGANIZER crea para su propia identidad; ADMIN provee `organizerId`.
        El evento queda en estado `DRAFT`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
            example:
              name: Concierto de verano
              description: Evento musical de temporada
              eventType: MUSIC
              startsAt: '2030-01-01T20:00:00-03:00'
              venueId: v1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
              participants: [The Example Band]
              offerings:
                - sectorId: s1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
                  price: 15000.00
      responses:
        '201':
          description: Borrador creado.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
              example:
                id: e88d7b2d-9019-4c3c-8bc4-e0ecc43c955b
                name: Concierto de verano
                description: Evento musical de temporada
                eventType: MUSIC
                startsAt: '2030-01-01T20:00:00-03:00'
                organizerId: 3f1a2b3c-4d5e-4f60-8a91-b2c3d4e5f601
                venueId: v1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
                status: DRAFT
                participants: [The Example Band]
                offerings:
                  - sectorId: s1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f601
                    price: 15000.00
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway
            rechaza la solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400':
          description: Request inválido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Rol o ownership inválido.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Catalog event management]
      operationId: listManageableEvents
      summary: Listar eventos gestionables
      description: |
        ORGANIZER sólo ve sus propios eventos; ADMIN ve todos. Requiere
        Bearer JWT con `ORGANIZER` o `ADMIN`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lista de eventos del usuario.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
        '401':
          description: |
            Token Bearer ausente, inválido o vencido. El Gateway
            rechaza la solicitud antes de invocar el servicio.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
