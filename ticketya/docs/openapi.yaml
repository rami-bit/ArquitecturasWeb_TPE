              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  $ref: '#/components/examples/ProblemNotFound'
        '500':
          description: |
            Error inesperado. El cuerpo es un problema genérico sin trazas,
